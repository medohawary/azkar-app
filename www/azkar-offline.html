لِلهِ تَمْلَآنِ -أَوْ تَمْلَأُ- مَا بَيْنَ السَّمَاوَاتِ وَالْأَرْضِ، وَالصَّلَاةُ نُورٌ، وَالصَّدَقَةُ بُرْهَانٌ، وَالصَّبْرُ ضِيَاءٌ، وَالْقُرْآنُ حُجَّةٌ لَكَ أَوْ عَلَيْكَ، كُلُّ النَّاسِ يَغْدُو، فَبَايِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا».","a":"رواه مسلم","g":"صحيح","e":"يخبر النبي صلى الله عليه وسلم: أن طهارة الظاهر تكون بالوضوء والغسل وهي شرط في الصلاة. وأن قول: \" الحمد لله تملا الميزان\" وهو الثناء عليه سبحانه، ووصفه بصفات الكمال توزن يوم القيامة فتملأ ميزان الأعمال. وأن قول: \"سبحان الله والحمد لله\" وهو تنزيهه عن كل نَقْصٍ ووصفه بالكمال التام الذي يليق بجلاله مع محبته وتعظيمه تملأ ما بين السموات والأرض. وأن \"الصلاة نور\" للعبد في قلبه، وفي وجهه، وفي قبره، وفي حشره. وأن \"الصدقة برهان\" ودليل على صدق إيمان المؤمن، واختلافه عن المنافق الذي يمتنع منها لكونه لا يصدق بموعودها. وأن \"الصبر ضياء\" -وهو حبس النفس عن الجَزَع والتَّسَخُّط - نور يحصل معه حرارة وإحراق، كضياء الشمس؛ لأنه شاق ويحتاج إلى مجاهدة النفس وحبسها عما تهواه؛ فلا يزال صاحبه مستضيئًا مهتديًا مستمرًّا على الصواب. وهو صبر على طاعة الله، وعن معصيته، وصبر على المصائب وأنواع المكاره في الدنيا. وأن \"القرآن حجة لك\" بتلاوته والعمل به، أو \"حجة عليك\" بتركه دون عمل أو تلاوة. ثم أخبر صلى الله عليه وسلم أن كل الناس يسعون وينتشرون ويقومون من نومهم ويخرجون من بيوتهم لأعمالهم المختلفة، فمنهم من يستقيم على طاعة الله فيُعْتِق نفسَه من النار، ومنهم من ينحرف عن ذلك ويقع في المعاصي فيهلكها بدخولها النار.","f":["الطهارة طهارتان: طهارة الظاهر تكون بالوضوء والغسل، وطهارة الباطن تكون بالتوحيد والإيمان والعمل الصالح.","أهمية المحافظة على الصلاة فهي نور للعبد في الدنيا ويوم القيامة.","الصدقة دليل على صدق الإيمان.","أهمية العمل بالقرآن وتصديقه ليكون حجة لك لا عليك.","النفس إن لم تشغلها بالطاعة شغلتك بالمعصية.","كل إنسان لا بد أن يعمل؛ فإما أن يعتق نفسه بالطاعة، أو يوبقها بالمعصية.","الصبر يحتاج إلى تَحَمُّلٍ واحتسابٍ وفيه مشقة."],"r":["صحيح مسلم (1/ 203) (223)، شرح الأربعين لابن دقيق العيد (ص 84)، شرح الأربعين النووية للعثيمين (ص: 231)، الرياض الزكية شرح الأربعين النووية للخضير (ص 293)، فتح القوي المتين في شرح الأربعين للعباد (ص 79)"],"u":"https://hadeethenc.com/ar/browse/hadith/65004"},{"id":3365,"t":"أي العمل أحب إلى الله؟ قال: الصلاة على وقتها، قال: ثم أي؟ قال: ثم بر الوالدين قال: ثم أي؟ قال: الجهاد في سبيل الله","h":"عَنْ عَبْدِ اللَّهِ بِن مَسْعُودٍ رضي الله عنه قَالَ: سَأَلْتُ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: أَيُّ العَمَلِ أَحَبُّ إِلَى اللَّهِ؟ قَالَ: «الصَّلاَةُ عَلَى وَقْتِهَا»، قَالَ: ثُمَّ أَيٌّ؟ قَالَ: «ثُمَّ بِرُّ الوَالِدَيْنِ» قَالَ: ثُمَّ أَيٌّ؟ قَالَ: «الجِهَادُ فِي سَبِيلِ اللَّهِ» قَالَ: حَدَّثَنِي بِهِنَّ، وَلَوِ اسْتَزَدْتُهُ لَزَادَنِي.","a":"متفق عليه","g":"صحيح","e":"سُئلَ النبيُّ صلى الله عليه وسلم: أيُّ العمل أحب إلى الله؟ فقال: الصلاة المفروضة في وقتِها الذي حَدَّده الشارع، ثم بر الوالدين، بالإحسان إليهما، والقيام بحقهما، وترك عقوقهما، ثم الجهاد في سبيل الله، لإعلاء كلمة الله عز وجل، والدفاع عن دين الإسلام وأهله، وإظهار شعائره، وذلك بالنفس والمال. قال ابن مسعود رضي الله عنه: أخبرني بهذه الأعمال؛ ولو قلت له: ثم أي؟ لزادني.","f":["تَفَاضُل الأعمال فيما بينها بحسب محبة الله لها.","حثُّ المسلم على الحرص على الأعمال الأفضل فالأفضل.","تَتَفاوَتُ إجاباتُ النبيِّ صلى الله عليه وسلم عن أفضل الأعمال بحسب اختلاف الأشخاص وأحوالهم، وما هو أكثر نفعًا لكل واحد منهم."],"r":["صحيح البخاري (1/ 112) (527).","صحيح مسلم (1/ 90) (85)."],"u":"https://hadeethenc.com/ar/browse/hadith/3365"},{"id":3512,"t":"بايعت رسول الله صلى الله عليه وسلم على شهادة أن لا إله إلا الله، وأن محمدا رسول الله، وإقام الصلاة، وإيتاء الزكاة، والسمع والطاعة، والنصح لكل مسلم","h":"عَنْ جَرِيرِِ بْنِ عَبْدِ اللَّهِ رضي الله عنه قَالَ: بَايَعْتُ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ عَلَى شَهَادَةِ أَنْ لاَ إِلَهَ إِلَّا اللَّهُ، وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلاَةِ، وَإِيتَاءِ الزَّكَاةِ، وَالسَّمْعِ وَالطَّاعَةِ، وَالنُّصْحِ لِكُلِّ مُسْلِمٍ.","a":"متفق عليه","g":"صحيح","e":"يُخْبِرُ الصحابيُّ جريرُ بنِ عبدِ الله رضي الله عنه أنه التزمَ وعاهَدَ النبيَّ صلى الله عليه وسلم على التوحيد وأداء الصلوات الخمس المفروضات في اليوم والليلة، بشروطها وأركانها وواجباتها وسننها، وعلى أداء الزكاة المكتوبة، وهي عبادة مالية واجبة، تؤخذ من الأغنياء وتعطى المستحقين مِن الفقراء وغيرهم، وعلى الطاعة لولاة الأمر، والنصح لكل مسلم، وذلك بالحرص على منفعته، وإيصال الخير إليه، ودفع الشر عنه بالقول والفعل.","f":["أهمية الصلاة والزكاة، وهما من أركان الإسلام.","أهمية النصح والتناصح بين المسلمين، حتى بايع رسول الله صلى الله عليه وسلم الصحابة رضي الله عنهم عليها."],"r":["صحيح البخاري (1/ 111) (524)، (3/ 72) (2157).","صحيح مسلم (1/ 75) (56)."],"u":"https://hadeethenc.com/ar/browse/hadith/3512"},{"id":3569,"t":"سُئِل رسول الله صلى الله عليه وسلم : أي الصلاة أفضل؟ قال: طُول القُنُوتِ","h":"وعن جابر رضي الله عنه قال: سُئِل رسول الله صلى الله عليه وسلم أي الصلاة أفضل؟ قال: «طُول القُنُوتِ».","a":"رواه مسلم","g":"صحيح","e":"سأل الصحابة رضوان الله عليهم النبي صلى الله عليه وسلم: أي الصلاة أفضل؟ وهذا السؤال من حرصهم على إصابة أكثر قدر من الحسنات، والمراد به: أي أنواع الصلوات أفضل؟ أو: أي أعمال الصلاة أفضل؟ القيام أم الركوع أم السجود؟ فأخبر صلى الله عليه وسلم أنه طول القيام فيها.","f":["أن تطويل القيام في الصلاة أفضل من تطويل الركوع والسجود، على قول، وقيل طول السجود؛ لأن أقرب ما يكون العبد من ربه في حال السجود."],"r":["رياض الصالحين من كلام سيد المرسلين؛ للإمام أبي زكريا النووي، تحقيق د. ماهر الفحل، دار ابن كثير-دمشق، الطبعة الأولى، 1428ه .","- نزهة المتقين شرح رياض الصالحين؛ تأليف د. مصطفى الخِن وغيره، مؤسسة الرسالة-بيروت، الطبعة الرابعة عشر، 1407هـ."],"u":"https://hadeethenc.com/ar/browse/hadith/3569"},{"id":3732,"t":"عليك بكثرة السجود لله، فإنك لا تسجد لله سجدة، إلا رفعك الله بها درجة، وحط عنك بها خطيئة","h":"عَنْ مَعْدَانَ بْنِ أَبِي طَلْحَةَ الْيَعْمَرِيُّ قَالَ: لَقِيتُ ثَوْبَانَ مَوْلَى رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، فَقُلْتُ: أَخْبِرْنِي بِعَمَلٍ أَعْمَلُهُ يُدْخِلُنِي اللهُ بِهِ الْجَنَّةَ؟ أَوْ قَالَ قُلْتُ: بِأَحَبِّ الْأَعْمَالِ إِلَى اللهِ، فَسَكَتَ. ثُمَّ سَأَلْتُهُ فَسَكَتَ. ثُمَّ سَأَلْتُهُ الثَّالِثَةَ فَقَالَ: سَأَلْتُ عَنْ ذَلِكَ رَسُولَ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، فَقَالَ: «عَلَيْكَ بِكَثْرَةِ السُّجُودِ لِلَّهِ، فَإِنَّكَ لَا تَسْجُدُ لِلَّهِ سَجْدَةً، إِلَّا رَفَعَكَ اللهُ بِهَا دَرَجَةً، وَحَطَّ عَنْكَ بِهَا خَطِيئَةً» قَالَ مَعْدَانُ: ثُمَّ لَقِيتُ أَبَا الدَّرْدَاءِ فَسَأَلْتُهُ فَقَالَ لِي: مِثْلَ مَا قَالَ لِي: ثَوْبَانُ.","a":"رواه مسلم","g":"صحيح","e":"سُئِلَ النبيُّ صلى الله عليه وسلم عن العمل الذي يكون سببًا لدخول الجنة أو عن أحب الأعمال إلى الله؟ فقال صلى الله عليه وسلم للسائل: الزم كثرة السجود في الصلاة، فإنك ما سجدت لله سجده إلا رفعك بها درجة، وغفر عنك بها خطيئة.","f":["حث المسلم على الحرص على الصلاة فرضًا وتطوعًا، لاشتمالها على السجود.","بيان فقه الصحابة وعلمهم أن الجنة لا تنال -بعد رحمة الله- إلا بالعمل.","السجود في الصلاة من أعظم أسباب رفعة الدرجات، وغفران الذنوب."],"r":["صحيح مسلم (1/ 353) (488).","كنوز رياض الصالحين، لمجموعة من الباحثين."],"u":"https://hadeethenc.com/ar/browse/hadith/3732"},{"id":4198,"t":"من صلى البردين دخل الجنة","h":"عن أَبِي مُوسَى الأَشْعَرِيِّ رضي الله عنه: أَنَّ رَسُولَ اللهِ صلى الله عليه وسلم قَالَ: «مَنْ صَلَّى ‌الْبَرْدَيْنِ دَخَلَ الْجَنَّةَ»","a":"متفق عليه","g":"صحيح","e":"حَثَّ النبيُّ صلى الله عليه وسلم على الحرصِ على صلاة البردين وهما صلاة الفجر والعصر، وبشَّر مَن أتى بهما بحقهما من وقت وجماعة وغير ذلك كانتا سببًا في دخوله الجنة.","f":["فضل المحافظة على صلاة الفجر والعصر؛ لأن الفجر يكون عند لذة النوم، والعصر يكون عند اشتغال الإنسان بعمله، فمن حافظ عليهما كان من باب أولى أن يحافظ على بقية الصلوات.","سميت صلاة الفجر والعصر بالبردين؛ لأن صلاة الفجر فيها برد الليل، وصلاة العصر فيها برد النهار وإن كانت في وقتٍ حارٍ إلا أنه أخف من الوقت قبلها، أو تكون تسميتُها من باب التغليب كما يقال: القمران للشمس والقمر."],"r":["صحيح البخاري (1/ 119) (574).","صحيح مسلم (1/ 440) (635)."],"u":"https://hadeethenc.com/ar/browse/hadith/4198"},{"id":4968,"t":"أرأيتم لو أن نهرا بباب أحدكم يغتسل فيه كل يوم خمسا، ما تقول ذلك يبقي من درنه؟","h":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه أَنَّهُ سَمِعَ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: «أَرَأَيْتُمْ لَوْ أَنَّ نَهَرًا بِبَابِ أَحَدِكُمْ يَغْتَسِلُ فِيهِ كُلَّ يَوْمٍ خَمْسًا، مَا تَقُولُ ذَلِكَ يُبْقِي مِنْ دَرَنِهِ؟» قَالُوا: لَا يُبْقِي مِنْ دَرَنِهِ شَيْئًا، قَالَ: «فَذَلِكَ مِثْلُ الصَّلَوَاتِ الخَمْسِ، يَمْحُو اللَّهُ بِهِ الخَطَايَا».","a":"متفق عليه","g":"صحيح","e":"شَبَّهَ النبيُّ صلى الله عليه وسلم الصلواتِ الخمس في كلِّ يومٍ وليلةٍ في إزالتِها وتكفيرِها لصغائر الذنوب والخطايا بِنَهْرٍ على بابِ الإنسان يَغتسلُ منه كلَّ يومٍ خمسَ مرات، فلا يبقى مِن دَرَنِهِ ووَسَخِهِ شيءٌ.","f":["هذا الفضلُ خاصٌّ بتكفير الصغائر، أما الكبائر فلا بُد من التوبة منها.","فضل أداء الصلوات الخمس والمحافظة عليها بشروطِها وأركانِها وواجباتِها وسننِها."],"r":["صحيح البخاري (1/ 112) (528).","صحيح مسلم (1/ 462) (667)."],"u":"https://hadeethenc.com/ar/browse/hadith/4968"},{"id":6215,"t":"لن يلج النار أحد صلى قبل طلوع الشمس وقبل غروبها","h":"عَنِ أبي زُهير عُمَارَةَ بْنِ رُؤَيْبَةَ رضي الله عنه قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «لَنْ يَلِجَ النَّارَ أَحَدٌ صَلَّى قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ غُرُوبِهَا»","a":"رواه مسلم","g":"صحيح","e":"يُخْبِرُ رسولُ الله صلى الله عليه وسلم: أنه لن يدخلَ النارَ، أحدٌ صلّى صلاة الفجر، وصلاة العصر، وداوم عليهما؛ وخَصَّ هاتين الصلاتين؛ لأنهما أثقلُ الصلوات، ولأنّ وقت الصبح يكون عند النوم ولَذَّتِه، ووقت العصر يكون عند الاشتغال بأعمال النهار وتجارته، ومَن حافَظَ على هاتين الصلاتَين مع وُجودِ المَشقّة فسيحافظ على بَقيّة الصلوات.","f":["فضل صلاتي الصبح والعصر، فينبغي المحافظة عليهما.","مَن أدَّى هذه الصلوات يكون غالبًا خالي النفس من الكَسَل والرياء مُحِبًّا للعبادة."],"r":["صحيح مسلم (1/ 440) (634)."],"u":"https://hadeethenc.com/ar/browse/hadith/6215"},{"id":4196,"t":"من صام رمضان إيمانا واحتسابا غفر له ما تقدم من ذنبه","h":"عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ»","a":"متفق عليه","g":"صحيح","e":"يُخبِرُ النبيُّ صلى الله عليه وسلم أنَّ مَن صام شهر رمضان إيمانًا بالله، وتصديقًا بفَرْضِيَّةِ الصيام وما أعدَّ الله تعالى للصائمين مِن جَزيل الأجور والثواب، قاصدًا به وجهَ الله تعالى لا رياء ولا سُمْعَة، غُفرتْ له ذنوبُه الماضية.","f":["فضل الإخلاص وأهميته في صيام رمضان وغيره من الأعمال الصالحة."],"r":["صحيح البخاري (1/ 16) (38).","صحيح مسلم (1/ 523) (760)."],"u":"https://hadeethenc.com/ar/browse/hadith/4196"},{"id":3546,"t":"قال الله: كل عمل ابن آدم له، إلا الصيام، فإنه لي وأنا أجزي به","h":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: «قَالَ اللَّهُ: كُلُّ عَمَلِ ابْنِ آدَمَ لَهُ، إِلَّا الصِّيَامَ، فَإِنَّهُ لِي وَأَنَا أَجْزِي بِهِ، وَالصِّيَامُ جُنَّةٌ، وَإِذَا كَانَ يَوْمُ صَوْمِ أَحَدِكُمْ فَلاَ يَرْفُثْ وَلاَ يَصْخَبْ، فَإِنْ سَابَّهُ أَحَدٌ أَوْ قَاتَلَهُ، فَلْيَقُلْ إِنِّي امْرُؤٌ صَائِمٌ، وَالَّذِي نَفْسُ مُحَمَّدٍ بِيَدِهِ، لَخُلُوفُ فَمِ الصَّائِمِ أَطْيَبُ عِنْدَ اللَّهِ مِنْ رِيحِ المِسْكِ، لِلصَّائِمِ فَرْحَتَانِ يَفْرَحُهُمَا: إِذَا أَفْطَرَ فَرِحَ، وَإِذَا لَقِيَ رَبَّهُ فَرِحَ بِصَوْمِهِ».","a":"متفق عليه","g":"صحيح","e":"أَخْبَرَ النبيُّ صلى الله عليه وسلم أنَّ الله تعالى يقول في الحديث القدسي: كل عمل ابن آدم يُضاعَف الحسنةُ بعشرِ أمثالها إلى سبعمائة ضعف، إلا الصيام؛ فإنه لي حيث لا يقع فيه الرياء، وأنا أجزي به فأَنْفَرِد بِعلِم مِقدار ثوابه وتضعيف حسناته. ثم قال: (والصيام جُنّة) ووقاية وسِتْر وحِصْن حَصِيْن مِن النار؛ لأنه إمساك عن الشهوات والوقوع بالآثام، والنارُ مَحْفُوفة بالشهوات. (فإذا كان يوم صوم أحدكم فلا يرفث) بالجماع ومُقَدِّماته، ولا بالكلام الفاحش مطلقًا. (ولا يَصخب) بالخِصَام والصِّياح. (فإنْ سابّه أحد أو قاتله) في رمضان فليقل: إني امرؤٌ صائم؛ لعله يكف عنه، فإنْ أصرَّ إلا المقاتلة حقيقة دَفَعَهُ بالأخفِّ فالأخف كالصَّائل. ثم حَلَف صلى الله عليه وسلم وأقسم بالذي نفسه بيده أنَّ تَغَيُّرَ رائحةِ فمِ الصائم بسبب الصيام أطيبُ عند الله يوم القيامة من ريح المِسْك عندكم، وأكثر ثوابًا من المسك المندوب إليه في الجُمَع ومجالس الذكر. وللصائم فرحتان يفرحهما: إذا أفطر فَرِح بفطره بزوال جوعه وعطشه حيث أُبِيْحَ له الفطر، وفَرِحَ بتمام صومه وخاتمة عبادته، وتخفيف من ربه، ومعونة على مستقبل صومه. (وإذا لقي ربه فرح بصومه) بجزائه وثوابه.","f":["فضل الصيام وأنه يحفظ صاحبَه في الدنيا من الشهوات، وفي الآخرة من عذاب النار.","من آداب الصوم ترك الكلام الفاحش واللَّغَط، والصبر على أذَى الناس ومقابلة إساءتهم بالصبر والإحسان.","الصائم أو العابد إذا فَرِح بسبب إكمال عبادته والانتهاء منها لم ينقص ذلك من أجره في الآخرة.","الفرحة الكاملة هي بلقاء الله تعالى، عندما يُوَفَّى الصابرون والصائمون أجرهم بغير حساب.","إعلام الناس بالطاعة عند الحاجة والمصلحة ليس من الرياء لقوله: (إني صائم).","الصائم الكامل صومه هو الذي صامت جوارحه عن الآثام، ولسانه عن الكذب والفحش، وقول الزور، وبطنه عن الطعام والشراب.","تأكيد النهي عن الصَّخَب والخِصام والصِّياح حالَ الصوم، وإلا فَغَيْرُ الصائم مَنهيٌّ عن ذلك أيضًا.","هذا الحديث مما يرويه النبي صلى الله عليه وسلم عن ربه، ويسمى بالحديث القدسي أو الإلهي، وهو الذي لفظه ومعناه من الله، غير أنه ليست فيه خصائص القرآن التي امتاز بها عما سواه، مِن التَّعَبُّد بتلاوته والطهارة له والتَّحَدِّي والإعجاز وغير ذلك."],"r":["صحيح البخاري (3/ 26) (1904).","صحيح مسلم (2/ 807) (1151)."],"u":"https://hadeethenc.com/ar/browse/hadith/3546"},{"id":5863,"t":"من استطاع الباءة فليتزوج، فإنه أغض للبصر، وأحصن للفرج، ومن لم يستطع فعليه بالصوم، فإنه له وجاء","h":"عَن عَبْدِ اللَّهِ بنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: كُنَّا مَعَ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، فَقَالَ: «مَنِ اسْتَطَاعَ البَاءَةَ فَلْيَتَزَوَّجْ، فَإِنَّهُ أَغَضُّ لِلْبَصَرِ، وَأَحْصَنُ لِلْفَرْجِ، وَمَنْ لَمْ يَسْتَطِعْ فَعَلَيْهِ بِالصَّوْمِ، فَإِنَّهُ لَهُ وِجَاءٌ».","a":"متفق عليه","g":"صحيح","e":"حَثَّ النبيُّ صلى الله عليه وسلم مَن قَدَر على الجماع ومُؤَن النكاح بالزواج؛ فإنه أحفظ لبصره عن الحرام، وأشد إحصانًا لفرجه، ومنعًا من الوقوع في الفاحشة، ومن لم يستطع مُؤنَ النكاح وهو قادر على الجماع فعليه بالصوم فإنه يقطع شهوة الفرج وشر المني.","f":["حرص الإسلام على أسباب العفَّة والسلامة من الفواحش.","حث من لم يستطع مؤنة النكاح بالصوم؛ لأنه يضعف الشهوة.","وجه تشبيه الصيام بالوجاء؛ لأن الوِجاء رضُّ عروق الخِصْيَتَين، فتذهب بذهابهما شهوة الجماع، وكذلك الصوم، فهو مُضعِف لشهوة الجماع."],"r":["صحيح البخاري (3/ 26) (1905).","صحيح مسلم (2/ 1018) (1400)."],"u":"https://hadeethenc.com/ar/browse/hadith/5863"},{"id":3738,"t":"إن في الجنة بابا يقال له الريان، يدخل منه الصائمون يوم القيامة، لا يدخل منه أحد غيرهم","h":"عَنْ ‌سَهْلٍ رَضِيَ اللهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: «إِنَّ فِي الْجَنَّةِ بَابًا يُقَالُ لَهُ الرَّيَّانُ، يَدْخُلُ مِنْهُ الصَّائِمُونَ يَوْمَ الْقِيَامَةِ، لَا يَدْخُلُ مِنْهُ أَحَدٌ غَيْرُهُمْ، يُقَالُ: أَيْنَ الصَّائِمُونَ، فَيَقُومُونَ لَا يَدْخُلُ مِنْهُ أَحَدٌ غَيْرُهُمْ، فَإِذَا دَخَلُوا أُغْلِقَ، فَلَمْ يَدْخُلْ مِنْهُ أَحَدٌ».","a":"متفق عليه","g":"صحيح","e":"أخبر النبي صلى الله عليه وسلم أن بابًا من أبواب الجنة يسمى: ‌باب ‌الريان، يدخل منه الصائمون يوم القيامة، لا يدخل منه أحد غيرهم، ينادى: أين الصائمون، فيقومون ويدخلون، لا يدخل منه أحد غيرهم، فإذا دخل آخرهم أغلق، فلم يدخل منه أحد بعد.","f":["قال النووي: في هذا الحديث فضيلة الصيام وكرامة الصائمين.","أفرد الله للصائمين بابًا من أبواب الجنة الثمانية، إذا دخلوه أغلق.","بيان أن للجنة أبوابًا.","قال السندي: قوله: (أين الصائمون)، أي المكثرون الصيام كالعادل والظالم، يقال لمن يعتاد ذلك، لا لمن يفعل ذلك مرة.","(الريان) يعني الذي يروي؛ لأن الصائمين يعطشون ولاسيما في أيام الصيف الطويلة الحارة؛ فيجازون بتسمية هذا الباب بما يختص بهم، باب الريان، وقيل الريان فعلان كثير الري ضد العطش، سمى به؛ لأنه جزاء الصائمين على عطشهم وجوعهم."],"r":["صحيح البخاري (3/ 25) (1896).","صحيح مسلم (2/ 808) (1152)."],"u":"https://hadeethenc.com/ar/browse/hadith/3738"},{"id":65491,"t":"إذا دخل رمضان فُتِحت أبواب الجنة وغُلِّقت أبواب جهنم وسُلْسِلَت الشياطين","h":"عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «إذا دخل رمضان فُتِحت أبواب الجنة وغُلِّقت أبواب جهنم وسُلْسِلَت الشياطين»، وفي رواية للبخاري: «أبواب السماء»، وفي رواية لمسلم: «أبواب الرحمة».","a":"متفق عليه","g":"صحيح","e":"أخبر رسول الله صلى الله عليه وسلم أنه حين دخول شهر رمضان تفتح أبواب الجنة، تقريبًا للرحمة للعباد، أو أبواب السماء أو أبواب الرحمة، وهي روايات لا تنافي بينها؛ لأن الجنة في السماء، وهي من آثار رحمة الله تعالى بالمؤمنين، وتغلق أبواب جهنم، تبعيدًا للعقاب عن العباد، وشدت الشياطين بالسلاسل حقيقة، والمراد مسترقو السمع منهم أو المردة، وعليه فهم لا يصلون من إفساد المسلمين إلى ما يصلون إليه في غيره لاشتغالهم فيه بالصيام الذي فيه قمع الشيطان، وإن وقع شيء من ذلك فهو قليل بالنسبة إلى غيره وهذا أمر محسوس، وهذا الحديث لا ينافي وقوع المعاصي؛ لأنها إنما تقل عن الصائمين الصوم الذي حوفظ على شروطه وروعيت آدابه، أو المصفَّد بعض الشياطين وهم المردة لاكلهم كما في بعض الروايات، أو المقصود تقليل الشرور فيه، وهذا أمر محسوس فإن وقوع ذلك فيه أقل من غيره، ولا يلزم من تصفيد جميعهم ألا يقع شر ولا معصية لأن لذلك أسبابا غير الشياطين كالنفوس الخبيثة والعادات القبيحة والشياطين الإنسية.","f":["بيان فضل شهر رمضان.","الإيمان بالجنة والنار، وأنهما الآن موجودتان، وأن لهما أبوابًا تفتح وتغلق.","إثبات وجود الشياطين، وأنهم أجسام يمكن شدها بالأغلال، وأن منهم مردة يغلون بالأغلال في شهر رمضان؛ لئلا يبطلوا أعمال الصائمين.","بيان عظمة لطف الله سبحانه وتعالى، وكثرة كرمه وإحسانه على عباده، حيث يحفظ لهم صيامهم، ويدفع عنهم أذى المردة من الشياطين؛ لئلا يفسدوا عليهم عبادتهم في هذا الشهر المبارك الذي تضاعف فيه الحسنات، وتقال فيه العثرات.","جواز أن يقال: \"رمضان\" من غير ذكر الشهر، بلا كراهة."],"r":["صحيح البخاري (4/ 123) (3277)، (3/ 25) (1899)، صحيح مسلم (2/ 758) (1079)، فتح الباري لابن حجر (4/ 114)، إرشاد الساري لشرح صحيح البخاري (3/ 351)، البحر المحيط الثجاج في شرح صحيح الإمام مسلم بن الحجاج (20/ 369)."],"u":"https://hadeethenc.com/ar/browse/hadith/65491"},{"id":65524,"t":"أَرِينيه فلقد أصبحت صائمًا","h":"عن أم المؤمنين عائشة رضي الله عنها قالت: دخل علي النبي صلى الله عليه وسلم ذات يوم فقال: «هل عندكم شيء؟» فقلنا: لا. قال: «فإني إذن صائم» ثم أتانا يومًا آخر فقلنا: يا رسول الله، أهدي لنا حيس. فقال: «أَرِينيه، فلقد أصبحت صائمًا» فأكل.","a":"رواه مسلم","g":"صحيح","e":"دخل النبي صلى الله عليه وسلم على عائشة رضي الله عنها فسألها: هل يوجد طعام؟ فأجابت بأنه لا يوجد، فقال: إني إذن صائم، وهذا يدل على جواز نية النفل في النهار، إذا كان لم يأكل، ثم دخل عليها في يوم آخر فأخبرته أن ناسًا أهدوه طعام من تمر مخلوط بسمنٍ وأقطٍ، وهو الحَيس، فقال: أحضريه وأعطينيه، فلقد أصبحت مريدًا للصوم ثم أكل منه وأفطر، فدل على جواز قطع الصوم إذا لم يكن واجبًا.","f":["بيان جواز صوم التطوع بنية من النهار.","جواز الفطر للمتطوع متى شاء، ولو بلا عذر.","ما كان عليه النبي صلى الله عليه وسلم من التقلل من الدنيا والزهد في الملذات الفانية؛ إيثارا لما عند الله، من نعيم الآخرة، لدرجة ألا يوجد طعامٌ في بيته في بعض الأيام.","ما كان عليه الصحابة رضي الله عنه من مواساة رسول الله صلى الله عليه وسلم بما عندهم من طيبات الطعام.","ما كان عليه النبي صلى الله عليه وسلم من قبول الهدية."],"r":["صحيح مسلم (2/ 809) (1154)، النهاية في غريب الحديث والأثر (245)، البحر المحيط الثجاج في شرح صحيح الإمام مسلم بن الحجاج (21/ 387)."],"u":"https://hadeethenc.com/ar/browse/hadith/65524"},{"id":10107,"t":"إذا جاء رمضان فتحت أبواب الجنة، وغلقت أبواب النار، وصفدت الشياطين","h":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ أَنَّ رَسُولَ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، قَالَ: «إِذَا جَاءَ رَمَضَانُ فُتِّحَتْ أَبْوَابُ الْجَنَّةِ، وَغُلِّقَتْ أَبْوَابُ النَّارِ، وَصُفِّدَتِ الشَّيَاطِينُ».","a":"متفق عليه","g":"صحيح","e":"أخبرَ النبيُّ صلى الله عليه وسلم أنه إذا دخل شهر رمضان حصلت ثلاثة أمور: الأول: تفتح أبواب الجنة فلم يغلق منها باب. الثاني: تغلق أبواب النيران فلم يفتح منها باب. الثالث: تشد الشياطين ومردة الجن بالسلاسل، فلا يخلصون إلى ما كانوا يخلصون إليه في غير رمضان. وكل ذلك تعظيم لهذا الشهر، وترغيب للعاملين بكثرة الطاعات من صلاة وصدقة وذكر وقراءة للقرآن وغير ذلك؛ وبالابتعاد عن الذنوب والمعاصي.","f":["فضل شهر رمضان.","بشارة للصائمين فيه بأن هذا الشهر المبارك موسم عبادة وخير.","في تصفيد الشياطين في رمضان إشارة إلى رفع عذر المكلف وكأنه يقال له: قد كُفّت الشياطين عنك فلا تعتذر بهم في ترك الطاعة ولا في فعل المعصية.","قال القرطبي: فإن قيل: كيف نرى الشرور والمعاصي واقعة في رمضان كثيرًا فلو صفدت الشياطين لم يقع ذلك؟ فالجواب: أنها إنما تقل عن الصائمين الصوم الذي حوفظ على شروطه وروعيت آدابه، أو المصفد بعض الشياطين وهم المردة لا كلهم كما تقدم في بعض الروايات، أو المقصود تقليل الشرور فيه، وهذا أمر محسوس، فإن وقوع ذلك فيه أقل من غيره، إذ لا يلزم من تصفيد جميعهم أن لا يقع شر ولا معصية؛ لأن لذلك أسبابًا غير الشياطين كالنفوس الخبيثة والعادات القبيحة والشياطين الإنسية."],"r":["صحيح البخاري (3/ 25) (1899).","صحيح مسلم (2/ 758) (1079)."],"u":"https://hadeethenc.com/ar/browse/hadith/10107"},{"id":3232,"t":"يستجاب لأحدكم ما لم يعجل: يقول: قد دعوت ربي، فلم يستجب لي","h":"عن أبي هريرة رضي الله عنه مرفوعاً: يُستجاب لأحدكم ما لم يَعْجَلْ: يقول: قد دعوت ربي، فلم يستجب لي». وفي رواية لمسلم: «لا يزال يُستجاب للعبد ما لم يَدْعُ بإثم، أو قطيعة رحم، ما لم يَسْتَعْجِلْ» قيل: يا رسول الله ما الاستعجال؟ قال: «يقول: قد دعوت، وقد دعوت، فلم أر يستجب لي، فَيَسْتَحْسِرُ عند ذلك ويَدَعُ الدعاء».","a":"متفق عليه","g":"صحيح","e":"يخبر صلى الله عليه وسلم أنه يستجاب للعبد دعاؤه ما لم يدع بمعصية أو قطيعة رحم، وما لم يستعجل، فقيل: يا رسول الله ما الاستعجال المرتب عليه المنع من إجابة الدعاء، قال: يقول: قد دعوت وقد دعوت، وتكرر مني الدعاء، فلم يستجب لي؛ فيستعجل عند ذلك ويترك الدعاء.","f":["الحث على الدعاء؛ فإنه لب العبادة.","من موانع إجابة الدعاء الاستعجال والضجر وترك الدعاء، وكذلك الدعاء بإثم وقطيعة رحم.","تكفل الله بإجابة دعاء المسلم.","الاستعجال يؤدي إلى الفتور والانقطاع عن عبادة الدعاء.","الأمر كله بيد الله، وقد جعل لكل شيء قدراً."],"r":["- صحيح البخاري، للإمام محمد بن إسماعيل البخاري، تحقيق محمد الناصر، دار طوق النجاة.","- صحيح مسلم، للإمام مسلم بن الحجاج النيسابوري، تحقيق محمد فؤاد عبد الباقي، دار إحياء التراث العربي."],"u":"https://hadeethenc.com/ar/browse/hadith/3232"},{"id":65326,"t":"أُنزِل {ولا تجهر بصلاتك ولا تخافت بها} في الدعاء","h":"عن عائشة رضي الله عنها في قوله عز وجل: {ولا تجهر بصلاتك ولا تخافت بها} [الإسراء: 110] قالت: أنزل هذا في الدعاء.","a":"متفق عليه","g":"صحيح","e":"أخبرت عائشة أن قول الله عز وجل: {ولا تجهر بصلاتك ولا تخافت بها} نزل في الأمر بالدعاء، أي أن يكون الدعاء بصوت متوسط بحيث يُسمع نفسه، فلا يجهر بصوته عاليًا، ولا يُخافِتُ به ويخفضه.","f":["سبب نزول الآية الكريمة.","عدم المبالغة بالجهر بالدعاء أو خفض الصوت فيه."],"r":["صحيح البخاري (6/ 87) (4723)، صحيح مسلم (1/ 329) (447)، النهاية في غريب الحديث و الأثر ( ص176، 273)."],"u":"https://hadeethenc.com/ar/browse/hadith/65326"},{"id":65488,"t":"كان النبي صلى الله عليه وسلم لا يرفع يديه في شيء من دعائه إلا في الاستسقاء","h":"عن أنس بن مالك قال: كان النبي صلى الله عليه وسلم لا يرفع يديه في شيء من دعائه إلا في الاستسقاء، وإنه يرفع حتى يرى بياض إبطيه.","a":"متفق عليه","g":"صحيح","e":"أخبر أنس بن مالك أن النبي صلى الله عليه وسلم كان لا يرفع يديه للدعاء إلا في دعاء الاستسقاء، وكان في الاستسقاء يرفعها رفعًا شديدًا حتى يظهر بياض إبطيه عليه الصلاة والسلام، لأن لابس الرداء إذا رفع يديه يظهر إبطه، ويحمل النفي في هذا الحديث على صفة مخصوصة، إما أنه في خطبة الجمعة؛ لوروده في أحاديث أخرى، أنه كان لا يرفع يديه في خطبة الجمعة، إنما يشير بأصبَعه، وإما أن المراد بالنفي في حديث أنس الرفع البليغ، كما يدل عليه قوله: حتى يرى بياض إبطيه، وإما على صفة اليدين في ذلك، كما ذُكر في حديث آخر أنه أشار بظهر كفيه إلى السماء، فلا يفعل هذا الرفع إلا في الاستسقاء، أو يحمل على نفي رؤية أنس رضي الله عنه للرفع إلا في الاستسقاء، وهو لا يستلزم نفي رؤية غيره، ورواية المثبت مقدمة على النافي، فقد جاء رفع اليد في مواطن أخرى، مثل حديث أبي موسى أنالنبي صلى الله عليه وسلم دعا بماء فتوضأ، ثم رفع يديه فقال: «اللهم اغفر لعبيد أبي عامر». ورأيت بياض إبطيه، ثم قال: «اللهم اجعله يوم القيامة فوق كثير من خلقك من الناس» متفق عليه. والحاصل: استحباب الرفع في كل دعاء إلا ما جاء من الأدعية مقيدًا بما يقتضي عدمه، كدعاء الركوع والسجود ونحوهما.","f":["استحباب رفع اليدين في الدعاء للاستسقاء.","من صفات النبي صلى الله عليه وسلم الخَلقية أن إبطه أبيض غير متغير اللون.","استحباب رفع الكفين في كل دعاء إلا ما جاء من الأدعية مقيدًا بما يقتضي عدمه، كدعاء الركوع والسجود ونحوهما."],"r":["صحيح البخاري (2/ 32) (1031)، صحيح مسلم (2/ 612) (895)، النهاية في غريب الحديث والأثر (436)، إرشاد الساري لشرح صحيح البخاري (2/ 252) (6/ 33)."],"u":"https://hadeethenc.com/ar/browse/hadith/65488"},{"id":5978,"t":"لا يقل أحدكم: اللهم اغفر لي إن شئت، ارحمني إن شئت، ارزقني إن شئت، وليعزم مسألته، إنه يفعل ما يشاء، لا مكره له","h":"عَن أَبِي هُرَيْرَةَ رضي الله عنه عَنِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، قَالَ: «لاَ يَقُلْ أَحَدُكُمْ: اللَّهُمَّ اغْفِرْ لِي إِنْ شِئْتَ، ارْحَمْنِي إِنْ شِئْتَ، ارْزُقْنِي إِنْ شِئْتَ، وَليَعْزِمْ مَسْأَلَتَهُ، إِنَّهُ يَفْعَلُ مَا يَشَاءُ، لاَ مُكْرِهَ لَهُ». ولمسلم: «وَلَكِنْ لِيَعْزِمِ الْمَسْأَلَةَ وَلْيُعَظِّمِ الرَّغْبَةَ، فَإِنَّ اللهَ لَا يَتَعَاظَمُهُ شَيْءٌ أَعْطَاهُ».","a":"متفق عليه","g":"صحيح","e":"نَهَى النبيُّ صلى الله عليه وسلم عن تَعْلِيْق الدعاء بشيء حتى لو كان بمشيئة الله؛ فإن ذلك أمر معلوم مُتَيَقَّن أنه لا يغفر إلا أن يشاء سبحانه، ولا معنى لاشتراط المشيئة؛ لأنها إنما تشترط فيمن يصح منه أن يفعل دون أن يشاء بالإكراه وغيره مما تنزه الله سبحانه عنه، وقد بين ذلك صلى الله عليه وسلم في آخر الحديث بقوله فإنه لا مُكْرِه له، كما أن الله لا يَتَعَاظَمُه شيء أعطاه وليس بعاجز ولا يكبُر عليه شيء حتى يقال: إن شئت، وتعليقه بالمشيئة نوع من الاستغناء عن مغفرته، فقول القائل: إن شئت أن تعطيني كذا فافعل، لا يستعمل هذا إلا مع الغنى عنه أو مع العاجز، وأما مع القادر ومع الاضطرار إليه والحاجة إليه فإنه يَعزم مسألته، ويَسأل سؤال فقير مضطر إلى ما سأله، ويلجأ إلى الله؛ لأنه الغني الكامل، القادر على كل شيء.","f":["النهي عن تعليق الدعاء بالمشيئة.","تنزيه الله عما لا يليق به، وسعة فضله، وكمال غناه، وكرمه وجوده سبحانه وتعالى.","إثبات الكمال لله عز وجل.","تعظيم الرغبة فيما عند الله وحسن الظن به سبحانه.","يقع من بعض الناس تعليق الدعاء بالمشيئة وهم لا يشعرون، مثل قول: جزاك الله خيرًا إن شاء الله، الله يرحمه إن شاء الله، فهذا لا يجوز لحديث الباب."],"r":["صحيح البخاري (9/ 140) (7477).","صحيح مسلم (4/ 2063) (2679)."],"u":"https://hadeethenc.com/ar/browse/hadith/5978"},{"id":4318,"t":"إن الله عز وجل يبسط يده بالليل ليتوب مسيء النهار، ويبسط يده بالنهار ليتوب مسيء الليل، حتى تطلع الشمس من مغربها","h":"عَنْ أَبِي مُوسَى رضي الله عنه عَنِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: «إِنَّ اللهَ عَزَّ وَجَلَّ يَبْسُطُ يَدَهُ بِاللَّيْلِ لِيَتُوبَ مُسِيءُ النَّهَارِ، وَيَبْسُطُ يَدَهُ بِالنَّهَارِ لِيَتُوبَ مُسِيءُ اللَّيْلِ، حَتَّى تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا».","a":"رواه مسلم","g":"صحيح","e":"يُخبِرُ النبيُّ صلى الله عليه وسلم: أنَّ الله تعالى يقبل التوبة من عباده، فإن أذنب العبد ذنبًا بالنهار وتاب بالليل قَبِلَ الله توبته، وإن أذنب ذنبًا بالليل وتاب بالنهار قَبل الله توبته، ويبسط يده سبحانه للتوبة فرحًا بها، وقبولًا لها، ولا يزال باب التوبة مفتوحًا حتى تطلع الشمس من مغربها إيذانًا بانتهاء الدنيا، فإذا طلعت فإن باب التوبة يُغلق.","f":["قبول التوبة مستمر ما دام بابها مفتوحًا، ويغلق بابها بمطلع الشمس من مغربها، وأن يتوب الإنسان قبل غرغرة الموت، وهي وصول الروح إلى الحلقوم.","عدم اليأس والقنوط بسبب الذنب، فإن عفو الله سبحانه ورحمته واسعة، وباب التوبة مفتوح.","شروط التوبة: الأول: الإقلاع عن المعصية، والثاني: الندم على فعلها، والثالث: العزم على ألّا يعود إليها أبدًا، هذا إن كانت في حقوق الله تعالى، وإن كانت متعلِّقة بحق من حقوق العباد، فيشترط لصحة التوبة أن يؤدي ذلك الحق إلى صاحبه، أو يعفو عنه صاحب الحق."],"r":["صحيح مسلم (4/ 2113) (2759).","نزهة المتقين شرح رياض الصالحين، لمجموعة من الباحثين (1/ 35)."],"u":"https://hadeethenc.com/ar/browse/hadith/4318"},{"id":4797,"t":"مَنْ تَابَ قَبْلَ أَنْ تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا تَابَ اللهُ عَلَيْهِ","h":"عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم : «مَنْ تَابَ قَبْلَ أَنْ تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا تَابَ اللهُ عَلَيْهِ».","a":"رواه مسلم","g":"صحيح","e":"يفيد الحديث أن الله سبحانه وتعالى يقبل التوبة من عبده المذنب ما لم تطلع الشمس من مغربها؛ لأنها نهاية وقت قبول التوبة وهي من علامات الساعة الكبرى.","f":["الله تعالى يقبل التوبة من عباده تفضلا منه إذا كانت مستجمعة لشروطها، ومن شروطها: أن تقع من التائب قبل طلوع الشمس من مغربها.","الله- سبحانه وتعالى- يقبل توبة العبد وإن تأخرت، لكن المبادرة بالتوبة هي الواجب.","بقي من شروط التوبة:- الندم على الذنب.- العزم على عدم العودة إليه.- الإقلاع والترك للذنب.- إن كان لآدمي حق أن يعيده لصاحبه."],"r":["-نزهة المتقين شرح رياض الصالحين، نشر: مؤسسة الرسالة، الطبعة: الرابعة عشر، 1407هـ - 1987م.","-شرح رياض الصالحين، لابن عثيمين، نشر: دار الوطن للنشر، الرياض، الطبعة: 1426هـ."],"u":"https://hadeethenc.com/ar/browse/hadith/4797"},{"id":3656,"t":"أن رجلاً أصاب من امرأةٍ قُبْلَةً، فأتى النبي صلى الله عليه وسلم فأخبره، فأنزل الله تعالى : (وأقم الصلاة طرفي النهار وزلفا من الليل إن الحسنات يذهبن السيئات)","h":"عن ابن مسعود رضي الله عنه مرفوعاً: أن رجلاً أصاب من امرأةٍ قُبْلَةً، فأتى النبي صلى الله عليه وسلم فأخبره، فأنزل الله تعالى : (وأقم الصلاة طَرَفَيِ النَّهَار وزُلَفًا مِنَ اللَّيلِ إِنَّ الحَسَنَاتِ يُذْهِبنَ السَّيِئَات) [هود: 114] فقال الرجل: ألي هذا يا رسول الله؟ قال: «لِجَمِيعِ أُمَّتِي كُلِّهِم».","a":"متفق عليه","g":"صحيح","e":"يخبرنا ابن مسعود رضي الله عنه أن رجلا من أصحاب النبي صلى الله عليه وسلم يسمى أبو اليسر قبَّل امرأة أجنبية، فندم على ما وقع منه \"فأتى النبي صلى الله عليه وسلم فأخبره\" بما وقع فيه \"فأنزل الله عز وجل\" في شأنه \"أقم الصلاة طرفي النهار\" أي صل الصلوات التي في طرفي النهار، وهما الصبح والظهر والعصر \"وزلفا من الليل\" أي وصل أيضا الصلاتين اللتين في أول الليل وهما المغرب والعشاء \"إن الحسنات يذهبن السيئات\" أي فإن هذه الصلوات الخمس كفارة لصغائر الذنوب، ومنها ما فعلت \"فقال الرجل: ألي هذا ؟\" أي هل هي كفارة لي خاصة أو للناس عامة \"قال لجميع أمتي\" أي أن هذه الصلوات الخمس كفارة لمن فعل ذلك من جميع أمتي. وفي الحديث الآخر: (ما من مسلم يذنب ذنبًا ثم يتوضأ فيصلي ركعتين ثم يستغفر الله تعالى لذلك الذنب إلا غفر له)، وقرأ هاتين الآيتين: (ومن يعمل سوءا أو يظلم نفسه ثم يستغفر الله يجد الله غفورا رحيما) (والذين إذا فعلوا فاحشة أو ظلموا أنفسهم ) الآية. رواه أحمد برقم (47) . وهذا من سعة رحمة الله تعالى بعباده أن جعل الصلوات الخمس ونوافل الصلاة كفارة لذنوبهم، وإلا لهلكوا.","f":["الصلاة تكفر صغائر الذنوب.","هذا الحديث يؤكد أن العبرة بعموم الحكم لا بخصوص السبب.","القُبْلة واللمس والغمْزُ لا حدَّ فيها، وإنما تستوجب التعزير.","فيه أن النساء أعظم فتنة على الرجال، ما خلا رجل بامرأة إلا والشيطان ثالثهما."],"r":["- صحيح البخاري –الجامع الصحيح-؛ للإمام أبي عبد الله محمد بن إسماعيل البخاري، عناية محمد زهير الناصر، دار طوق النجاة، الطبعة الأولى، 1422هـ.","- صحيح مسلم؛ للإمام مسلم بن الحجاج، حققه ورقمه محمد فؤاد عبد الباقي، دار عالم الكتب، الرياض، الطبعة الأولى، 1417هـ."],"u":"https://hadeethenc.com/ar/browse/hadith/3656"},{"id":3658,"t":"جاء رجل إلى النبي صلى الله عليه وسلم فقال: يا رسول الله، أصبت حدًا، فأقمه عليَّ","h":"عن أنس رضي الله عنه مرفوعاً: جاء رجل إلى النبي صلى الله عليه وسلم فقال: يا رسول الله، أصَبْتُ حدًّا، فَأَقِمْه عليَّ، وحضرت الصلاة، فصلى مع رسول الله صلى الله عليه وسلم فلمَّا قضى الصلاة، قال: يا رسول الله، إني أصَبْتُ حَدًّا فأقم فيَّ كتاب الله. قال: «هل حَضَرْتَ مَعَنَا الصلاة»؟ قال: نعم. قال: «قد غُفِر لك».","a":"متفق عليه","g":"صحيح","e":"جاء رجل فقال: يا رسول الله، إني فعلت شيئًا يوجب الحد، فأقمه علي: أي: الحد، والمراد به حكم الله. قال أنس (ولم يسأله عنه): ولم يسأل عنه أي: لم يسأل رسول الله صلى الله عليه وسلم الرجل عن موجب الحد ما هو؟ قيل: لأنه عليه الصلاة والسلام عرف ذنبه وغفرانه بطريق الوحي. وحضرت الصلاة فصلى مع رسول الله صلى الله عليه وسلم : أي: إحدى الصلوات أو العصر فلما أداها وانصرف عنها قام الرجل فقال: يا رسول الله، إني أصبت حدا فأقم في. أي: في حقي كتاب الله : أي: حكم الله من الكتاب والسنة، والمعنى: اعمل بما دل عليه في شأني من حد أو غيره، قال صلى الله عليه وسلم: \"أليس قد صليت معنا؟\" قال: نعم، قال: \" فإن الله قد غفر لك ذنبك، أو حدك \" شك من الراوي أي: سبب حدك. والمراد بالحد العقوبة الشاملة للتعزير، ويحتمل أن يكون غيره، وليس المراد بالحد حقيقته الاصطلاحية، كالزنى وشرب الخمر، وهو ما أوجب عقوبة مقدرة، وحكمة كونه عليه الصلاة والسلام لم يسأله عنه أنه علم له نوع عذر، فلم يسأله عنه حتى لا يقيمه عليه، إذ لو أعلمه لوجب عليه إقامته عليه وإن تاب ؛ لأن التوبة لا تسقط الحدود إلا حد قاطع الطريق للآية، وكذا حد زنا الذمي إذا أسلم.","f":["أن من وقع في معصية فقد أصاب حدا من حدود الله.","أن الصلاة مكفرة لصغائر الذنوب.","رغبة الصحابة في تطهير أنفسهم من آثار الذنوب في الدنيا.","المبادرة في التوبة من المعاصي.","فيه يسر الشريعة الإسلامية ورحمتها بالمكلفين.","رفق النبي -صلى الله عليه وسلم- بأهل المعاصي، وقذ قال صلى الله عليه وسلم: (لم يكن الرفق في شيء إلا زانه وما نُزع من شيء إلا شانه).","فيه الستر على العاصي التائب؛ لأن النبي صلى الله عليه وسلم لم يعزره ، بل ولم يستفصل منه.","أن التائب من الذنب كمن لا ذنب له.","أن صغائر الذنوب لا حدَّ فيها.","أن ما وقع فيه هذا الصحابي معصية لا توجب الحَدَّ، ولو كانت توجب الحَدَّ لما تركه -صلى الله عليه وسلم-؛ لأن ذلك من حق الله -تعالى-.","أن الشيطان حريص على غواية بني آدم.","أن الصالحين-ولو في زمن الوحي- قد يقع منهم أحيانا معاصي، وهي ظلم النفس، لكنهم لا يصرون عليها، بل يذكرون الله عقب وقوعها، فيستغفرونه ويتوبون إليه منها"],"r":["- صحيح البخاري –الجامع الصحيح-؛ للإمام أبي عبد الله محمد بن إسماعيل البخاري، عناية محمد زهير الناصر، دار طوق النجاة، الطبعة الأولى، 1422هـ.","- صحيح مسلم؛ للإمام مسلم بن الحجاج، حققه ورقمه محمد فؤاد عبد الباقي، دار عالم الكتب-الرياض، الطبعة الأولى، 1417هـ."],"u":"https://hadeethenc.com/ar/browse/hadith/3658"},{"id":65114,"t":"إن الله عز وجل لا ينام، ولا ينبغي له أن ينام","h":"عَنْ أَبِي مُوسَى رَضِيَ اللهُ عَنْهُ قَالَ: قَامَ فِينَا رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ بِخَمْسِ كَلِمَاتٍ، فَقَالَ: «إِنَّ اللهَ عَزَّ وَجَلَّ لَا يَنَامُ، وَلَا يَنْبَغِي لَهُ أَنْ يَنَامَ، يَخْفِضُ القِسْطَ وَيَرْفَعُهُ، يُرْفَعُ إِلَيْهِ عَمَلُ اللَّيْلِ قَبْلَ عَمَلِ النَّهَارِ، وَعَمَلُ النَّهَارِ قَبْلَ عَمَلِ اللَّيْلِ، حِجَابُهُ النُّورُ -وَفِي رِوَايَةٍ: النَّارُ- لَوْ كَشَفَهُ لَأَحْرَقَتْ سُبُحَاتُ وَجْهِهِ مَا انْتَهَى إِلَيْهِ بَصَرُهُ مِنْ خَلْقِهِ».","a":"رواه مسلم","g":"صحيح","e":"قام النبي صلى الله عليه وسلم خطيبًا في أصحابه بخمس جملٍ تامة، وهي: الأولى: بأن الله عز وجل لا ينام. الثانية: يستحيل في حقه النوم؛ لكمال قيوميته وحياته. الثالثة: أنه تعالى يخفض الميزان ويرفعه بما يوزن من أعمال العباد المرتفعة الصاعده إليه، ويوزن من أرزاقهم النازلة إلى الأرض، فالرزق الذي هو قسط ونصيب كل مخلوق يخفضه سبحانه فيقتره، ويرفعه فيوسعه. الرابعة: يُرفع إليه ما عمل العباد بالليل قبل النهار الذي بعده، وعملهم بالنهار قبل عمل الليل الذي بعده؛ فالملائكة الحفظة يصعدون بأعمال الليل بعد انقضائه في أول النهار، ويصعدون بأعمال النهار بعد انقضائه في أول الليل. الخامسة: حجابه سبحانه المانع من رؤيته النور أو النار، لو كشفه لأحرقت سبحات وجهه ما انتهى إليه بصره من خلقه؛ فسبحات وجهه نوره وجلاله وبهاؤه. والتقدير: لو أزال وكشف المانع من رؤيته وهو الحجاب، وتجلى لخلقه لأحرقت سبحات وجهه ما انتهى إليه بصره من خلقه؛ وهي جميع المخلوقات؛ لأن بصره سبحانه وتعالى محيط بجميع الكائنات.","f":["بيان استحالة النوم على الله سبحانه وتعالى؛ لكونه من النقائص وهو منزه عنها.","الله تعالى يُعزُّ من يشاء ويذل من يشاء، ويهدي من يشاء ويضل من يشاء من عباده.","الأعمال ترفع إلى الله كل يوم وكل ليلة، وفي ذلك حث للعباد أن يراقبوا الله عز وجل في ليلهم ونهارهم.","الحديث يدل على عدل الله سبحانه وحسن تدبيره لأمور خلقه، ولا شك أن هذا من صفات كماله جل وعلا.","إثبات الحجاب له سبحانه وتعالى، وهو النور الحائل بينه وبين خلقه، ولولاه لاحترقوا.","قال الآجُرِّي: إنَّ أهل الحق يَصِفُون الله عز وجل بما وصف به نفسه عز وجل، وبما وصفه به رسوله صلى الله عليه وسلم، وبما وصفه به الصحابة رضي الله عنهم، وهذا مذهب العلماء ممن اتبع ولم يبتدع. انتهى. فأهل السنة يُثْبِتُون لله ما أثبته لنفسه من الأسماء والصفات من غير تحريف ولا تعطيل ولا تكييف ولا تمثيل، ويَنْفُون عن الله ما نفاه عن نفسه، ويَسْكُتُون عما لم يرد به نفي ولا إثبات، قال الله تعالى: {لَيْسَ ‌كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ}.","النور الذي هو وصفه سبحانه وتعالى غير النور الذي احتجب به، النور الذي احتجب به نور مخلوق، فنور الله تعالى نور يليق به وبذاته، ليس كمثله شيء، والذي رآه النبي صلى الله عليه وسلم ما هو إلا الحجاب الذي يكون بين الله وبين عباده."],"r":["صحيح مسلم (1/ 161) (179).","شرح المرقاة (1/128)."],"u":"https://hadeethenc.com/ar/browse/hadith/65114"},{"id":65214,"t":"من نوقش الحساب يهلك","h":"عن عائشة، زوج النبي صلى الله عليه وسلم أنها كانت لا تسمع شيئا لا تعرفه، إلا راجعت فيه حتى تعرفه، وأن النبي صلى الله عليه وسلم قال: «من حوسب عذب» قالت عائشة: فقلت أوليس يقول الله تعالى: {فسوف يحاسب حسابا يسيرا} [الانشقاق: 8] قالت: فقال: «إنما ذلك العرض، ولكن: من نوقش الحساب يهلك».","a":"متفق عليه","g":"صحيح","e":"عن عائشة رضي الله عنها زوج النبي صلى الله عليه وسلم أي زوجته والأول أفصح، أنها كانت لا تسمع شيئًا لا تعرفه إلا راجعت فيه حتى تعرفه، أي سألت عنه حتى تعرفه، وهذا من حرصها على التعلم، وأن النبي صلى الله عليه وسلم قال: من حوسب عذب، وفيه معنيان: إما أنَّ نفس مناقشة الحساب يوم عرض الذنوب والتوقيف على قبيح ما سلف تعذيب وتوبيخ، أو أنه مفضٍ إلى استحقاق العذاب، إذ لا حسنة للعبد يعملها إلا من عند الله وبفضله وإقداره له عليها وهدايته لها، وأن الخالص لوجهه تعالى من الأعمال قليل، قالت عائشة: فقلت أوليس يقول الله تعالى: {فسوف يحاسب حسابًا يسيرًا} قوله: (يسيرًا) أي سهلًا هيّنًا لا يناقش فيه ولا يعترض بما يشق عليه كما يناقش أصحاب الشمال، ووجه المعارضة بين الحديث والآية أن الحديث عام في تعذيب من حوسب، والآية تدل على عدم تعذيب بعضهم، وهم أصحاب اليمين، قالت عائشة: فقال: إنما ذلك العرض أي: الإبراز والإظهار، ولكن من نوقش الحساب من المناقشة وهي الاستقصاء في الحساب حتى لا يترك منه شيء، يهلك أي: أن التقصير غالب على العباد، فمن استقصي عليه ولم يسامح هلك وأدخل النار، ولكن الله تعالى يعفو ويغفر ما دون الشرك لمن شاء.","f":["بيان فضيلة عائشة رضي الله عنها وحرصها على التعلم، وأن رسول الله صلى الله عليه وسلم ما كان يتضجر من مراجعتها.","إثبات الحساب والعرض.","إثبات العذاب يوم القيامة.","جواز المناظرة ومقابلة السنة بالكتاب بقصد البحث عن الحق والتعلم مع التأدب في الطرح.","تفاوت الناس في الحساب يوم القيامة."],"r":["صحيح البخاري (1/ 32) (103)، صحيح مسلم (4/ 2204) (2876)، عمدة القاري شرح صحيح البخاري (2/ 138)."],"u":"https://hadeethenc.com/ar/browse/hadith/65214"},{"id":65316,"t":"أليس قد صليت معنا؟","h":"عن أنس بن مالك رضي الله عنه قال: كنت عند النبي صلى الله عليه وسلم فجاءه رجل فقال: يا رسول الله، إني أصبتُ حدًّا فأقِمْهُ عليَّ. قال: ولم يسأله عنه، قال: وحضرت الصلاة، فصلى مع النبي صلى الله عليه وسلم، فلما قضى النبي صلى الله عليه وسلم الصلاة قام إليه الرجل فقال: يا رسول الله، إني أصبتُ حدًّا، فأقم فيَّ كتاب الله. قال: «أليس قد صليت معنا؟» قال: نعم، قال: «فإن الله قد غفر لك ذنبك» أو قال: «حدك».","a":"متفق عليه","g":"صحيح","e":"روى أنس بن مالك رضي الله عنه أنه كان عند النبي صلى الله عليه وسلم فجاءه رجل فقال: يا رسول الله إني فعلت فعلًا من حدود الله، أي محرماته، فلم يستفسر منه النبي عن الحد الذي فعله، قال أنس: وحضرت الصلاة، فصلى الرجل مع النبي صلى الله عليه وسلم، فلما انتهى النبي صلى الله عليه وسلم من الصلاة قام إليه الرجل فأعاد كلامه، فقال عليه الصلاة والسلام: ألم تصل معنا؟ قال: نعم، قال: فإن الله قد غفر لك ذنبك أو قال: حدك أي ما يوجب حدك. فمن أقر بحدٍّ ولم يفسره، فإنه لا يجب على الإمام أن يقيمه عليه إذا تاب، وفي هذا الحديث أنه لا يُكشَف عن الحدود، بل يدفع مهما أمكن، وهذا الرجل لم يفصح بأمرٍ يَلزمه به إقامة الحد عليه، فلعله أصاب صغيرةً ظنها كبيرةً توجب الحد، فلم يكشف النبي صلي الله عليه وسلم عن ذلك، وفيه أيضًا عدم إفشاء الفاحشة بين المؤمنين حتى لا تخِفَّ على النفوس ويُتنبه لها.","f":["من أقر بحد ولم يفسره، فلا يجب على الإمام أن يقيمه عليه إذا تاب.","يسر الشريعة وسماحتها.","الصلاة مكفرة للذنوب.","لا يكشف عن الحدود، بل يدفع مهما أمكن."],"r":["صحيح البخاري (8/ 166) (6823)، صحيح مسلم (4/ 2117) (2764)، البحر المحيط الثجاج في شرح صحيح الإمام مسلم بن الحجاج (42/ 724)، النهاية في غريب الحديث و الأثر (ص 192)."],"u":"https://hadeethenc.com/ar/browse/hadith/65316"},{"id":4310,"t":"كَانَ فِيمَنْ كَانَ قَبْلَكُمْ رَجُلٌ قَتَلَ تِسْعَةً وَتِسْعِينَ نَفْسًا، فَسَأَلَ عَنْ أَعْلَمِ أَهْلِ الْأَرْضِ فَدُلَّ عَلَى رَاهِبٍ، فَأَتَاهُ فَقَالَ: إِنَّهُ قَتَلَ تِسْعَةً وَتِسْعِينَ نَفْسًا، فَهَلْ لَهُ مِنْ تَوْبَةٍ؟ فَقَالَ: لَا، فقتله","h":"عن أبي سعيد الخدري رضي الله عنه أن نبي الله صلى الله عليه وسلم قال: «كان فيمن كان قبلكم رجل قتل تسعة وتسعين نفسًا، فسأل عن أعلم أهل الأرض، فَدُلَّ على راهب، فأتاه فقال: إنه قتل تسعة وتسعين نفسا فهل له من توبة؟ فقال: لا، فقتله فكمَّل به مئة، ثم سأل عن أعلم أهل الأرض، فَدُلَّ على رجل عالم، فقال: إنه قتل مائة نفس فهل له من توبة؟ فقال: نعم، ومَنْ يَحُولُ بينه وبين التوبة؟ انْطَلِقْ إلى أرض كذا وكذا فإن بها أناسا يعبدون الله تعالى فاعبد الله معهم، ولا ترجع إلى أرضك فإنها أرض سوء، فانطلق حتى إذا نَصَفَ الطريقَ أتاه الموت، فاختصمت فيه ملائكة الرحمة وملائكة العذاب، فقالت ملائكة الرحمة: جاء تائبا، مُقْبِلا بقلبه إلى الله تعالى ، وقالت ملائكة العذاب: إنه لم يعمل خيرا قط، فأتاهم ملك في صورة آدمي فجعلوه بينهم -أي حكمًا- فقال: قِيسُوا ما بين الأرضين فإلى أَيَّتِهِمَا كان أدنى فهو له، فقاسوا فوجدوه أدنى إلى الأرض التي أراد، فقبضته ملائكة الرحمة». وفي رواية في الصحيح: «فكان إلى القرية الصالحة أقرب بشبر فجعل من أهلها». وفي رواية في الصحيح: «فأوحى الله تعالى إلى هذه أن تَبَاعَدِي، وإلى هذه أن تَقَرَّبِي، وقال: قيسوا ما بينهما، فوجدوه إلى هذه أقرب بشبر فغُفِرَ له». وفي رواية: «فَنَأَى بصدره نحوها».","a":"متفق عليه","g":"صحيح","e":"قال النبي صلى الله عليه وسلم : كان في أمة من الأمم قبلنا رجل قتل تسعة وتسعين نفسًا، ثم إنه ندم وسأل عن أعلم أهل الأرض يسأله: هل له من توبة؟ فدل على رجل، فوجد عابدًا ولكنه ليس عنده علم، فلما سأله قال إنه قتل تسعة وتسعين نفسًا، فهل له من توبة؟ فاستعظم الراهب هذا الذنب وقال: ليس لك توبة! فغضب الرجل وانزعج وقتل الراهب، فأتم به مائة نفس، ثم إنه سأل عن أعلم أهل الأرض، فدل على رجل عالم فقال له: إنه قتل مائة نفس فهل له من توبة؟ قال: نعم! ومن الذي يحول بينه وبين التوبة؟ باب التوبة مفتوح، ولكن اذهب إلى القرية الفلانية؛ فإن فيها قومًا يعبدون الله، والأرض التي كان فيها كأنها -والله أعلم- دار كفر فأمره هذا العالم أن يهاجر بدينه إلى هذه القرية التي يعبد فيها الله سبحانه وتعالى ، فخرج تائبا نادمًا مهاجرًا بدينه إلى الأرض التي فيها القوم الذين يعبدون الله عز وجل، وفي منتصف الطريق أتاه الموت، فاختصمت فيه ملائكة العذاب وملائكة الرحمة، تقول ملائكة الرحمة: إنه تاب وجاء نادمًا تائبًا، فحصل بينهما خصومة، فبعث الله إليهم ملكًا ليحكم بينهم، فقال: قيسوا ما بين الأرضين فإلى أيتها كان أقرب فهو من أهلها. فإن كانت أرض الكفر أقرب إليه فملائكة العذاب تقبض روحه، وإن كان إلى بلد الإيمان أقرب فملائكة الرحمة تقبض روحه. فقاسوا ما بينهما؛ فإذا البلد التي اتجه إليها -وهي بلد الإيمان-أقرب من البلد التي هاجر منها بنحو شبر -مسافة قريبة- فقبضته ملائكة الرحمة.","f":["حسن أسلوب النبي -صلى الله عليه وسلم- واستعماله أسلوب القصة في التوجيه والموعظة.","جواز التحدث عن الأمم السابقة مما لم يأت الإسلام بما يخالفه.","النفوس التي فيها استعداد للخير والحق ترجع إلى الاستقامة وإن انحرفت بها الأهواء حينًا عن طريق الهدى.","فضل العلم مع قلة العبادة على كثرة العبادة مع الجهل.","العالم يهتدي بنور الحق والعلم فيوفق للهدى فينتفع وينفع.","باب التوبة مفتوح، والتائب مقبول مهما عظُم منه الذنب وكثُر.","على الداعي إلى الخير أن يكون ذا حكمة بالغة؛ بحيث يفطن إلى ما يصلح النفوس، ويسلك بها سبيل الأمل وفتح باب الرجاء.","قبول توبة القاتل عمدًا.","مجانبة أهل المعاصي ومقاطعتهم ما داموا على حالهم، ومصاحبة أهل التقوى والعلم والصلاح.","حب الله تعالى لتوبة عباده وإخباره الملائكة بذلك مباهاة بهم.","بذل الجهد وتحمل المشقة من أجل اللحاق بالصالحين، وفعل عمل المقربين دليل صدق الرغبة في التوبة إلى الله -عز وجل-.","قدرة الملائكة على التشكل.","إذا تعارضت الأدلة والأحوال وتعددت البينات عند الحاكم، فله أن يستدل بالقرائن على الترجيح.","جواز التحكيم.","من خرج مهاجرًا في سبيل الله فمات فقد وقع أجره على الله."],"r":["-نزهة المتقين شرح رياض الصالحين، نشر: مؤسسة الرسالة، الطبعة: الرابعة عشر، 1407هـ - 1987م.","-شرح رياض الصالحين، لابن عثيمين، نشر: دار الوطن للنشر، الرياض، الطبعة: 1426هـ."],"u":"https://hadeethenc.com/ar/browse/hadith/4310"},{"id":4820,"t":"لم أتخلف عن رسول الله صلى الله عليه وسلم في غزوةٍ غَزَاهَا قَطُّ إلا في غزوة تبوك، غير أني قد تخلفت في غزوةِ بدرٍ، ولم يعاتب أحدًا تخلف عنه","h":"عن عبد الله بن كعب بن مالك، وكان قائدَ كعب - رضي الله عنه - من بنيه حين عمي، قال: سمعت كعب بن مالك - رضي الله عنه - يحدث بحديثه حين تَخَلَّفَ عن رسول الله - صلى الله عليه وسلم - في غزوة تبوك. قال كعب: لم أتَخَلَّفْ عن رسول الله - صلى الله عليه وسلم - في غزوةٍ غَزَاهَا قَطُّ إلا في غزوة تبوك، غير أني قد تخلفت في غزوةِ بدرٍ، ولم يُعَاتَبْ أحدًا تخلف عنه؛ إنما خرج رسول الله - صلى الله عليه وسلم - والمسلمون يريدون عِيرَ قُرَيْشٍ حتى جمع الله تعالى بينهم وبين عدوهم على غير ميعاد. ولقد شهدت مع رسول الله - صلى الله عليه وسلم - ليلة العقبة حين تَوَاثَقْنَا على الإسلام، وما أُحِبُّ أَنَّ لي بها مَشْهَدَ بَدْرٍ، وإن كانت بدرٌ أذكرَ في الناس منها. وكان من خبري حين تخلفت عن رسول الله - صلى الله عليه وسلم - في غزوة تبوك أني لم أكن قط أَقْوَى ولا أَيْسَرَ مني حين تخلفت عنه في تلك الغزوة، والله ما جمعت قبلها راحلتين قط حتى جمعتهما في تلك الغزوة ولم يكن رسول الله - صلى الله عليه وسلم - يريد غزوة إلا وَرَّى بغيرها حتى كانت تلك الغزوة، فغزاها رسول الله - صلى الله عليه وسلم - في حَرٍّ شديد، واستقبل سفرا بعيدا ومَفازا، واستقبل عددا كثيرا، فجَلَّى للمسلمين أمرهم ليتَأهَّبُوا أُهْبَةَ غزوهم فأخبرهم بوجههم الذي يريد، والمسلمون مع رسول الله كثير ولا يجمعهم كتاب حافظ «يريد بذلك الديوان». قال كعب: فقل رجل يريد أن يَتَغَيَّبَ إلا ظَنَّ أن ذلك سيخفى له ما لم ينزل فيه وحي من الله، وغزا رسول الله - صلى الله عليه وسلم - تلك الغزوة حين طابت الثمار والظلال، فأنا إليها أَصْعَرُ، فتجهز رسول الله - صلى الله عليه وسلم - والمسلمون معه وطَفِقْتُ أغدو لكي أتجهز معه،لم يقدر ذلك لي، فطفقت إذا خرجت في الناس بعد خروج رسول الله - صلى الله عليه وسلم - يَحْزُنُنِي أني لا أرى لي أُسْوَةً، إلا رجلا مَغْمُوصًا عليه في النفاق، أو رجلا ممن عَذَرَ الله تعالى من الضعفاء، ولم يذكرني رسول الله - صلى الله عليه وسلم - حتى بلغ تبوك، فقال وهو جالس في القوم بتبوك: «ما فعل كعب بن مالك؟» فقال رجل من بني سَلِمَةَ: يا رسول الله، حبسه بُرْدَاهُ والنظر في عِطْفَيْهِ. فقال له معاذ بن جبل - رضي الله عنه: بئس ما قلت! والله يا رسول الله ما علمنا عليه إلا خيرا، فسكت رسول الله - صلى الله عليه وسلم. فبينا هو على ذلك رأى رجلا مُبَيِّضًا يزولُ به السَّرَابُ، فقال رسول الله - صلى الله عليه وسلم: «كن أبا خيثمة»، فإذا هو أبو خيثمة الأنصاري وهو الذي تصدق بصاع التمر حين لَمَزَهُ المنافقون. قال كعب: فلما بلغني أن رسول الله - صلى الله عليه وسلم - قد توجه قافلًا من تبوك حضرني بَثِّي، فطَفِقْتُ أتذكرُ الكذبَ وأقول: بم أخرج من سخطه غدا؟ وأستعين على ذلك بكل ذي رأي من أهلي، فلما قيل: إن رسول الله - صلى الله عليه وسلم - قد أظل قادما، زاح عني الباطل حتى عرفت أني لن أنجو منه بشيء أبدا، فأجمعتُ صِدْقَهُ وأصبح رسول الله - صلى الله عليه وسلم - قادما، وكان إذا قدم من سفر بدأ بالمسجد فركع فيه ركعتين ثم جلس للناس، فلما فعل ذلك جاءه المُخَلَّفُونَ يعتذرون إليه ويحلفون له، وكانوا بضعا وثمانين رجلا، فقبل منهم علانيتهم وبايعهم واستغفر لهم وَوَكَلَ سَرَائِرَهُم إلى الله تعالى، حتى جئت، فلما سلمت تَبَسَّمَ تَبَسُّمَ المغضب. ثم قال: «تعالَ»، فجئت أمشي حتى جلست بين يديه، فقال لي: «ما خلفك؟ ألم تكن قد ابْتَعْتَ ظَهْرَكَ؟» قال: قلت: يا رسول الله، إني والله لو جلستُ عندَ غيرِك من أهل الدنيا لرأيتُ أني سأخرج من سخطه بعذر؛ لقد أُعْطِيتُ جَدَلًا، ولكني واللهِ لقد علمتُ لئن حدثتك اليوم حديث كذب ترضى به عني لَيُوشِكَنَّ اللهُ أن يُسْخِطَكَ عَلَيَّ، وإن حَدَّثْتُكَ حديث صدق تَجِدُ عَلَيَّ فيه إني لأرجو فيه عُقْبَى اللهِ - عز وجل - والله ما كان لي من عُذْرٍ، والله ما كنت قط أقوى ولا أيسر مني حين تخلفت عنك. قال: فقال رسول الله - صلى الله عليه وسلم: «أما هذا فقد صدق، فَقُمْ حتى يقضي الله فيك». وسار رجال من بني سلمة فاتبعوني فقالوا لي: والله ما علمناك أذنبتَ ذنبا قبل هذا لقد عَجَزْتَ في أن لا تكون اعتذرت إلى رسول الله - صلى الله عليه وسلم - بما اعتذر إليه المخلفون، فقد كان كافيك ذنبك استغفار رسول الله - صلى الله عليه وسلم - لك. قال: فوالله ما زالوا يُؤَنِّبُونَنِي حتى أردت أن أرجع إلى رسول الله - صلى الله عليه وسلم - فأُكَذِّبَ نفسي، ثم قلت لهم: هل لقي هذا معي من أحد؟ قالوا: نعم، لقيه معك رجلان قالا مثل ما قلت، وقيل لهما مثل ما قيل لك، قال: قلت: من هما؟ قالوا: مُرَارَةُ بنُ الربيعِ العَمْرِي، وهلال بن أُمية الوَاقِفِي؟ قال: فذكروا لي رجلين صالحين قد شهدا بدرا فيهما أُسْوَةٌ، قال: فمضيت حين ذكروهما لي. ونهى رسول الله - صلى الله عليه وسلم - عن كلامنا أيها الثلاثة من بين من تخلف عنه، فاجتنبنا الناس - أو قال: تغيروا لنا - حتى تَنَكَّرَتْ لي في نفسي الأرضُ، فما هي بالأرض التي أعرف، فلبثنا على ذلك خمسين ليلة. فأما صاحباي فاستكانا وقعدا في بيوتهما يبكيان. وأما أنا فكنتُ أَشَبَّ القومِ وأَجْلَدَهُم فكنت أخرج فأشهد الصلاة مع المسلمين، وأطوف في الأسواق ولا يكلمني أحد، وآتي رسول الله - صلى الله عليه وسلم - فأسلم عليه وهو في مجلسه بعد الصلاة، فأقول في نفسي: هل حرك شفتيه برد السلام أم لا؟ ثم أصلي قريبا منه وأُسَارِقُهُ النظرَ، فإذا أقبلت على صلاتي نظر إلي وإذا التفت نحوه أعرض عني، حتى إذا طال ذلك عَلَيَّ من جفوة المسلمين مشيت حتى تَسَوَّرْتُ جدار حائط أبي قتادة وهو ابن عمي وأحب الناس إلي، فسلمت عليه فوالله ما رد علي السلام، فقلت له: يا أبا قتادة، أَنْشُدُكَ بالله هل تعلمني أحب الله ورسوله - صلى الله عليه وسلم -؟ فسكت، فعدت فناشدته فسكت، فعدت فناشدته، فقال: الله ورسوله أعلم. ففاضت عيناي، وتوليت حتى تَسَوَّرْتُ الجدار، فبينا أنا أمشي في سوق المدينة إذا نَبَطِيٌ مِن نَبَطِ أهل الشام ممن قدم بالطعام يبيعه بالمدينة يقول: من يدل على كعب بن مالك؟ فطفق الناس يشيرون له إلي حتى جاءني فدفع إلي كتابا من ملك غسان، وكنت كاتبا. فقرأته فإذا فيه: أما بعد، فإنه قد بلغنا أن صاحبك قد جفاك ولم يجعلك الله بدار هَوَانٍ ولا مَضيَعَةٍ، فالْحَقْ بنا نُوَاسِكَ، فقلت حين قرأتها: وهذه أيضا من البلاء، فَتَيَمَّمْتُ بها التَّنُّورَ فَسَجَرْتُها، حتى إذا مضت أربعون من الخمسين واسْتَلْبَثَ الوحيُ إذا رسولُ رسولِ اللهِ - صلى الله عليه وسلم - يأتيني، فقال: إن رسول الله - صلى الله عليه وسلم - يأمرك أن تَعْتَزِلَ امرأتك، فقلت: أُطَلِّقُهَا أم ماذا أفعل؟ فقال: لا، بل اعْتَزِلْهَا فلا تَقْرَبَنَّهَا، وأرسل إلى صاحِبَيَّ بمثل ذلك. فقلت لامرأتي: الحقي بأهلك فكوني عندهم حتى يقضي الله في هذا الأمر. فجاءت امرأة هلال بن أمية رسول الله - صلى الله عليه وسلم - فقالت له: يا رسول الله، إن هلال بن أمية شيخ ضائع ليس له خادم، فهل تكره أن أخدمه؟ قال: «لا، ولكن لا يَقْرَبَنَّكِ» فقالت: إنه والله ما به من حركة إلى شيء، ووالله ما زال يبكي منذ كان من أمره ما كان إلى يومه هذا. فقال لي بعض أهلي: لو استأذنت رسول الله - صلى الله عليه وسلم - في امرأتك فقد أذن لامرأة هلال بن أمية أن تخدمه؟ فقلت: لا أستأذن فيها رسول الله - صلى الله عليه وسلم - وما يدريني ماذا يقول رسول الله - صلى الله عليه وسلم - إذا استأذنته، وأنا رجل شاب! فلبثت بذلك عشر ليال فكمل لنا خمسون ليلة من حين نُهِيَ عن كلامنا، ثم صليت صلاة الفجر صباح خمسين ليلة على ظهر بيت من بيوتنا، فبينا أنا جالس على الحال التي ذكر الله تعالى منا، قد ضاقت علي نفسي وضاقت علي الأرض بما رحبت، سمعت صوت صارخ أوفى على سَلْعٍ يقول بأعلى صوته: يا كعب بن مالك أبْشِرْ، فخررت ساجدا، وعرفت أنه قد جاء فرج. فآذَنَ رسولُ الله - صلى الله عليه وسلم - الناسَ بتوبة الله - عز وجل - علينا حين صلى صلاة الفجر فذهب الناس يبشروننا، فذهبَ قِبَلَ صَاحِبَيَّ مبشرون ورَكَضَ رجلٌ إليَّ فرسًا وسعى ساعٍ مِن أَسْلَمَ قِبَلِي، وأوفى على الجبل، فكان الصوتُ أسرعَ من الفرس، فلما جاءني الذي سمعت صوته يبشرني نزعت له ثَوْبَيَّ فكسوتهما إياه بِبِشَارَتِهِ، والله ما أملك غيرهما يومئذ، واستعرت ثوبين فلبستهما، وانطلقت أَتَأَمَّمُ رسول الله - صلى الله عليه وسلم - يَتَلَقَّاني الناس فوجا فوجا يُهنِّئونَني بالتوبة ويقولون لي: لِتَهْنِكَ توبة الله عليك. حتى دخلت المسجد فإذا رسول الله - صلى الله عليه وسلم - جالس حوله الناس، فقام طلحة بن عبيد الله - رضي الله عنه - يُهَرْوِلُ حتى صافحني وهَنَّأَنِي، والله ما قام رجل من المهاجرين غيره - فكان كعب لا ينساها لطلحة. قال كعب: فلما سلمت على رسول الله - صلى الله عليه وسلم - قال وهو يَبْرُقُ وَجْهُهُ من السرور: «أبشر بخير يوم مر عليك مذ ولدتك أمك» فقلت: أمن عندك يا رسول الله أم من عند الله؟ قال: «لا، بل من عند الله - عز وجل -»، وكان رسول الله - صلى الله عليه وسلم - إذا سُرَّ استنار وَجْهُهُ حتى كأن وَجْهَهَ قطعةُ قمر وكنا نعرف ذلك منه، فلما جلست بين يديه قلت: يا رسول الله، إن من توبتي أن أنْخَلِعَ من مالي صدقة إلى الله وإلى رسوله. فقال رسول الله - صلى الله عليه وسلم: «أمسك عليك بعض مالك فهو خير لك». فقلت: إني أمسك سهمي الذي بخيبر. وقلت: يا رسول الله، إن الله تعالى إنما أنجاني بالصدق، وإن من توبتي أن لا أحدث إلا صدقا ما بقيت، فوالله ما علمت أحدا من المسلمين أبلاه الله تعالى في صدق الحديث منذ ذكرت ذلك لرسول الله - صلى الله عليه وسلم - أحسن مما أبلاني الله تعالى، والله ما تعمدت كِذْبَةً منذ قلت ذلك لرسول الله - صلى الله عليه وسلم - إلى يومي هذا، وإني لأرجو أن يحفظني الله تعالى فيما بقي، قال: فأنزل الله تعالى: {لقد تاب الله على النبي والمهاجرين والأنصار الذين اتبعوه في ساعة العسرة} حتى بلغ: {إنه بهم رؤوف رحيم وعلى الثلاثة الذين خلفوا حتى إذا ضاقت عليهم الأرض بما رحبت} حتى بلغ: {اتقوا الله وكونوا مع الصادقين} [التوبة: 117 - 119] قال كعب: والله ما أنعم الله علي من نعمة قط بعد إذ هداني الله للإسلام أعظم في نفسي من صِدْقِي رسول الله - صلى الله عليه وسلم - أن لا أكون كَذَبْتُهُ، فأَهْلِكَ كما هَلَكَ الذين كذبوا؛ إن الله تعالى قال للذين كذبوا حين أنزل الوحي شر ما قال لأحد، فقال الله تعالى: {سيحلفون بالله لكم إذا انقلبتم إليهم لتعرضوا عنهم فأعرضوا عنهم إنهم رجس ومأواهم جهنم جزاء بما كانوا يكسبون يحلفون لكم لترضوا عنهم فإن ترضوا عنهم فإن الله لا يرضى عن القوم الفاسقين} [التوبة: 95 - 96] قال كعب: كنا خُلِّفْنَا أيها الثلاثةُ عن أمر أولئك الذين قبل منهم رسول الله - صلى الله عليه وسلم - حين حَلَفُوا له فبايعهم واستغفر لهم وأرجَأَ رسول الله - صلى الله عليه وسلم - أَمْرَنَا حتى قضى الله تعالى فيه بذلك. قال الله تعالى: {وعلى الثلاثة الذين خلفوا} وليس الذي ذكر مما خلفنا تخلفنا عن الغزو، وإنما هو تخليفه إيانا وإرجاؤه أمرنا عَمَّنْ حَلَفَ له واعتذر إليه فقبل منه. متفق عليه. وفي رواية: أن النبي - صلى الله عليه وسلم - خرج في غزوة تبوك يوم الخميس وكان يحب أن يخرج يوم الخميس. وفي رواية: وكان لا يقدم من سفر إلا نهارا في الضحى، فإذا قدم بدأ بالمسجد فصلى فيه ركعتين ثم جلس فيه.","a":"متفق عليه","g":"صحيح","e":"هذا حديث كعب بن مالك رضي الله عنه ، في قصة تخلفه عن غزوة تبوك، وكانت غزوة تبوك في السنة التاسعة من الهجرة. وكانت هذه الغزوة في أيام الحر حين طابت الثمار وصار المنافقون يحبون الدنيا على الآخرة، فتخلف المنافقون عن هذه الغزوة ولجأوا إلى الظل والرطب والتمر، وبعدت عليهم الشُّقة والعياذ بالله، كما أخبر الله سبحانه في القرآن وكما في هذا الحديث. أما المؤمنون الخلص، فإنهم خرجوا مع النبي -عليه الصلاة والسلام- ولم يُضعف عزمهم بعد المسافة ولا طيب الثمار. إلا أن كعب بن مالك رضي الله عنه تخلف عن غزوة تبوك بلا عذر، وهو من المؤمنين الخلص، ولهذا قال: \"إنه ما تخلف عن رسول الله صلى الله عليه وسلم عن غزوة غزاها قط، كل غزوات الرسول صلى الله عليه وسلم قد شارك فيها كعب رضي الله عنه فهو من المجاهدين في سبيل الله، إلا في غزوة بدر، فقد تخلف فيها كعب وغيره، لأن النبي -عليه الصلاة والسلام- خرج من المدينة لا يريد القتال، ولذلك لم يخرج معه إلا ثلاثمائة وبضعة عشر رجلًا فقط؛ لأنهم كانوا يريدون أن يأخذوا إبلًا لقريش مُحملة قدمت من الشام تريد مكةَ وتَمُرُّ بالمدينة. ثم ذكر بَيعته النبيَّ صلى الله عليه وسلم ليلة العقبة في مِنى، قبل الهجرة، حيث بايعوا النبي صلى الله عليه وسلم على الإسلام وقال: إنني لا أحب أن يكون لي بدلها شهود بدر؛ وإن كانت بدر أكثر ذكرًا، لأن الغزوة اشتهرت بخلاف البيعة. كان رضي الله عنه قوي البدن، ياسر الحال، حتى إنه كان عنده راحلتان في تلك الغزوة، وما جمع راحلتين في غزوة قبلها أبدًا، وقد استعد وتجهز رضي الله عنه وكان من عادة النبي صلى الله عليه وسلم أنه إذا أراد غزوة وَرَّى بغيرها فيظهر خلاف ما يريد، وهذا من حكمته وحنكته في الحرب؛ لأنه لو أظهر ما يقصده تبين ذلك لعدوه، فربما يستعد له أكثر، وربما يذهب عن مكانه الذي قصده النبي صلى الله عليه وسلم فيه؛ إلا في غزوة تبوك، فإن النبي صلى الله عليه وسلم بين أمرها ووضحها وجَلَّاها لأصحابه، وأخبر أنه خارج إلى تبوك إلى عدوٍّ كثير، وإلى مكان بعيد حتى يستعد الناس. فخرج المسلمون مع رسول الله صلى الله عليه وسلم ولم يتخلف إلا من خذله الله بالنفاق، وثلاثة رجال فقط من المؤمنين، هم: كعب بن مالك، ومرارة بن الربيع، وهلال بن أمية رضي الله عنهم ، لكن تخلفوا لأمر أراده الله عز وجل أما غيرهم ممن تخلف فإنهم منافقون منغمسون في النفاق، نسأل الله العافية. فخرج النبي -عليه الصلاة والسلام- بأصحابه وهم كثير، إلى جهة تبوك حتى نزل بها، ولكن الله تعالى لم يجمع بينه وبين عدوه، بل بقي عشرين يوماً في ذلك المكان، ثم انصرف بغير حرب. يقول كعب بن مالك رضي الله عنه إن الرسول صلى الله عليه وسلم تجهز هو والمسلمون وخرجوا من المدينة، أما هو رضي الله عنه فتأخر وجعل يغدو كل صباح يرحِّل راحلته ويقول: سوف ألحق بهم، ولكنه لا يفعل شيئًا، ثم يفعل كل يوم كذلك، حتى تمادى به الأمر ولم يدرك. يقول: فكان يحز في نفسه أنه إذا خرج إلى سوق المدينة، وإذا المدينة ليس فيها أحد من المهاجرين ولا الأنصار، وليس فيها إلا رجل مغموس في النفاق -والعياذ بالله- قد غمسه نفاقه فلم يخرج، أو رجل معذور عذره الله عز وجل. فكان يعتب على نفسه: كيف لا يبقى في المدينة إلا هؤلاء وأقعد معهم، ورسول الله صلى الله عليه وسلم لم يذكره ولم يسأل عنه حتى وصل إلي تبوك. فبينما هو جالس وأصحابه في تبوك سأل عنه، فقال رسول الله: أين كعب بن مالك؟ فتكلم فيه رجل من بني سلمة وغمزه، ولكن دافع عنه معاذ بن جبل رضي الله عنه فسكت النبي صلى الله عليه وسلم ولم يجب بشيء، لا على الذي غمزه ولا على الذي رد. فبينما هو كذلك إذ رأى رجلا لابسا البياض يتحرك به السراب من بعيد، فقال النبي صلى الله عليه وسلم: \"كن أبا خيثمة الأنصاري\" فكان أبا خيثمة، وهذا معناه الفراسة والتمني أن يصبح هذا القادم من بعيد هو أبو خيثمة. وأبو خثيمة هذا هو الذي تصدق بصاع عندما حث النبي صلى الله عليه وسلم على الصدقة، فتصدق الناس كل بحسب حاله. فكان الرجل إذا جاء بالصدقة الكثيرة قال المنافقون: هذا مُراءٍ ما أكثر الصدقة ابتغاء وجه الله، وإذا جاء الرجل الفقير بالصدقة اليسيرة قالوا: إن الله غَنِيٌّ عن صاعِ هذا. يقول رضي الله عنه : إنه لما بلغه أن النبي صلى الله عليه وسلم رجع قافلًا من الغزو، بدأ يفكر ماذا يقول لرسول الله صلى الله عليه وسلم إذا رجع؟ يريد أن يتحدث بحديث وإن كان تورية، من أجل أن يعذره النبي صلى الله عليه وسلم فيه، وجعل يشاور ذوي الرأي من أهله ماذا يقول، ولكن يقول رضي الله عنه : فلما بلغه قرب النبي صلى الله عليه وسلم زال عنه الباطل، وعزم على أن يبين للنبي صلى الله عليه وسلم الحق، يقول: فقدم النبي صلى الله عليه وسلم المدينة ودخل المسجد، وكان من عادته وسنته أنه إذا قدم بلده فأول ما يفعل أن يصلي في المسجد عليه الصلاة والسلام. فدخل المسجد وصلى وجلس للناس فجاءه المخلفون الذين تخلفوا من غير عذر من المنافقين، وجعلوا يحلفون له إنهم معذورون، فيبايعهم ويستغفر لهم؛ ولكن ذلك لا يفيدهم والعياذ بالله؛ لأن الله تعالى قال: {اسْتَغْفِرْ لَهُمْ أَوْ لا تَسْتَغْفِرْ لَهُمْ إِنْ تَسْتَغْفِرْ لَهُمْ سَبْعِينَ مَرَّةً فَلَنْ يَغْفِرَ اللَّهُ لَهُمْ} (التوبة: من الآية80)، فيقول: أما أنا فعزمت أن أصدق النبي -عليه الصلاة والسلام- وأخبره بالصدق، فدخلت المسجد فسلمت عليه، فتبسم تبسم المغضب ثم قال: \"تعال\" فلما دنوت منه قال لي: \"ما خلفك؟\". فقال رضي الله عنه : يا رسول الله إني لم أتخلف لعذر، وما جمعت راحلتين قبل غزوتي هذه، وإني لو جلست عند أحد من ملوك الدنيا لخرجت منه بعذر، فلقد أوتيت جدلًا- يعني لو أني جلست عند شخص من الملوك لعرفت كيف أتخلص منه لأن الله أعطاني جدلًا- ولكني لا أحدثك اليوم حديثا ترضى به عني فيوشك أن يسخطك الله علي في ذلك. فصدقه القول وأخبره أنه لا عذر له لا في بدنه ولا في ماله، بل إنه لم يجمع راحلتين في غزوة قبل هذه. فقال النبي صلى الله عليه وسلم : \"أما هذا فقد صدق\" ويكفي له فخرًا أن وصفه النبي -عليه الصلاة والسلام- بالصدق: \"أما هذا فقد صدق، فاذهب حتى يقضي الله فيك ما شاء\". فذهب الرجل مستسلمًا لأمر الله عز وجل مؤمناً بالله، وأنه ما شاء الله كان، وما لم يشأ لم يكن. فلحقه قوم من بني سلمة من قومه وجعلوا يزينون له أن يرجع عن إقراره، وقالوا له: إنك لم تذنب ذنبًا قبل هذا، ويكفيك أن يستغفر لك رسول الله صلى الله عليه وسلم وإذا استغفر لك الرسول صلى الله عليه وسلم غفر الله لك، فارجع كذب نفسك، قل إني معذور، حتى يستغفر لك الرسول -عليه الصلاة والسلام- فيمن استغفر لهم ممن جاؤوا يعتذرون إليه، فهم أن يفعل- رضي الله عنه- ولكن الله سبحانه أنقذه وكتب له هذه المنقبة العظيمة التي تتلى في كتاب الله إلى يوم القيامة. فسال قومه: هل أحد صنع مثلما صنعت؟ قالوا: نعم، هلال بن أمية ومرارة بن الربيع، قالا مثلما قلت، وقيل لهما مثلما قيل لك، قال: فذكروا لي رجلين صالحين شهدا بدرًا لي فيهما أسوة. فأمر النبي -عليه الصلاة والسلام- الناس أن يهجروهم فلا يكلموهم. فهجرهم المسلمون، ولكنهم بعد ذلك صاروا يمشون وكأنهم بلا عقول، قد ذهلوا، وتنكرت لهم الأرض فما هي بالأرض التي كانوا يعرفونها؛ لأنهم يمشون إن سلموا لا يرد عليهم السلام، وإن قابلهم أحد لم يبدأهم بالسلام. وحتى النبي -عليه الصلاة والسلام- وهو أحسن الناس خلقاً لا يسلم عليهم. يقول كعب: كنت أحضر وأسلم على النبي صلى الله عليه وسلم فلا أدري: أحرك شفتيه برد السلام أم لا. فضاقت عليهم الأرض وضاقت عليهم أنفسهم وظنوا أن لا ملجأ من الله إلا إليه، وبقوا على هذه الحال مدة خمسين يوما والناس قد هجروهم فلا يسلمون عليهم، ولا يردون السلام إذا سلموا. فضاقت عليهم الأمور وصعبت عليهم الأحوال، وفروا إلى الله عز وجل ، ولكن مع ذلك لم يكن كعب بن مالك يدع الصلاة مع الجماعة. فكان يحضر ويسلم على النبي -عليه الصلاة والسلام- ولكن في آخر الأمر ربما يتخلف عن الصلوات؛ لما يجد في نفسه من الضيق والحرج؛ لأنه يخجل أن يأتي إلى قوم يصلي معهم وهم لا يكلمونه أبدًا، لا بكلمة طيبة ولا بكلمة تأنيب. قال: \"فأما صاحباي فاستكانا في بيوتهما يبكيان\"؛ لأنهما لا يستطيعان أن يمشيا في الأسواق، والناس قد هجروهم لا يلتفت إليهم أحد، ولا يسلم عليهم أحد، وإذا سلموا لا يرد عليهم السلام، فعجزوا عن تحمل هذه الحال، فبقيا في بيوتهما يبكيان. يقول: وكنت أنا أقواهم وأصبرهم لأنه كان أصغرهم سنا؛ فكان يشهد صلاة الجماعة مع المسلمين، ويطوف بأسواق المدينة لا يكلمه أحد؛ لأن النبي صلى الله عليه وسلم أمر بهجرهم، وكان الصحابة رضي الله عنهم أطوع الناس لرسول الله صلى الله عليه وسلم . يقول: كنت أصلي وأسارق النبي صلى الله عليه وسلم النظر، يعني: أنظر إليه أحيانًا وأنا أصلي، فإذا أقبلت على صلاتي نظر إلي وإذا التفت إليه أعرض عني، كل هذا من شدة الهجر. يقول: \"فبينما أنا أمشي ذات يوم في أسواق المدينة وطال علي جفوة الناس، تسورت حائطًا –أي: دخله من فوق الجدار- لأبي قتادة رضي الله عنه ، فسلمت عليه، فوالله ما رد علي السلام\"، وهو ابن عمه وأحب الناس إليه، ومع ذلك لم يرد عليه السلام، كل هذا طاعة لله ورسوله. فقال له: أنشدك الله، هل تعلم أني احب الله ورسوله؟ فلم يرد عليه. مرتين يناشده وأبو قتادة لم يرد عليه، وهو يعلم أن كعب بن مالك يحب الله ورسوله. فلما رد عليه الثالثة وقال: أنشدك الله هل تعلم أني أحب الله ورسوله؟ فقال: الله ورسوله أعلم. لم يكلمه، فلم يقل: نعم؟ ولا قال: لا. يقول: فبكى ثم خرج إلى السوق، فبينما هو يمشي إذا برجل نبطي من أنباط الشام يقول: من يدلني على كعب بن مالك؟ قلت: أنا هو، فأعطاني الورقة، وكنت كاتباً؛ لأن الكتاب في ذلك العهد قليلون جدًّا. يقول: \"فقرأت الكتاب، فإذا فيه: أما بعد، فقد بلغنا أن صاحبك جفاك -يعني الرسول عليه الصلاة والسلام، وكان هذا الملك: ملك غسان كافرًا- وإنك لست بدار هوان ولا مضيعة، فتعال إلينا نواسك بأموالنا، وربما نواسيك بملكنا. ولكن الرجل رجل مؤمن بالله تعالى ورسوله، ومحب لله ورسوله صلى الله عليه وسلم ، فقال: هذا أيضا من البلاء، ثم ذهب إلى التنور فأحرقها. ولما تمت لهم أربعون ليلة وأبطأ الوحي فلم ينزل أرسل إليهم النبي -عليه الصلاة والسلام- أن يعتزلوا نساءهم. فقال كعب: أطلقها أم ماذا؟ لأنه لو قال طلِّقها لطلقها بكل سهولة؛ طاعة لله ورسوله، فسأل فقال: أطلقها أم ماذا؟ فقال له رسول الرسول: إن الرسول -عليه الصلاة والسلام- يأمرك أن تعتزل أهلك. وبقي على ظاهر اللفظ. فقال كعب لزوجته الحقي بأهلك حتى يقضي الله هذا الأمر. فلحقت بأهلها. وجاءت زوجة هلال بن أمية إلى رسول الله صلى الله عليه وسلم وأخبرته بأنه في حاجة إليها لتخدمه؛ لأنه ليس له خادم، فأذن لها النبي صلى الله عليه وسلم بشرط أن لا يقربها، فقالت: \"إنه والله ما به من حركة إلي شيء\" يعني أنه ليس له شهوة في النساء، وأنه يبكي رضي الله عنه منذ أمر النبي صلى الله عليه وسلم بهجرهم إلي يومه هذا، أربعون يومًا يبكي؛ لأنه ما يدري ماذا ستكون النهاية. فقال لي بعض أهلي: لو استأذنت رسول الله صلى الله عليه وسلم في امرأتك فقد أذن لامرأة هلال بن أمية أن تخدمه؟ فقلت: لا أستأذن فيها رسول الله صلى الله عليه وسلم وما يدريني ماذا يقول رسول الله صلى الله عليه وسلم إذا استأذنته، وأنا رجل شاب! فلبثت بذلك عشر ليال فكمل لنا خمسون ليلة من حين نُهِيَ عن كلامنا. يقول: \"وكنت ذات يوم أصلي الصبح على سطح بيت من بيوتنا، فسمعت صارخًا يقول وهو على سَلْع -وهو جبل معروف في المدينة- أوفى عليه وصاح بأعلى صوته يقول: \"يا كعب بن مالك أبشر\"، يقول: \"فخررت ساجدًا، وعرفت أنه قد جاء فرج\"، وركب فارس من المسجد يؤم بيت كعب بن مالك ليبشره، وذهب مبشرون إلى هلال بن أمية ومرارة بن الربيع يبشرونهما بتوبة الله عليهما. يقول: فجاء الصارخ الماشي على قدميه، وجاء صاحب الفرس، فكانت البشرى للصارخ؛ لأن الصوت أسرع من الفرس، يقول: فأعطيته ثوبي الإزار والرداء، وليس يملك غيرهما، لكن استعار من أهله أو من جيرانه ثوبين فلبسهما، وأعطى ثوبيه للذي بشره. ثم نزل متوجها إلى الرسول صلى الله عليه وسلم في المسجد، وإذا رسول الله صلى الله عليه وسلم قد بشر الناس بعد صلاة الصبح بأن الله أنزل توبته على هؤلاء الثلاثة. يقول: فذهبت أتأمم رسول الله صلى الله عليه وسلم يعني أقصده، فجعل الناس يلاقونني أفواجًا يهنئونني بتوبة الله عليَّ حتى دخلت المسجد. يقول: فإذا رسول الله صلى الله عليه وسلم جالس وحوله أصحابه، فقام إلي طلحة بن عبيد الله رضي الله عنه فصافحني وهنأني بتوبة الله عليَّ. يقول: والله ما قام إلي أحد من المهاجرين رجل غير طلحة، فكان لا ينساها له. حتى وقف على النبي صلى الله عليه وسلم وإذا وجهه يبرق؛ لأنه -عليه الصلاة والسلام- سره أن يتوب الله على هؤلاء الثلاثة الذين صدقوا الله ورسوله، وأخبروا بالصدق عن إيمان، وحصل عليهم ما جرى من الأمر العظيم، من هجر الناس لهم خمسين يومًا، حتى نسائهم بعد الأربعين أَمَرَ الرسول -عليه الصلاة والسلام- أن يعتزلوهن. ثم قال له النبي صلى الله عليه وسلم : \"أبشر بخير يوم مر عليك مذ ولدتك أمك\". فقال له: \"أمن عندك يا رسول الله أم من عند الله؟ قال: \"لا بل من عند الله عز وجل\"؛ لأنه إذا كان من عند الله كان أشرف وأفضل وأعظم. فقال كعب: إن من توبته أن يتخلى عن ماله، ويجعله صدقة لله تعالى. فقال النبي صلى الله عليه وسلم : \"أمسك عليك بعض مالك فهو خير لك\". قال: فإني أمسك سهمي الذي بخيبر. ثم ذكر كعب بن مالك أن من توبته أن لا يحدث بحديث كذب بعد إذ نجاه الله تعالى بالصدق، وما زال كذلك ما حدث بحديث كذب أبدًا بعد أن تاب الله عليه، فكان رضي الله عنه مضرب المثل في الصدق، حتى إن الله أنزل فيه وفي صاحبيه: {يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ} (التوبة: 119). وأنزل الله تعالى الآيات في بيان منته عليهم بالتوبة من قوله تعالى: {لَقَدْ تَابَ اللَّهُ عَلَى النَّبِيِّ وَالْمُهَاجِرِينَ وَالْأَنْصَارِ الَّذِينَ اتَّبَعُوهُ فِي سَاعَةِ الْعُسْرَةِ مِنْ بَعْدِ مَا كَادَ يَزِيغُ قُلُوبُ فَرِيقٍ مِنْهُمْ ثُمَّ تَابَ عَلَيْهِمْ إِنَّهُ بِهِمْ رَءُوفٌ رَحِيمٌ (117) وَعَلَى الثَّلَاثَةِ الَّذِينَ خُلِّفُوا حَتَّى إِذَا ضَاقَتْ عَلَيْهِمُ الْأَرْضُ بِمَا رَحُبَتْ وَضَاقَتْ عَلَيْهِمْ أَنْفُسُهُمْ وَظَنُّوا أَنْ لَا مَلْجَأَ مِنَ اللَّهِ إِلَّا إِلَيْهِ ثُمَّ تَابَ عَلَيْهِمْ لِيَتُوبُوا إِنَّ اللَّهَ هُوَ التَّوَّابُ الرَّحِيمُ (118) يَاأَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ (119)} (التوبة: 117: 119). قال كعب: والله ما أنعم الله علي من نعمة قط، بعد إذ هداني الله للإسلام، أعظم في نفسي، من صدقي رسول الله صلى الله عليه وسلم ، أن لا أكون كذبته فأهلك كما هلك الذين كذبوا، إن الله قال للذين كذبوا، حين أنزل الوحي، شر ما قال لأحد، قال سبحانه : {سَيَحْلِفُونَ بِاللهِ لَكُمْ إِذَا انْقَلَبْتُمْ إِلَيْهِمْ لِتُعْرِضُوا عَنْهُمْ، فَأَعْرِضُوا عَنْهُمْ، إِنَّهُمْ رِجْسٌ، وَمَأْوَاهُمْ جَهَنَّمُ جَزَاءً بِمَا كَانُوا يَكْسِبُونَ، يَحْلِفُونَ لَكُمْ لِتَرْضَوْا عَنْهُمْ، فَإِنْ تَرْضَوْا عَنْهُمْ، فَإِنَّ اللهَ لَا يَرْضَى عَنِ الْقَوْمِ الْفَاسِقِينَ} [التوبة: 96]، قال: كنا خُلِّفنا أيها الثلاثة عن أمر أولئك الذين قبل منهم رسول الله صلى الله عليه وسلم حين حَلَفوا له، فبايعهم واستغفر لهم وأرجأ رسول الله صلى الله عليه وسلم أمرَنَا حتى قضى الله فيه بذلك، قال الله عز وجل: وعلى الثلاثة الذين خلفوا، وليس الذي ذكر الله مما خُلِّفْنا، تخلفنا عن الغزو، وإنما هو تخليفه إيانا، وإرجاؤه أمرنا، عمن حلف له واعتذر إليه فقبل منه\". وذكر رضي الله عنه أن النبي صلى الله عليه وسلم خرج من المدينة في يوم الخميس، وكان يحب أن يخرج في يوم الخميس. وذكر أن النبي صلى الله عليه وسلم عاد إلى المدينة ضحى، وأنه دخل المسجد فصلى فيه ركعتين، وكان هذا من سنته صلى الله عليه وسلم أنه إذا قدم بلده لم يبدأ بشيء قبل المسجد.","f":["أهمية صراحة المسلم وصدقه.","جواز إخبار الرجل عن تفريطه وتقصيره في طاعة الله ورسوله وعن سبب ذلك.","إباحة الغنيمة لهذه الأمة المرحومة حيث كانت محرَّمة على من قبلها من الأمم.","القتال يوم بدر لم يكن فرضًا عينيًّا.","جواز التحديث بنعمة الله عز وجل إذا لم يكن على سبيل الفخر والترفع والرياء.","بيعة العقبة كانت من أفضل مشاهد الصحابة -رضي الله عنهم- حتى إن كعبًا كان لا يراها دون مشهد بدر.","خطته صلى الله عليه وسلم الحكيمة على الصعيد العسكري، كمحافظته على سرية الخطط وحسن تقديره للموقف، وعدم تغريره بجنده ووضعهم في الصورة الواقعية حتى يكونوا على مستوى المهمة الملقاة على عاتقهم.","الإمام إذا راى مصلحة في أن يستر على الرعية بعض ما يهِم به، ويقصده من العدو؛ استحب له ذلك أو يتعين لحسب المصلحة.","الستر والكتمان إذا تضمن مفسدة لم يجُز.","اندفاع المسلمين إلى الجهاد في سبيل الله -عز وجل- عن رضا وطواعية رغم ما كانوا عليه من شدة.","تألم المسلم من تقصيره في أداء الواجب، وحرصه أن لا يكون من المتخلفين أو المنافقين.","لم يكن يتخلف عن رسول الله -صلى الله عليه وسلم- إلا أحد ثلاثة: إما منافق، أو رجل من أهل الأعذار، أو من خلفه رسول الله -صلى الله عليه وسلم- لمصلحة أو استعمله على المدينة.","الإمام والمطاع لا ينبغي أن يهمل من تخلف عنه في بعض الأمور بل يُذَكِّرْه ليراجع الطاعة ويتوب.","جواز الطعن في الرجل بما يغلب على اجتهاد الطاعن حمية أو ذبا عن الله ورسوله.","جواز الرد على الطاعن إذا غلب على ظن الرادِّ أنه وهم وغلط.","السنة للقادم من السفر أن يبدأ ببيت الله قبل بيته فيصلي فيه ركعتين.","يعامل الإنسان على ظاهره ويترك أمر باطنه إلى الله -عز وجل-.","تشديد الإسلام في هجر العصاة ولو بعزلهم عن المجتمع ليكون أبلغ في التأديب، وهذا إذا كان في الهجر مصلحة وفائدة للمهجور وللمجتمع.","حسن خلقه صلى الله عليه وسلم ورأفته في صحبه وإشفاقه عليهم وسروره بسرورهم وفرحه بخيرهم.","المؤمن يبتلى في دينه ودنياه، ومن أراد الله به خيرا صدق مع الله وثبت على ما عاهد عليه.","خير أيام العبد على الإطلاق وأفضلها يوم توبته إلى الله، وقبول الله لتوبته، ولكن في حقنا أمر غيبي، لكن المرجو أن كل تائب حقق شروط التوبة وأخلص أن الله -تعالى- يتوب عليه."],"r":["1- نزهة المتقين شرح رياض الصالحين، نشر: مؤسسة الرسالة، الطبعة: الرابعة عشر، 1407ه 1987م.","2- شرح رياض الصالحين، لابن عثيمين، نشر: دار الوطن للنشر، الرياض، الطبعة: 1426ه."],"u":"https://hadeethenc.com/ar/browse/hadith/4820"},{"id":66210,"t":"بايعوني على ألا تشركوا بالله شيئا، ولا تسرقوا، ولا تزنوا","h":"عَنْ عُبَادَةَ بْنِ الصَّامِتِ رَضِيَ اللَّهُ عَنْهُ، وَكَانَ شَهِدَ بَدْرًا، وَهُوَ أَحَدُ النُّقَبَاءِ لَيْلَةَ العَقَبَةِ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ، وَحَوْلَهُ عِصَابَةٌ مِنْ أَصْحَابِهِ: «بَايِعُونِي عَلَى أَلَّا تُشْرِكُوا بِاللَّهِ شَيْئًا، وَلاَ تَسْرِقُوا، وَلاَ تَزْنُوا، وَلاَ تَقْتُلُوا أَوْلاَدَكُمْ، وَلاَ تَأْتُوا بِبُهْتَانٍ تَفْتَرُونَهُ بَيْنَ أَيْدِيكُمْ وَأَرْجُلِكُمْ، وَلاَ تَعْصُوا فِي مَعْرُوفٍ، فَمَنْ وَفَى مِنْكُمْ فَأَجْرُهُ عَلَى اللَّهِ، وَمَنْ أَصَابَ مِنْ ذَلِكَ شَيْئًا فَعُوقِبَ فِي الدُّنْيَا فَهُوَ كَفَّارَةٌ لَهُ، وَمَنْ أَصَابَ مِنْ ذَلِكَ شَيْئًا ثُمَّ سَتَرَهُ اللَّهُ فَهُوَ إِلَى اللَّهِ، إِنْ شَاءَ عَفَا عَنْهُ وَإِنْ شَاءَ عَاقَبَهُ» فَبَايَعْنَاهُ عَلَى ذَلِكَ.","a":"متفق عليه","g":"صحيح","e":"أخبر عبادة بن الصامت رضي الله عنه، وكان ممن شهد غزوة بدر الكبرى، وهو كبير قومه الذين تقدموا لأخذ البيعة لنصرة رسول الله صلى الله عليه وسلم ليلة العقبة التي بمنى -حين كان الرسول بمكة قبل هجرته إلى المدينة- أن النبي صلى الله عليه وسلم كان جالسًا بين أصحابه فطلب منهم أن يعاهدوه على أمور: الأول: لا يشركون في عبادة الله شيئًا ولو قلّ. الثاني: لا يسرقون. الثالث: لا يفعلون فاحشة الزنا. الرابع: لا يقتلون أولادهم؛ ذكورهم خشية الفقر أو أنثاهم خشية العار. الخامس: لا يأتون بكذب يختلقونه بين أيديهم وأرجلهم حيث أن معظم الأفعال تقع بهما وإن شاركت باقي الأعضاء. السادس: لا يعصون النبي صلى الله عليه وسلم في معروف. فمن ثبت منهم على العهد والتزم بذلك فأجره على الله، ومن فعل شيئًا مما ذكر -غير الشرك- فعوقب به في الدنيا بإقامة الحد عليه فهو كفارة له وبه سقط الإثم، ومن فعل من ذلك شيئًا ثم ستره الله فأمره إلى الله؛ إن شاء عفا عنه وإن شاء عاقبه، فبايعه كل الحاضرين على ذلك.","f":["بيان ما تضمنته بيعة العقبة الأولى بمكة قبل أن يفرض عليهم الجهاد.","قال السندي: قوله ‏‏(في معروف): لا يخفى أن ‌أمره ‌كله ‌معروف ولا يتصور منه خلافه، فقوله (في معروف) للتنبيه على علة وجوب الطاعة وعلى أنه لا طاعة للمخلوق في غير المعروف، وعلى أنه ينبغي اشتراط الطاعة في المعروف في البيعة لا مطلقًا.","قال محمد بن إسماعيل التيمي وغيره: خص القتل بالأولاد؛ لأنه قتل وقطيعة رحم، فالعناية بالنهي عنه آكد، ولأنه كان شائعًا فيهم، وهو وأد البنات وقتل البنين خشية الإملاق، أو خصهم بالذكر؛ لأنهم بصدد أن لا يدفعوا عن أنفسهم.","قال النووي: عموم هذا الحديث مخصوص بقوله تعالى: {إِنَّ اللَّهَ ‌لَا ‌يَغْفِرُ أَنْ يُشْرَكَ بِهِ}، فالمرتد إذا قُتل على ارتداده لا يكون القتل له كفارة.","قال القاضي عياض: ذهب أكثر العلماء أن الحدود كفارات."],"r":["صحيح البخاري (1/ 12) (18).","صحيح مسلم (3/ 1333) (1709)."],"u":"https://hadeethenc.com/ar/browse/hadith/66210"},{"id":3260,"t":"فارجع إلى والديك، فأحسن صحبتُهما","h":"عن عبد الله بن عمرو رضي الله عنهما قال: أقبَلَ رجل إلى نبي الله صلى الله عليه وسلم فقال: أُبَايِعُكَ على الهجرة والجهاد أَبْتَغِي الأجر من الله تعالى قال: «فَهَل لَكَ من وَالِدَيك أحد حيٌّ؟» قال: نعم، بل كلاهما، قال: «فتبتغي الأجر من الله تعالى؟» قال: نعم، قال: «فَارْجِع إلى وَالِدَيك، فَأَحْسِن صُحْبَتَهُمَا». وفي رواية لهما: جاء رجل إلى النبي صلى الله عليه وسلم فاستأذنه في الجهاد، فقال: «أَحَيٌّ والداك؟»، قال: نعم، قال: «فَفِيهِمَا فجاهد».","a":"متفق عليه","g":"صحيح","e":"جاء رجل إلى النبي صلى الله عليه وسلم يخبره برغبته وحبه للجهاد والهجرة في سبيل الله تعالى ، وكان هذا الرجل قد ترك خلفه والداه، وجاء في رواية أبي داود : \" يبكيان \"، خوفا عليه من الهلاك، فسأله النبي صلى الله عليه وسلم :\" هل لك من والديك أحد حيٌّ؟\" قال: نعم، بل كلاهما، قال: \"فتبتغي الأجر من الله تعالى؟\" قال: نعم، قال: \"فارجع إلى والديك، فأحسن صُحْبتهما\"، وفي رواية أبي داود: \"ارجع عليهما فأضحكهما كما أبكيتهما\". فرده النبي صلى الله عليه وسلم لما هو أولى وأوجب في حقه، وهو الرجوع إلى والديه وأن يحسن صحبتهما، فإن ذلك من مجاهدة النفس في القيام بخدمتهما وإرضائهما وطاعتهما، كما جاء في رواية البخاري ومسلم: \" ففيهما فجاهد\". وقد صرح في حديث آخر بأن بر الوالدين وطاعتهما والإحسان إليهم أفضل من الجهاد في سبيل الله كما جاء في رواية عن ابن عمر رضي الله عنهما قال: جاء رجل إلى رسول الله صلى الله عليه وسلم فسأله عن أفضل الأعمال فقال: \"الصلاة\" قال: ثم مه: قال: \"الجهاد\" قال: فإن لي والدين، فقال: \"برك بوالديك خير\" أخرجه ابن حبان، فقد دل هذا الحديث على أن بر الوالدين أفضل من الجهاد، إلا إذا كان الجهاد فرض عين، فإنه يُقدم على طاعتهما؛ لتعينه.","f":["وجوب الهجرة والجهاد.","بر الوالدين من أوجب الواجبات.","لا يجوز الجهاد إلا بإذن الأبوين؛ لأمره -صلى الله عليه وسلم- برجوعه إلى والديه وأخذ إذنهما، كما في رواية أبي داود: \"ارجع فاستأذنهما، فإن أذنا لك فجاهد، وإلا فبرهما\".","تقديم بر الوالدين على فروض الكفاية والتطوع.","المستشار مؤتمن؛ فينبغي أن يشير بالنصيحة المحضة.","يجوز للمكلف أن يستفصل عن الأفضل من أعمال الطاعة؛ ليعمل به.","فضل بر الوالدين، وتعظيم حقهما، وكثرة الثواب على برهما.","إذا كان المسلم يستطيع المحافظة على دينه وتقواه مع بر أبويه فهذا حسن، ومن لم يستطع إلا بالفرار بدينه قدم دينه كما صنع السابقون الأولون من المهاجرين."],"r":["منار القاري شرح مختصر صحيح البخاري، المؤلف: حمزة محمد قاسم، راجعه: الشيخ عبد القادر الأرناؤوط، عني بتصحيحه ونشره: بشير محمد عيون","الناشر: مكتبة دار البيان، دمشق - الجمهورية العربية السورية، مكتبة المؤيد، الطائف - المملكة العربية السعودية،عام النشر: 1410هـ - 1990م."],"u":"https://hadeethenc.com/ar/browse/hadith/3260"},{"id":3718,"t":"رغم أنف، ثم رغم أنف، ثم رغم أنف، قيل: من؟ يا رسول الله قال: من أدرك أبويه عند الكبر، أحدهما أو كليهما فلم يدخل الجنة","h":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه عَنِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: «رَغِمَ أَنْفُ، ثُمَّ رَغِمَ أَنْفُ، ثُمَّ رَغِمَ أَنْفُ»، قِيلَ: مَنْ؟ يَا رَسُولَ اللهِ قَالَ: «مَنْ أَدْرَكَ أَبَوَيْهِ عِنْدَ الْكِبَرِ، أَحَدَهُمَا أَوْ كِلَيْهِمَا فَلَمْ يَدْخُلِ الْجَنَّةَ».","a":"رواه مسلم","g":"صحيح","e":"دَعا النبيُّ صلى الله عليه وسلم بالذّل والخِزْي حتى بلغ به كأنه وضع أنفَه في التراب -كررها ثلاثًا- فسُئِل: مَن هذا يا رسول الله الذي دعوتَ عليه؟ فقال صلى الله عليه وسلم: من أدرك والديه عند الكبر -أحدهما أو كليهما-، فلم يكونَا سببًا بدخوله الجنة؛ وذلك بسبب عدم الإحسان إليهما وعقوقهما.","f":["وجوب بِرِّ الوالدين وأنه من أسباب دخول الجنة، خصوصًا عند كبرهما وضعفهما.","عقوق الوالدين من كبائر الذنوب."],"r":["صحيح مسلم (4/ 1978) (2551).","بهجة الناظرين، لسليم الهلالي (1/ 394)."],"u":"https://hadeethenc.com/ar/browse/hadith/3718"},{"id":65221,"t":"لعن الله من ذبح لغير الله","h":"عن أبي الطفيل، قال: سئل علي: أَخَصَّكُم رسول الله صلى الله عليه وسلم بشيء؟ فقال: ما خَصَّنا رسول الله صلى الله عليه وسلم بشيء لم يَعُمَّ به الناس كافة، إلا ما كان في قِرَاب سيفي هذا، قال: فأخرج صحيفة مكتوب فيها: «لعن الله من ذبح لغير الله، ولعن الله من سرق منار الأرض، ولعن الله من لعن والده، ولعن الله من آوى مُحْدِثًا».","a":"رواه مسلم","g":"صحيح","e":"سُئل علي رضي الله عنه: هل خَصَّكم رسول الله صلى الله عليه وسلم بشيء؟ يعني هل اختصكم يا أهل البيت بشيء غير عامة الناس؟ لأنهم كانوا يظنون أن الرسول عليه السلام قد اختص آل بيته بشيء من علم أو وصية أو خبر عن شيء مستقبلي غير بقية الناس، فقال: ما خصنا رسول الله صلى الله عليه وسلم بشيء لم يعم به الناس كافة، فنفى علي كون النبي عليه السلام قد خصهم، إلا ما كان في قراب سيفي هذا، يعني إلا صحيفة كان يضعها في جِرابٍ يضع فيه سيفه، فأخرج صحيفة مكتوب فيها: لعن الله من ذبح لغير الله، والذبح لغير الله كأن لا يذكر اسم الله على الذبيحة، أو يُقرِّب قرابين للأولياء والقبور وما شابه ذلك، ولعن الله من سرق منار الأرض، أي حدودها بين المتجاورين في الأملاك، وسرقتها أخذ جزء منها ليس له، ولعن الله من لعن والده، إما مباشرةً أو بالتسبب في اللعن كأن يلعن الرجل أبا الرجل فيلعن الآخر أباه، قال تعالى: (فلا تقل لهما أفٍّ ولا تنهرهما)، ولعن الله من آوى محدثًا، أي مَن أسكن عنده جانيًا وحماه من أن يُقتص منه، وضمه إليه، ودفع عنه عقاب جريمته.","f":["الرد على الروافض فيما يدعونه من أن عليًّا رضي الله تعالى عنه عنده وصية من سيدنا رسول الله صلى الله عليه وسلم بأمور كثيرة من أسرار العلم وقواعد الدين.","إباحة كتابة الأحكام وتقييدها.","جواز سؤال الإمام فيما يتعلق بخاصته مما فيه فائدة للسائل.","تحريم الذبح لغير الله عز وجل.","الوعيد الشديد لمن يسرق أجزاء الأرض وحدودها ويأخذ ما ليس له.","الزجر الشديد عن لعن الوالدين أو التسبب في لعنهما.","المُحدِث والمؤْوِي شريكان في الإثم."],"r":["صحيح مسلم (3/ 1567) (1978)، إكمال المعلم (6/435)، شرح مصابيح السنة (4/493)، عمدة القاري شرح صحيح البخاري (2/ 161)."],"u":"https://hadeethenc.com/ar/browse/hadith/65221"},{"id":65612,"t":"إن أبي مات وترك مالًا، ولم يوص، فهل يكفر عنه أن أتصدق عنه؟","h":"عن أبي هريرة أن رجلًا قال للنبي صلى الله عليه وسلم: إن أبي مات وترك مالًا، ولم يوص، فهل يكفر عنه أن أتصدق عنه؟ قال: «نعم».","a":"رواه مسلم","g":"صحيح","e":"سأل رجلٌ النبي صلى الله عليه وسلم عن مالٍ تركه أبوه ومات، ولم يكتب وصيَّةً، فسأل النبي هل يمحو عنه ذنوبه إذا تصدقت عنه؟ فأجابه بالموافقة، كما قال السائل الآخر في حق أمه: أفلها أجر؟ ويحتمل أن يكون ذلك في الوقت الذي كانت فيه الوصية واجبة، ويكون التكفير لترك الوصية، ثم نُسخ وجوبها على الجميع إلا من كان عليه حق.","f":["استحباب الصدقة عن الميت، وأن ثوابها يصله وينفعه، بالإجماع، ولا سيما إن كان من الولد.","أن انتفاع الميت بالصدقة يُخصِّص عموم قول الله تعالى: {وأن ليس للإنسان إلا ما سعى} ويلتحق بالصدقة العتق عنه عند الجمهور.","ما كان عليه الصحابة رضي الله عنهم من استشارة النبي صلى الله عليه وسلم في أمور الدين.","بيان المسارعة إلى عمل البر، والمبادرة إلى بر الوالدين.","إظهار الصدقة قد يكون خيرا من إخفائها إذا صدقت النية."],"r":["صحيح مسلم (3/ 1254) (1630)، المفهم لما أشكل من تلخيص كتاب مسلم (4/ 552)، البحر المحيط الثجاج في شرح صحيح الإمام مسلم بن الحجاج (28/ 406)."],"u":"https://hadeethenc.com/ar/browse/hadith/65612"},{"id":3436,"t":"كان عمر بن الخطاب رضي الله عنه إذا أتى عليه أمداد أهل اليمن سألهم: أفيكم أويس بن عامر؟","h":"عن أُسَير بن عمرو، ويقال: ابن جابر قال: كَانَ عُمر بن الخطاب رضي الله عنه إِذَا أَتَى عَلَيه أَمْدَادُ أَهْلِ اليَمَن سَأَلَهُم: أَفِيكُم أُوَيس بنُ عَامِر؟ حَتَّى أَتَى عَلَى أُوَيس رضي الله عنه فقال له: أَنْت أُوَيس بنُ عَامِر؟ قال: نَعَم، قال: مِنْ مُرَادٍ ثُمَّ مِنْ قَرْنٍ؟ قَالَ: نَعَم، قَال: فَكَانَ بِكَ بَرَصٌ، فَبَرَأَتَ مِنُه إِلاَّ مَوْضِعّ دِرهَم؟ قال: نعم، قَالَ: لَكَ وَالِدة؟ قال: نعم، قال: سَمِعت رسول الله صلى الله عليه وسلم يقول: «يَأتِي عَلَيكُم أُوَيس بنُ عَامِر مَعَ أَمْدَادِ أَهْلِ اليَمَن مِنْ مُرَاد، ثُمَّ مِنْ قَرْن كَانَ بِهِ بَرَصٌ، فَبَرَأَ مِنْهُ إِلاَّ مَوضِعَ دِرْهَم، لَهُ وَالِدَة هُوَ بِهَا بَرُّ، لَوْ أَقْسَمَ عَلَى الله لَأَبَرَّه، فَإِنْ اسْتَطَعْتَ أَنْ يَسْتَغْفِرَ لَكَ فَافْعَلْ» فَاسْتَغْفِرْ لِي فَاسْتَغْفَرَ لَهُ، فَقَالَ لَه عُمر: أَيْنَ تُرِيد؟ قَالَ: الكُوفَة، قال: أَلاَ أَكتُبُ لَكَ إِلَى عَامِلِهَا؟ قال: أَكُون فِي غَبْرَاءِ النَّاسِ أَحَبُّ إِلَيَّ، فَلَمَّا كَانَ مِنَ العَام الْمُقْبِل حَجَّ رَجُلٌ مِنْ أَشْرَافِهِم، فَوَافَقَ عُمَر، فَسَأَلَه عَنْ أُوَيس، فقال: تَرَكْتُهُ رَثَّ البَّيت قَلِيلَ الْمَتَاعِ، قال: سمعت رسول الله صلى الله عليه وسلم يقول: «يَأْتِي عَلَيكُم أُوَيس بنُ عَامِر مَعَ أَمْدَادٍ مِنْ أَهْلِ اليَمَن مِنْ مُرَاد، ثُمَّ مِنْ قَرْن، كَانَ بِهِ بَرَص فَبَرَأَ مِنْه إِلاَّ مَوْضِعَ دِرْهَم، لَهُ وَالِدَة هُوَ بِهَا بَرٌّ لَوْ أَقْسَمَ عَلى الله لَأَبَرَّهُ، فَإِنْ اسْتَطَعْتَ أَنْ يَسْتَغْفِر لَكَ، فَافْعَلْ» فَأَتَى أُوَيسًا، فقال: اسْتَغْفِر لِي، قال: أَنْتَ أَحْدَثُ عَهْدًا بِسَفَرٍ صَالِحٍ، فَاسْتَغْفِرْ لِي، قال: لَقِيتَ عمر؟ قال: نَعَم، فاستغفر له، فَفَطِنَ لَهُ النَّاس، فَانْطَلَقَ عَلَى وَجْهِهِ. وفي رواية أيضا عن أُسَير بن جابر: أنَّ أَهلَ الكُوفَةِ وَفَدُوا على عمر رضي الله عنه وفيهم رَجُلٌ مِمَّن كان يَسْخَرُ بِأُوَيْسٍ، فقال عمر: هَل هاهُنَا أَحَدٌ مِنَ القَرَنِيِّين؟ فَجَاء ذلك الرجل، فقال عمر: إِنَّ رسول الله صلى الله عليه وسلم قَدْ قال: «إِنَّ رَجُلاً يَأْتِيكُم مِنَ اليَمَنِ يُقَالُ لَهُ: أُوَيْسٌ، لاَ يَدَعُ بِاليَمَنِ غَيرَ أُمٍّ لَهُ، قَد كَان بِهِ بَيَاضٌ فَدَعَا الله تعالى ، فَأَذْهَبَهُ إِلاَّ مَوضِعَ الدِّينَارِ أَو الدِّرْهَمِ، فَمَنْ لَقِيَهُ مِنْكُمْ، فَلْيَسْتَغْفِر لَكُم». وفي رواية له: عن عمر رضي الله عنه قال: إِنِّي سمعت رسول الله صلى الله عليه وسلم يقول: «إِنَّ خَيرَ التَّابِعِين رَجُلٌ يُقَال لَهُ: أُوَيسٌ، وَلَهُ وَالِدَةٌ وَكَانَ بِهِ بَيَاضٌ، فَمُرُوهُ، فَلْيَسْتَغْفِر لَكُم».","a":"رواه مسلم","g":"صحيح","e":"كان عمر بن الخطاب إذا أتى عليه جماعات الغزاة من أهل اليمن الذين يمدون جيوش الإسلام في الغزو، سألهم: أفيكم أويس بن عامر، فما زال كذلك حتى جاء أويس رحمه الله فقال له عمر: هل أنت أويس بن عامر؟ قال: نعم، قال عمر: هل أنت من قبيلة مراد ثم من قرن؟ قال: نعم، ثم قال له عمر: وهل كان بك برص فشُفيت منه إلا موضع درهم؟ قال: نعم، قال عمر: هل لك والدة؟ قال: نعم، فقال عمر: فإني سمعت رسول الله صلى الله عليه وسلم يقول: إنه سيأتي عليكم أويس بن عامر، مع جماعات الغزاة من أهل اليمن من قبيلة مراد ثم من قرن وكان به برص فشفاه الله منه إلا موضع درهم، له والدة هو بار بها، لو أقسم على الله بحصول أمر لأبرّه الله بحصول ذلك المقسم على حصوله فإن استطعت يا عمر أن يستغفر لك فافعل، ولا يفهم من هذا أفضليته على عمر، ولا أن عمر غير مغفور له للإجماع على أن عمر أفضل منه لأنه تابعي والصحابي أفضل منه، إنما مضمون ذلك الإخبار بأن أويساً ممن يستجاب له الدعاء، وإرشاد عمر إلى الازدياد من الخير واغتنام دعاء من تُرجى إجابته، وهذا نحو مما أمرنا النبي به من الدعاء له، والصلاة عليه وسؤال الوسيل
