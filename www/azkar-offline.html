ة له وإن كان النبي أفضل ولد آدم. ثم سأله عمر أن يستغفر له فاستغفر له، ثم قال له عمر: ما هو المكان الذي سوف تذهب إليه؟ فقال: الكوفة، قال عمر: هل أكتب لك إلى أميرها ليعطيك من بيت مال المسلمين ما يكفيك؟ قال أويس: لأن أكون في عوام الناس وفقرائهم أحبّ إلي، فلما كان من العام المقبل، حج رجل من أشراف أهل الكوفة فقابل عمر فسأله عمر عن أويس فقال: تركته وبيته متواضع وأثاث بيته قليل قال عمر سمعت رسول الله صلى الله عليه وسلم يقول: إنه سيأتي عليكم أويس بن عامر، مع جماعات الغزاة من أهل اليمن من قبيلة مراد ثم من قرن وكان به برص فشفاه الله منه إلا موضع درهم، له والدة هو بار بها، لو أقسم على الله بحصول أمر لأبرّه الله بحصول ذلك المقسم على حصوله فإن استطعت يا عمر أن يستغفر لك فافعل. فأتى ذلك الرجل أويساً فقال له: استغفر لي، فقال: أويس أنت أقرب عهداً بسفر صالح فاستغفر لي، فتنبه أويس أنه لعله لقي عمر، فقال له: هل لقيت عمر؟ قال: نعم، فاستغفر أويس له فتنبه الناس لهذا الأمر فأقبلوا عليه، فخرج من الكوفة وذهب إلى مكان آخر لا يعرفه فيه الناس.","f":["فضل أويس بن عامر وأنه خير التابعين.","معجزة للنبي -صلى الله عليه وسلم- لما فيه من الإخبار بالأمر قبل وقوعه، وذكر أويسا باسمه، وصفته، وعلامته، واجتماعه بعمر، وإنما يعلم النبي ما أطلعه الله عليه من الغيب فقط.","ما فعله عمر -رضي الله عنه- تبليغ الشريعة ونشر السنة، والإقرار بالفضل لأهله، والثناء على من لا يُخشى عليه عجب بذلك.","تواضع عمر -رضي الله عنه- وحرصه على الخير، وهو يومئذ خليفة المسلمين.","جواز اعتزال الناس إذا خشي المرء على نفسه الفتنة.","الإنسان بجوهره وليس بمظهره، ولذلك؛ فإن مقياس العباد للناس غير مقياس الحق -تبارك وتعالى-؛ فالناس ينظرون إلى مظاهر الدنيا وزينتها ولذلك يسخرون من المؤمنين، والحق سبحانه ينظر إلى قلوب عباده وأعمالهم.","الإقرار بالفضل لأهله.","فضل بر الوالدة وأنه من أفضل القربات.","طلب الدعاء من الصالحين وإن كان الطالب أفضل، بشرط ألا يدع الطالب الدعاء بنفسه وأن يأمن من حصول فتنة للمطلوب منه."],"r":["بهجة الناظرين شرح رياض الصالحين، لسليم الهلالي، ط1، دار ابن الجوزي، الدمام، 1415هـ.","تطريز رياض الصالحين، للشيخ فيصل المبارك، ط1، تحقيق: عبد العزيز بن عبد الله آل حمد، دار العاصمة، الرياض، 1423هـ."],"u":"https://hadeethenc.com/ar/browse/hadith/3436"},{"id":3493,"t":"إنَّ أبر البر صلة الرجل أهل وُدَّ أبيه","h":"عن عبد الله بن عمر رضي الله عنهما أَنَّ رَجُلاً مِنَ الأعرَاب لَقِيهَ بِطَريق مَكَّة، فَسَلَّم عَلَيه عَبد الله بنُ عمر، وَحمَلهُ على حمار كان يركَبُهُ، وَأعطَاه عِمَامَة كَانت على رأسه، قال ابن دينار: فقُلنا له: أَصْلَحَك الله، إنَّهم الأعراب وهُم يَرْضَون بِاليَسِير، فقال عبدُ الله بنَ عُمر: إِنَّ أَبَا هَذَا كَانَ وُدًّا لِعُمر بنِ الخطَّاب رضي الله عنه وإنِّي سَمِعت رسول الله صلى الله عليه وسلم يقول: «إِنَّ أَبَرَّ البِرِّ صِلَةُ الرَّجُل أَهْلَ وُدِّ أَبِيه». وفي رواية عن ابن دينار، عن ابن عمر: أنَّه كان إذَا خَرَج إلى مكة كان له حمار يَتَرَوَّحُ عليه إذا ملَّ رُكُوبَ الرَّاحِلة، وَعِمَامة يَشُدُّ بها رأسه، فَبينَا هو يومًا على ذلك الحمار إِذْ مَرَّ بِهِ أَعْرَابِي، فقال: أَلَسْتَ فُلاَن بنَ فُلاَن؟ قال: بَلَى. فَأَعْطَاهُ الحِمَار، فقال: ارْكَب هَذَا، وَأَعْطَاهُ العِمَامَةَ وَقَالَ: اشْدُدْ بِهَا رَأْسَكَ، فَقَالَ لَهُ بَعض أصحَابِه: غفر الله لك أَعْطَيت هذا الأعرابي حمارا كنت تَرَوَّحُ عليه، وعِمَامَة كُنتَ تشدُّ بها رأسَك؟ فقال: إِنِّي سمِعت رسول الله صلى الله عليه وسلم يقول: «إِنَّ مِنْ أَبَرِّ البِّر أَنْ يَصِلَ الرَّجُلُ أَهْلَ وُدَّ أَبِيهِ بَعْدَ أَنْ يُوَلِّيَ» وَإِنَّ أَبَاه كان صَدِيقًا لِعُمَرَ رضي الله عنه .","a":"رواه مسلم","g":"صحيح","e":"كان ابن عمر رضي الله عنهما إذا خرج إلى مكة حاجا يكون معه حمار يَتروَّح عليه إذا مل الركوب على الراحلة -أي البعير- فيستريح على هذا الحمار ثم يركب الراحلة. وفي يوم من الأيام لقيه أعرابي فسأله ابن عمر: أنت فلان ابن فلان؟ قال: نعم، فنزل عن الحمار وقال: خذ هذا اركب عليه، وأعطاه عمامة كان قد شد بها رأسه، وقال لهذا الأعرابي: اشدد رأسك بهذا. فقيل لعبد الله بن عمر: أصلحك الله أو غفر الله لك! إنهم الأعراب، والأعراب يرضون بدون ذلك، يعنون: كيف تنزل أنت عن الحمار تمشي على قدميك، وتعطيه عمامتك التي تشد بها رأسك، وهو أعرابي يرضى بأقل من ذلك. فقال: «إِنَّ أَبَرَّ البِرِّ صِلَةُ الرَّجُل أَهْلَ وُدِّ أَبِيه»: يعني أن أبر البر إذا مات أبو الرجل أو أمه أو أحد من أقاربه أن تَبُرَّ أهل وُدِّهِ، يعني ليس صديقه فقط بل حتى أقارب صديقه. وقوله:7و \"إِنَّ أبا هذا كان صديقا لعمر\" أي: لعمر بن الخطاب أبيه، فلما كان صديقا لأبيه؛ أكرمه برًّا بأبيه عمر رضي الله عنه .","f":["من بر الرجل بوالده أن يحب أصحابه بعد موته ويحسن إليهم.","تعليم أدب الدعاء المتضمن اللطف في العتاب في قولهم: غفر الله لك، وأصلحك الله، وهذا أدب القرآن المستفاد من قوله تعالى: (عَفَا اللَّهُ عَنْكَ لِمَ أَذِنْتَ لَهُمْ حَتَّى يَتَبَيَّنَ لَكَ الَّذِينَ صَدَقُوا وَتَعْلَمَ الْكَاذِبِينَ)، التوبة: (43).","في وصف أصحاب ابن عمر للأعراب بأنهم يرضون باليسير؛ دلالة على تأثر الإنسان ببيئته؛ فالأعراب أهل كفاف فلذلك يقنعون باليسير.","كثرة فضائل عبد الله بن عمر، فمنها شدة وفائه وحبه لأبيه، ووَصْلِ أحبائه بعد موته، واستجابته لسنة رسول الله -صلى الله عليه وسلم-، وإنفاقه من طِيب ماله، وإيثاره غيره على نفسه.","امتثال الصحابة -رضي الله عنهم-، ورغبتهم في الخير ومسارعتهم إليه.","من تمام بر الوالدين صِلة أصدقائهما بعد موتهما، وصورة ذلك: أنَّه إذا كان لأبيك أو أمك أحد بينهم وبينه وُدٌّ فأكرمه، كذلك إذا كان هناك نسوة صديقات لأمك؛ فأكرم هؤلاء النسوة، وإذا كان رجال أصدقاء لأبيك؛ فأكرم هؤلاء الرجال، فإن هذا من البر بهما، ويحصل بالقليل، فمن لم يجد فبالزيارة أو الكلمة الطيبة.","سعة رحمة الله -عز وجل-، حيث إنَّ البِرَّ بابه واسع لا يختص بالوالد والأم فقط؛ بل حتى أصدقاء الوالد وأصدقاء الأم، إذا أحسنت إليهم فإِنَّما بررت والديك فتثاب ثواب البار بوالديه."],"r":["بهجة الناظرين شرح رياض الصالحين، لسليم الهلالي، ط1، دار ابن الجوزي، الدمام، 1415هـ.","تطريز رياض الصالحين، للشيخ فيصل المبارك، ط1، تحقيق: عبد العزيز بن عبد الله آل حمد، دار العاصمة، الرياض، 1423 هـ."],"u":"https://hadeethenc.com/ar/browse/hadith/3493"},{"id":3775,"t":"لا يَجزي ولدٌ والدًا إلا أن يَجده مملوكًا، فيَشتريه فيُعتِقه","h":"عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم : «لاَ يَجْزِي ولدٌ والدًا إلا أن يجده مملوكًا، فَيَشْتَرِيَهُ فَيُعْتِقَهُ».","a":"رواه مسلم","g":"صحيح","e":"لا يقوم ولد بما لأبيه عليه من حق ولا يكافئه بإحسانه به إلا أن يجده مملوكًا فيشتريه ويعتقه.","f":["عظيم حق الوالدين في الإسلام.","ظاهر الحديث: أنه لا بد من التصريح بالعتق، ولكن هذا الظاهر غير مراد بل يُعتق الأب على الابن بمجرد الشراء، ولا يحتاج إلى تصريح بالعتق.","إذا اشترى الولد أمه المملوكة عُتقت عليه بمجرد الشراء ولا يحتاج إلى تصريح بالعتق.","لا يجوز للولد أن يسترق أبويه أو أحدهما، فإن حدث ذلك؛ فهو من أمارات الساعة، ودلائل تغيير الزمان."],"r":["- صحيح البخاري، للإمام محمد بن إسماعيل البخاري، عناية محمد زهير الناصر، دار طوق النجاة، الطبعة الأولى، 1422هـ.","- صحيح مسلم، للإمام مسلم بن الحجاج، تحقيق محمد فؤاد عبد الباقي، دار إحياء التراث العربي."],"u":"https://hadeethenc.com/ar/browse/hadith/3775"},{"id":10417,"t":"خرج ثلاثة نفر يمشون فأصابهم المطر، فدخلوا في غار في جبل، فانحطت عليهم صخرة","h":"عن ابن عمر رضي الله عنهما ، عن النبي صلى الله عليه وسلم ، قال: «خرج ثلاثةُ نَفَرٍ يمشون فأصابهم المَطَر، فدَخَلوا في غارٍ في جبَل، فانْحَطَّت عليهم صَخْرةٌ، قال: فقال بعضُهم لبعض: ادعوا اللهَ بأفضلِ عَمَلٍ عَمِلتموه، فقال أحدُهم: اللهمَّ إني كان لي أبَوَانِ شَيْخانِ كبيران، فكنتُ أخرج فَأَرْعى، ثم أَجيء فأحْلِب فأجيء بالحِلاب، فآتي به أبويَّ فيَشْربان، ثم أسِقِيَ الصِّبْيَة وأهلي وامرأتي، فاحتَبَستُ ليلة، فجئتُ فإذا هما نائمان، قال: فكرهتُ أن أُوقِظَهما، والصِّبية يَتَضَاغَوْن عند رِجْلي، فلم يزل ذلك دَأْبي ودَأْبَهما، حتى طلَع الفجر، اللهم إن كنتَ تَعْلَمُ أنِّي فعلتُ ذلك ابْتغاء وجهِك، فافرُجْ عنا فُرْجة نرى منها السماء، قال: فَفُرِج عنهم، وقال الآخر: اللهم إن كنتَ تعلم أني كنتُ أُحبُّ امرأةً مِن بنات عمي كأشَدِّ ما يُحبُّ الرجلُ النساء، فقالت: لا تَنال ذلك منها حتى تعطيها مائة دينار، فسَعيْتُ فيها حتى جَمَعتُها، فلما قَعَدتُ بيْن رِجليْها قالت: اتقِ الله ولا تَفُضَّ الخاتَمَ إلا بحقِّه، فقمتُ وتركتُها، فإن كنتَ تعْلَم أنِّي فعلتُ ذلك ابتغاء وجهِك، فافرُجْ عنا فُرْجَة، قال: ففُرِج عنهم الثُّلُثيْنِ، وقال الآخر: اللهم إن كنتَ تعْلَم أني اسْتَأجَرْتُ أجيرًا بفَرَق من ذُرَة فأعْطيتُه، وأَبَى ذاك أنْ يأخُذَ، فعَمَدتُ إلى ذلك الفَرَق فزرعتُه، حتى اشتريتُ منه بقرًا وراعِيها، ثم جاء فقال: يا عبد الله أعْطِني حَقِّي، فقلتُ: انطلقْ إلى تلك البقر وراعِيها فإنها لك، فقال: أتستهْزِئ بي؟ قال: فقلت: ما أستهزئ بك ولكنها لك، اللهم إن كنتَ تعلم أنِّي فعلتُ ذلك ابتغاء وجهك، فافْرُجْ عنا فكُشِف عنهم».","a":"متفق عليه","g":"صحيح","e":"خرج ثلاثة من الناس يمشون فأمطرت عليهم السماء، فدخلوا في غار ليحتموا به من شدة المطر، فوقعت صخرة فسدت باب الغار، فقال بعضهم لبعض: ادعوا الله بأفضل عمل عملتموه؛ لعل الله أن يفرج عنكم ويزيل هذه الصخرة، فقال أحد الثلاثة: اللهم إنه كان لي أب وأم كبيران في السن، وكنت أخرج إلى المرعى فأرعى إبلي، ثم أجيء من المرعى، فأحلب إبلي، فأجيء باللبن فآتي به أبي وأمي فأناولهما إياه فيشربان، ثم أسقي أولادي الصغار وزوجتي وبقية أهلي من أخ وأخت، فتأخرت ليلة من الليالي بسبب أمر عرض لي، فإذا أبي وأمي نائمان، فحلبت كما كنت أحلب، فقمت عند رؤوسهما أكره أن أوقظهما، وأكره أن أسقي أولادي وأهلي قبلهما، وكان أولادي يبكون ويصرخون من شدة الجوع عند رجلي، فلم يزل ذلك شأني وشأنهما حتى طلع الفجر واستيقظا فسقيتهما ثم سقيت أولادي، فاللهم إن كنتَ تعلم أني فعلت ذلك طلبًا لمرضاتك، فأزح عنا هذه الصخرة قليلا حتى نرى السماء، ففرج الله عنهم فرجة رأوا منها السماء. وقال الثاني: اللهم إني كنت أحب أمرأة من بنات عمي حبًّا شديدًا، فراودتها عن نفسها فامتنعت مني إلا أن أعطيها مائة دينار، فحصَّلت المائة دينار، ثم أعطيتها لها، فلما تمكنت منها وقعدت بين رجليها، قالت لي: خف الله ولا ترتكب الحرام، ولا تُزل بكارتي إلا بالحلال، فقمت من بين رجليها وتركتها، ولم أفعل بها شيئا، فاللهم إن كنتَ تعلم أني فعلت ذلك طلبا لمرضاتك، فأزح عنا من هذه الصخرة، ففرج الله عنهم ثلثي الموضع الذي عليه الصخرة. وقال الثالث: اللهم إني استأجرتُ أجيرًا ليعمل لي عملا على أن أُعطيه ستة عشر رطلا من الذرة، فلما انتهى من عمله، أعطيته أجره فامتنع أن يأخذه، فأخذت الذرة فزرعتها، ولم أزل أزرعها وأبيعها حتى اشتريت منها بقرا وراعيها، ثم جاء الأجير بعد مدة فقال: يا عبد الله أعطني حقي. فقلت: انطلق إلى تلك البقر وراعيها فإنها لك فخذها جميعًا. فقال الأجير: أتسخر مني؟ فقلت: إني لا أسخر منك، ولكنها لك، فاللهم إن كنتَ تعلم أني فعلت ذلك طلبا لمرضاتك، ففرج عنا هذه الصخرة، ففرج الله عنهم ما بقي من باب المغارة، فخرجوا منها.","f":["فضل بر الوالدين وفضل خدمتهما وإيثارهما على من سواهما من الأولاد والزوجة، ووجوب النفقة عليهما.","فضل العفاف والانكفاف عن المحرمات بعد القدرة عليها.","فضيلة أداء الأمانة.","جواز بيع الإنسان مال غيره والتصرف فيه بغير إذن مالكه، ويتوقف صحته على إجازة المالك بعد ذلك.","جواز الإجارة بالطعام.","قبول التوبة، وأن من صلح فيما بقي غفر له ما سبق، وأن من هم بسيئة فتركها ابتغاء وجهه كتب له أجرها.","يستحب الدعاء في حال الكرب والتوسل بصالح العمل إلى الله -تعالى-.","إثبات كرامات الأولياء والصالحين.","الإخبار عن متقدمي الأمم وذكر أعمالهم لترغيب أمته -صلى الله عليه وسلم- في مثلها.","بيان قدرة الله -عز وجل- حيث أمر هذه الصخرة أن تنحدر فتنطبق عليهم ثم أمرها أن تنفرج عنهم, والله -سبحانه- على كل شيء قدير.","أن الله تعالي سميع الدعاء؛ فإنه سمع دعاء هؤلاء واستجاب لهم.","أن الإخلاص من أسباب تفريج الكربات.","شرع من قبلنا شرع لنا ما لم ينكره الشرع."],"r":["- صحيح البخاري، نشر: دار طوق النجاة (مصورة عن السلطانية بإضافة ترقيم محمد فؤاد عبد الباقي)، الطبعة: الأولى، 1422ه.","- صحيح مسلم، تحقيق: محمد فؤاد عبد الباقي، نشر: دار إحياء التراث العربي – بيروت."],"u":"https://hadeethenc.com/ar/browse/hadith/10417"},{"id":3792,"t":"لِلْعَبْدِ المَمْلُوكِ المُصْلِحِ أجْرَان","h":"عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم : «للعبد المملوك المصلح أجران»، والذي نفس أبي هريرة بيده لولا الجهاد في سبيل الله والحج، وبِرُّ أمي، لأحببت أن أموت وأنا مملوك.","a":"متفق عليه","g":"صحيح","e":"معنى الحديث: أي إذا أصلح العبد حاله مع سيده؛ بأن قام بما وجب عليه من طاعته فيما يأمره به بالمعروف وقام بحق الله تعالى من أداء الواجبات واجتناب المنهيات، فإن له الأجر مرتين يوم القيامة. الأول: أجر قيامه بحق سيده فيما وجب عليه. الثاني: أجر القيام بحق الله تعالى فيما افترضه الله عليه. و أبو هريرة رضي الله عنه بعد رواية الحديث: أقسم بالله أنه لولا الجهاد في سبيل الله والحج وبرُّ أمه، لتمنى أن يكون عبداً مملوكًا. إلا أن الذي يمنعه من ذلك: الجهاد في سبيل الله؛ لأن العبد ليس له الخروج للجهاد، إلا بإذن سيده وقد يمنعه لحاجته أو خوف هلاكه. ولولا الحج لتمنى أن يكون عبداً مملوكاً؛ لأن العبد ليس له الخروج للحج إلا بإذن سيده، فقد يمنعه من الحج لحاجته إليه. ومما يمنعه من تمني العبودية، بِرُّ أمه وطاعتها؛ فإن طاعة السيد مقدمة على طاعة والدته وحقه أوكد من حقها؛ لأن كلَّ منافعه مملوكة لسيده، فله التصرف المطلق، وهذا مما قد يمنعه من القيام على أمه وبرها وطاعتها.","f":["مزيد الفضل للعبد الموصوف بتلك الصفة، لما يدخل عليه من مشقة الرق.","فضيلة الجهاد والحج وبر الوالدين، وخاصة الأم.","العبد لا جهاد عليه ولا حج، وإن صح ذلك منه.","الصلاح يشمل إحسان العبد والنصح لسيده."],"r":["- رياض الصالحين من كلام سيد المرسلين، للإمام أبي زكريا النووي، تحقيق د. ماهر الفحل، دار ابن كثير-دمشق، الطبعة الأولى، 1428هـ.","- بهجة الناظرين شرح رياض الصالحين، تأليف سليم الهلالي، دار ابن الجوزي- الطبعة الأولى1418هـ."],"u":"https://hadeethenc.com/ar/browse/hadith/3792"},{"id":5518,"t":"من يرد الله به خيرا يفقهه في الدين","h":"عن معاوية رضي الله عنه قال: سمعت النبي صلى الله عليه وسلم يقول: «مَنْ يُرِدِ اللهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ، وَإِنَّمَا أَنَا قَاسِمٌ، وَاللهُ يُعْطِي، وَلَنْ تَزَالَ هَذِهِ الْأُمَّةُ قَائِمَةً عَلَى أَمْرِ اللهِ، لَا يَضُرُّهُمْ مَنْ خَالَفَهُمْ، حَتَّى يَأْتِيَ أَمْرُ اللهِ».","a":"متفق عليه","g":"صحيح","e":"يُخْبِرُ النبيُّ صلى الله عليه وسلم أنَّ مَن أراد اللهُ به خيرًا فإنه يرزقه فَهمًا في دينه سبحانه، وأنه عليه الصلاة والسلام قاسِمٌ يَقْسِمُ ويُوَزِّعُ ما آتاه الله تعالى من الرزق والعلم وغيرِه، وأنَّ المُعطِي حقيقةً هو الله، وأما غيرُه فهم أسبابٌ لا تَنْفَعُ إلا بإذن الله، وأنه لن تزال هذه الأمةُ قائمةً على أمر الله، لا يضرهم مَن خالفهم، حتى تقوم الساعة.","f":["عَظَمة وفَضْل العلم الشرعي وتَعَلُّمُه والحثُّ عليه.","القيام بالحق لا بد من وجودِه في هذه الأمة، فإذا تخلَّت عنه طائفة قام به غيرُها.","التَّفَقُّهُ في الدين مِن إرادةِ اللهِ تعالى الخيرَ لعبدِه.","النبي صلى الله عليه وسلم إنما يُعْطِي بأمر الله ومشيئته، وأنه لا يملك شيئًا."],"r":["صحيح البخاري (1/ 25) (71).","صحيح مسلم (2/ 718) (1037)."],"u":"https://hadeethenc.com/ar/browse/hadith/5518"},{"id":3007,"t":"أما إني لم أستحلفكم تهمة لكم، ولكنه أتاني جبريل فأخبرني أن الله عز وجل يباهي بكم الملائكة","h":"عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ قَالَ: خَرَجَ مُعَاوِيَةُ عَلَى حَلْقَةٍ فِي الْمَسْجِدِ، فَقَالَ: مَا أَجْلَسَكُمْ؟ قَالُوا: جَلَسْنَا نَذْكُرُ اللهَ، قَالَ آللَّهِ مَا أَجْلَسَكُمْ إِلَّا ذَاكَ؟ قَالُوا: وَاللهِ مَا أَجْلَسَنَا إِلَّا ذَاكَ، قَالَ: أَمَا إِنِّي لَمْ أَسْتَحْلِفْكُمْ تُهْمَةً لَكُمْ، وَمَا كَانَ أَحَدٌ بِمَنْزِلَتِي مِنْ رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ أَقَلَّ عَنْهُ حَدِيثًا مِنِّي: وَإِنَّ رَسُولَ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ خَرَجَ عَلَى حَلْقَةٍ مِنْ أَصْحَابِهِ، فَقَالَ: «مَا أَجْلَسَكُمْ؟» قَالُوا: جَلَسْنَا نَذْكُرُ اللهَ وَنَحْمَدُهُ عَلَى مَا هَدَانَا لِلْإِسْلَامِ، وَمَنَّ بِهِ عَلَيْنَا، قَالَ: «آللَّهِ مَا أَجْلَسَكُمْ إِلَّا ذَاكَ؟» قَالُوا: وَاللهِ مَا أَجْلَسَنَا إِلَّا ذَاكَ، قَالَ: «أَمَا إِنِّي لَمْ أَسْتَحْلِفْكُمْ تُهْمَةً لَكُمْ، وَلَكِنَّهُ أَتَانِي جِبْرِيلُ فَأَخْبَرَنِي أَنَّ اللهَ عَزَّ وَجَلَّ يُبَاهِي بِكُمُ الْمَلَائِكَةَ».","a":"رواه مسلم","g":"صحيح","e":"خَرَجَ معاويةُ بن أبي سفيان رضي الله عنهما على حلقة في المسجد، فسألهم على أي شيء اجتمعوا، فقالوا: نذكر الله، فاستحلفهم رضي الله عنه أنهم ما أرادوا بجلوسهم واجتماعهم إلا الذكر، فحلفوا له، ثم قال لهم: إني لم أستحلفكم تهمة لكم وشكًّا في صدقكم، ثم أخبر عن منزلته من النبي صلى الله عليه وسلم وأنه ما كان أحد بمنزلة قربه منه؛ لكون أم حبيبة أخته زوجة النبي صلى الله عليه وسلم، ولكونه من كتبة الوحي، ومع ذلك فهو قليل الرواية للأحاديث، فحدثهم أن النبي صلى الله عليه وسلم خرج يومًا من بيته، فوجدهم جالسين في المسجد يذكرون الله ويحمدونه على ما هداهم للإسلام، ومنَّ به عليهم، فسألهم صلى الله عليه وسلم واستحلفهم بمثل ما فعل معاوية رضي الله عنه مع أصحابه، ثم قال لهم النبي صلى الله عليه وسلم عن سبب سؤاله لهم واستحلافهم: أنه أتاه المَلك جبريل عليه السلام فأخبره أن الله عز وجل يباهي ويفاخر بكم الملائكة، ويظهر فضلكم لهم ويريهم حسن عملكم، ويثني عليكم عندهم.","f":["فضل معاوية رضي الله عنه وحرصه على الاقتداء برسول الله صلى الله عليه وسلم في تبليغ العلم.","جواز الاستحلاف من غير تهمة للتنبيه على أهمية الخبر.","فضل مجالس الذكر والعلم وأن الله يحبها ويباهي بها الملائكة."],"r":["صحيح مسلم (4/ 2075) (2701).","نزهة المتقين (2/ 993)."],"u":"https://hadeethenc.com/ar/browse/hadith/3007"},{"id":65021,"t":"إن من أشراط الساعة أن يرفع العلم، ويكثر الجهل، ويكثر الزنا، ويكثر شرب الخمر، ويقل الرجال، ويكثر النساء حتى يكون لخمسين امرأة القيم الواحد","h":"عَنْ أَنَسٍ رَضِيَ اللَّهُ عَنْهُ، قَالَ: لَأُحَدِّثَنَّكُمْ حَدِيثًا سَمِعْتُهُ مِنْ رَسُولِ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ لاَ يُحَدِّثُكُمْ بِهِ أَحَدٌ غَيْرِي: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: «إِنَّ مِنْ أَشْرَاطِ السَّاعَةِ أَنْ يُرْفَعَ العِلْمُ، وَيَكْثُرَ الجَهْلُ، وَيَكْثُرَ الزِّنَا، وَيَكْثُرَ شُرْبُ الخَمْرِ، وَيَقِلَّ الرِّجَالُ، وَيَكْثُرَ النِّسَاءُ حَتَّى يَكُونَ لِخَمْسِينَ امْرَأَةً القَيِّمُ الوَاحِدُ».","a":"متفق عليه","g":"صحيح","e":"بيّن النبي صلى الله عليه وسلم أن من علامات قرب قيام الساعة أن يرفع العلم بالشريعة وذلك بموت العلماء، ونتيجة ذلك يكثر وينتشر الجهل، وينتشر الزنا والفاحشة، ويكثر شرب الخمر، ويقل عدد الرجال ويزيد عدد النساء؛ حتى إنه يكون لخمسين امرأة رجلٌ واحد يقوم بأمورهن ويتولى مصالحهن.","f":["بيان بعض علامات الساعة.","علم وقت الساعة من الأمور الغيبية التي استأثر الله بها.","الحث على تعلم العلم الشرعي قبل فقده."],"r":["صحيح البخاري (7/ 37) (5231)، صحيح مسلم (4/ 2056) (2671)، فتح الباري لابن حجر (9/ 330)، عمدة القاري شرح صحيح البخاري (20/ 213)."],"u":"https://hadeethenc.com/ar/browse/hadith/65021"},{"id":65059,"t":"يا أبا المنذر، أتدري أي آية من كتاب الله معك أعظم؟ قال: قلت: الله لا إله إلا هو الحي القيوم البقرة: . قال: فضرب في صدري، وقال: والله ليهنك العلم، أبا المنذر","h":"عَنْ ‌أُبَيِّ بْنِ كَعْبٍ رضي الله عنه قَالَ: قَالَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: «يَا أَبَا الْمُنْذِرِ، أَتَدْرِي أَيُّ آيَةٍ مِنْ كِتَابِ اللهِ مَعَكَ أَعْظَمُ؟» قَالَ: قُلْتُ: اللهُ وَرَسُولُهُ أَعْلَمُ. قَالَ: «يَا أَبَا الْمُنْذِرِ، أَتَدْرِي أَيُّ آيَةٍ مِنْ كِتَابِ اللهِ مَعَكَ أَعْظَمُ؟» قَالَ: قُلْتُ: {اللهُ لا إِلَهَ إِلا هُوَ الْحَيُّ الْقَيُّومُ} [البقرة: 255]. قَالَ: فَضَرَبَ فِي صَدْرِي، وَقَالَ: «وَاللهِ لِيَهْنِكَ الْعِلْمُ، أَبَا الْمُنْذِرِ».","a":"رواه مسلم","g":"صحيح","e":"سأل النبيُّ صلى الله عليه وسلم أبيَّ بن كعب عن أعظم آية في كتاب الله، فتردد في الإجابة، ثم قال: هي آية الكرسي: {الله لا إله إلا هو الحي القيوم}، فأيَّده النبي صلى الله عليه وسلم، وضرب النبي على صدره إشارة إلى امتلائه علمًا وحكمة، ودعا له بأن يَسعدَ بهذا العلم وأن يُيَسَّر له.","f":["منقبة عظيمة لأبي بن كعب رضي الله عنه.","آية الكرسي أعظم آية في كتاب الله تعالى، فينبغي حفظها وتدبر معانيها والعمل بها."],"r":["صحيح مسلم (1/ 556) (810)، إكمال المعلم (3/178)، الكاشف عن حقائق السنن (5/1644)، المفهم (2/436)، البحر المحيط الثجاج في شرح صحيح الإمام مسلم بن الحجاج (16/ 394)."],"u":"https://hadeethenc.com/ar/browse/hadith/65059"},{"id":65566,"t":"إذا مات الإنسان انقطع عنه عمله إلا من ثلاثة: إلا من صدقة جارية، أو علم ينتفع به، أو ولد صالح يدعو له","h":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه أَنَّ رَسُولَ اللهِ صلى الله عليه وسلم قَالَ: «إِذَا مَاتَ الْإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلَّا مِنْ ثَلَاثَةٍ: إِلَّا مِنْ صَدَقَةٍ جَارِيَةٍ، أَوْ عِلْمٍ يُنْتَفَعُ بِهِ، أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ».","a":"رواه مسلم","g":"صحيح","e":"أَخْبَرَ النبيُّ صلى الله عليه وسلم أنَّ عملَ الميتِ ينقطع بموته، فلا تحصل له الحسنات بعد موته إلا في هذه الأشياء الثلاثة؛ لكونه كان سببَها: الأول: الصدقة التي يَجْري ثوابُها ويدوم، غير المُنقَطِع كالوقف، وبناء المساجد، وحفر الآبار، وغير ذلك. الثاني: العلم الذي يَنتفِعُ به الناس، كتصنيف كتب العلم، أو كأنْ يُعَلِّمَ شخصًا، فيقوم ذلك الشخص بنشر ذلك العلم بعد موته. الثالث: الولد الصالح المؤمن يدعو لوالديه.","f":["أجمع أهل العلم على أنّ مما يَلْحَقُ الإنسانَ بعد موته من الثواب: الصدقة الجارية، والعلم الذي ينتفع به، والدعاء، وورد في الأحاديث الأخرى: الحج أيضًا.","خص هذه الثلاثة بالذكر في هذا الحديث؛ لأنها أصول الخير، وأغلب ما يقصد أهل الفضل بقاءَه بعدهم.","كل علم يُنتَفَع به فإنه يحصل له الأجر، لكن على رأسها وقمَّتِها العلمُ الشرعي والعلوم المساندة له.","العلم أنفع هذه الثلاث؛ لأن العلم ينتفع به الإنسان الذي يتعلمه، العلم فيه حفظ الشريعة، فيه نفع الخلق عمومًا، وهو أشمل وأعم لأنه يتعلم من علمك الموجود في حياتك والموجود بعد وفاتك.","الحث على تربية الأولاد الصالحين؛ فهم الذين ينفعون والديهم في الآخرة، ومِن نَفْعِهم أنهم يدعون لهم.","الحث على الإحسان إلى الوالدين بعد موتهما، وهو أيضا من البر الذي يستفيد الولد منه.","الدعاء ينفع الميت ولو كان من غير الولد، ولكن خص الولد بالذكر لأنه الذي يستمر في الدعاء للشخص غالبًا إلى أن يموت هو."],"r":["صحيح مسلم (3/ 1255) (1631)، البحر المحيط الثجاج في شرح صحيح الإمام مسلم بن الحجاج (28/ 413)."],"u":"https://hadeethenc.com/ar/browse/hadith/65566"},{"id":4233,"t":"مثل ما بعثني الله به من الهدى والعلم كمثل الغيث الكثير أصاب أرضا","h":"عَنْ أَبِي مُوسَى رَضيَ اللهُ عنه عَنِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: «مَثَلُ مَا بَعَثَنِي اللَّهُ بِهِ مِنَ الهُدَى وَالعِلْمِ كَمَثَلِ الغَيْثِ الكَثِيرِ أَصَابَ أَرْضًا، فَكَانَ مِنْهَا نَقِيَّةٌ، قَبِلَتِ المَاءَ، فَأَنْبَتَتِ الكَلَأَ وَالعُشْبَ الكَثِيرَ، وَكَانَتْ مِنْهَا أَجَادِبُ، أَمْسَكَتِ المَاءَ، فَنَفَعَ اللَّهُ بِهَا النَّاسَ، فَشَرِبُوا وَسَقَوْا وَزَرَعُوا، وَأَصَابَتْ مِنْهَا طَائِفَةً أُخْرَى، إِنَّمَا هِيَ قِيعَانٌ لاَ تُمْسِكُ مَاءً وَلاَ تُنْبِتُ كَلَأً، فَذَلِكَ مَثَلُ مَنْ فَقُهَ فِي دِينِ اللَّهِ وَنَفَعَهُ مَا بَعَثَنِي اللَّهُ بِهِ، فَعَلِمَ وَعَلَّمَ، وَمَثَلُ مَنْ لَمْ يَرْفَعْ بِذَلِكَ رَأْسًا، وَلَمْ يَقْبَلْ هُدَى اللَّهِ الَّذِي أُرْسِلْتُ بِهِ».","a":"متفق عليه","g":"صحيح","e":"شَبّه النبي صلى الله عليه وسلم متعجبًا من ينتفع بما جاء به من الدلالة والطريق الذي يوصل للمطلوب، والعلم الشرعي بالأرض التي ينزل عليها المطر الكثير؛ فكانت أقسامًا ثلاثة: أولها: أرض نقية طيبة، تقبل ماء الأمطار، فتنبت النبات الكثير رطبًا ويابسًا، فانتفع الناس بها. وثانيها: أرض ممسكة للماء لكنها لا تنبت زرعًا، فهي تحفظ الماء لينتفع به الناس؛ فيشربون ويسقون مواشيهم وزروعهم. وثالثها: أرض مستوية ملساء لا تمسك ماء ولا تنبت زرعًا، فهي لم تنتفع بذلك الماء في نفسها، ولم ينتفع الناس منها. فكذا السامعين لما بُعث به النبي صلى الله عليه وسلم من العلم والهدى. فالأول: العالم المتفقه في دين الله، العامل بعلمه، المعلم لغيره؛ فهو بمنزلة الأرض الطيبة شربت فانتفعت في نفسها، وأنبتت فنفعت غيرها. والثاني: الحافظ للعلم لكن ليس له فهم واستنباط، فهو جامع للعلم، مستغرق لزمانه في ذلك، غير أنه لم يعمل بنوافله، أو لم يفقه ما جمع؛ فهو أداة لغيره، وهو بمنزلة الأرض التي يستقر فيها الماء فينتفع الناس به. والثالث: من يسمع العلم فلا يحفظه، ولا يعمل به، ولا ينقله لغيره؛ فهو بمنزلة الأرض السبخة أو الملساء التي لا نبات فيها ولا تقبل الماء أو تفسده على غيرها.","f":["بيان فضل طلب العلم وتعليمه، والتحذير من الإعراض عنهما.","ضرب الأمثال لتقريب المعاني للناس.","قال القرطبي: فكما أن الغيث يحيي البلد الميت فكذا علوم الدين تحيي القلب الميت، ثم شبه السامعين له بالأرض المختلفة التي ينزل بها الغيث.","الناس في الأخذ بالعلم الشرعي مراتب."],"r":["صحيح البخاري (1/ 27) (79).","صحيح مسلم (4/ 1787) (2282)."],"u":"https://hadeethenc.com/ar/browse/hadith/4233"},{"id":4801,"t":"من نفس عن مؤمن كربة من كرب الدنيا نفس الله عنه كربة من كرب يوم القيامة","h":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه قَالَ: قَالَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: «مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ، وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ يَسَّرَ اللهُ عَلَيْهِ فِي الدُّنْيَا وَالْآخِرَةِ، وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللهُ فِي الدُّنْيَا وَالْآخِرَةِ، وَاللهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ، وَمَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ، وَمَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللهِ يَتْلُونَ كِتَابَ اللهِ وَيَتَدَارَسُونَهُ بَيْنَهُمْ إِلَّا نَزَلَتْ عَلَيْهِمِ السَّكِينَةُ، وَغَشِيَتْهُمُ الرَّحْمَةُ، وَحَفَّتْهُمُ الْمَلَائِكَةُ، وَذَكَرَهُمُ اللهُ فِيمَنْ عِنْدَهُ، وَمَنْ بَطَّأَ بِهِ عَمَلُهُ لَمْ يُسْرِعْ بِهِ نَسَبُهُ».","a":"رواه مسلم","g":"صحيح","e":"بَيَّنَ النبيُّ صلى الله عليه وسلم أنَّ جَزاء المسلم عند الله مِن جِنْس ما يَعمله المسلم مع المسلمين؛ فمَن نفَّس وفرَّج وأزال وكَشَفَ عن مؤمنٍ كُربةً وشدة من كُرَب الدنيا، جازاه الله بأن ينفَّس عنه كربةً من كرب يوم القيامة. ومَن يَسَّر على معسرٍ وسهَّل عليه وأزال عسرته، يسَّر الله عليه في الدنيا والآخرة. ومَن ستر مسلمًا كأن اطّلع منه على ما لا ينبغي إظهاره من الزّلات والعَثَرات، ستره الله في الدنيا والآخرة. والله يكون مُعينًا لِعَبدِه، ما كان العبد سائرًا في إعانة أخيه في مصالحه الدينية والدنيوية، والإعانة تكون بالدعاء والبدن والمال وغير ذلك. ومن مشى إلى تحصيل علمٍ شرعيٍ، قاصدًا به وجه الله تعالى؛ سهَّل الله له به طريقًا إلى الجنة. وما اجتمع قومٌ في بيتٍ من بيوت الله، يتلون كتاب الله ويتدارسونه بينهم، إلا نزلت عليهم الطمأنينة والوقار، وغطتهم وعمَّتهم رحمة الله، وحفَّتْهم الملائكة، وأثنى الله عليهم في المقرَّبين عنده، وكفى شرفًا ذِكرُ اللهِ العبدَ في الملأ الأعلى. ومَن كان عمله ناقصًا، لم يُلْحِقْه بمرتبة أصحاب الأعمال، فينبغي ألا يَتَّكل على شرف النسب وفضيلة الآباء ويُقَصّر في العمل.","f":["قال ابن دقيق العيد: هذا حديث عظيم، جامع لأنواع من العلوم والقواعد والآداب، فيه فضل قضاء حوائج المسلمين ونفعهم بما يتيسر، مِن علم، أو مال، أو معاونة، أو إشارة بمصلحة، أو نصيحة، أو غير ذلك.","الترغيب في التيسير على المعسر.","الحث على عون العبد المسلم، وأن الله تعالى يُعين المعين حسب إعانته لأخيه.","مِن سِتْر المسلم: عدمُ تتبُّع عوراته، وقد رُوي عن بعض السلف أنه قال: أدركت قومًا لم يكن لهم عيوب، فذكروا عيوبَ الناس، فَذَكَر الناسُ لهم عيوبًا، وأدركت قومًا كانت لهم عيوب، فَكَفُّوا عن عيوب الناس، فنُسِيت عيوبُهم.","ليس من لوازم الستر على الناس ترك المنكر وعدم تغييره، بل يُغَيِّر ويَسْتُر، وهذا في حقِّ مَن لا يُعرَف بالفساد والتَّمَادِيْ في الطغيان، وأما من عُرِف بذلك فإنه لا يُستحب الستر عليه، بل يرفع أمره إلى مَن له الولاية، إذا لم يخَفْ مِن ذلك مفسدة؛ وذلك لأن الستر عليه يُغْرِيْهِ على الفساد، ويُجَرِّئهُ على أذية العباد، ويُجرّئ غيره من أهل الشر والعناد.","الحث على طلب العلم وتلاوة القرآن وتدارسه.","قال النووي: في هذا دليل لفضل الاجتماع على تلاوة القرآن في المسجد... ويلحق بالمسجد في تحصيل هذه الفضيلة الاجتماع في مدرسة ورباط ونحوهما إن شاء الله تعالى.","الجزاء إنما رتَّبَه الله على الأعمال لا على الأنساب."],"r":["صحيح مسلم (4/ 2074) (2699).","التحفة الربانية، لإسماعيل الأنصاري (ص82)."],"u":"https://hadeethenc.com/ar/browse/hadith/4801"}]}};</script>
<script>(() => {
  const APP_VERSION = { code: 8, name: "2.1" };
  const HOST = "https://azkar-hisn-almuslim.vercel.app";
  const UPDATE_URL = HOST + "/version.json";
  const CONTENT_URL = HOST + "/content.json";

  // The bundled adhkar ship inside the app; a newer set downloaded earlier wins.
  // ---------- language ----------
  const LANGS = window.I18N;
  let lang = (() => { try { return localStorage.getItem("lang") || "ar"; } catch { return "ar"; } })();
  if (!LANGS[lang]) lang = "ar";
  let T = LANGS[lang];
  function applyLang() {
    T = LANGS[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = T.dir;
    document.title = T.appName;
    document.querySelectorAll(".tabs a").forEach((el, i) => {
      const labels = [T.tabHome, T.tabQuran, T.tabAzkar, T.tabHadith, T.tabSettings];
      el.lastChild.textContent = labels[i];
    });
  }

  const bundled = window.AZKAR;
  // Downloaded content is only used when it is complete; otherwise the app falls back to what it shipped with.
  const usable = (c) => !!c && Array.isArray(c.cats) && c.cats.length > 100 && c.cats.every((x) => x.id && x.t && Array.isArray(x.z) && x.z.length)
    && Array.isArray(c.groups) && c.groups.length && c.home && Array.isArray(c.home.quick) && c.home.quick.length
    && Array.isArray(c.home.greetings) && c.home.greetings.length && typeof c.v === "number";
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("content") || "null"); } catch {}
  if (saved && !(saved.v > bundled.v && usable(saved))) { saved = null; try { localStorage.removeItem("content"); } catch {} }
  const DATA = saved || bundled;
  const { groups, cats, home: homeCfg } = DATA;
  const hadiths = DATA.hadiths || { topics: [], items: [] };
  const hadithById = Object.fromEntries(hadiths.items.map((h) => [h.id, h]));
  const byId = Object.fromEntries(cats.map((c) => [c.id, c]));
  const $ = (s) => document.querySelector(s);
  const view = $("#view");

  // ---------- storage ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const today = () => new Date().toLocaleDateString("en-CA");
  const settings = Object.assign({ theme: "auto", fs: 22, vibrate: true, autoNext: true }, store.get("settings", {}));
  const saveSettings = () => { store.set("settings", settings); applySettings(); };
  let favs = store.get("favs", []); // "catId:index"
  let progress = store.get("progress", {});
  if (progress.day !== today()) progress = { day: today(), c: {} };
  const saveProgress = () => store.set("progress", progress);

  function applySettings() {
    const dark = settings.theme === "dark" || (settings.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.style.setProperty("--fs", settings.fs + "px");
    document.querySelector('meta[name="theme-color"]').content = dark ? "#12332b" : "#0f5f4f";
  }
  applySettings();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applySettings);

  // ---------- helpers ----------
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const plain = (s) => s.replace(/[ً-ٰٟۖ-ۭـ]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
  const arNum = (n) => (T.digits === "arabic" ? String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]) : String(n));
  const buzz = (ms = 15) => settings.vibrate && navigator.vibrate && navigator.vibrate(ms);
  let toastT;
  const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800); };
  const catDone = (c) => { const p = progress.c[c.id] || {}; return c.z.every((z, i) => (p[i] || 0) >= z[1]); };
  const catLink = (c) => `<a href="#/c/${c.id}">${catDone(c) ? '<span class="ok">✔</span>' : ""}${esc(c.t)}<span class="n">${arNum(c.z.length)}</span></a>`;

  function setHeader(title, back) {
    $("#title").textContent = title;
    $("#back").hidden = !back;
    $("#progress").hidden = true;
    document.querySelectorAll(".tabs a").forEach((a) => a.classList.toggle("on", a.dataset.tab === currentTab));
    window.scrollTo(0, 0);
  }
  $("#back").onclick = () => (history.length > 1 ? history.back() : (location.hash = "#/"));
  $("#themeBtn").onclick = () => {
    settings.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    saveSettings();
  };

  // ---------- views ----------
  let currentTab = "home";

  function home() {
    currentTab = "home"; setHeader(T.appName);
    const h = new Date().getHours();
    const gi = Math.max(0, homeCfg.greetings.findIndex(([from, to]) => (from < to ? h >= from && h < to : h >= from || h < to)));
    const g = homeCfg.greetings[gi];
    const s = [g[2], g[3], g[4]];
    const c = byId[s[2]];
    view.innerHTML = `
      <section class="hero"><small>${(T.greet && T.greet[gi] && T.greet[gi][0]) || s[0]}</small><h2>${(T.greet && T.greet[gi] && T.greet[gi][1]) || s[1]}</h2>
        <a class="btn" href="#/c/${c.id}">${catDone(c) ? T.doneToday : T.startNow}</a></section>
      ${prayerStrip()}
      <input class="search" id="q" type="search" placeholder="${T.searchAll}">
      <div id="results"></div>
      <div id="homeBody">
        <div class="quick">
          ${homeCfg.quick.map(([icon, label, id]) => `<a href="#/c/${id}"><span>${icon}</span>${esc((T.quick && T.quick[id]) || label)}</a>`).join("")}

  // --- render a verse/dhikr as a shareable square image ---
  function drawCard(text, caption) {
    const S = 1080, c = document.createElement("canvas");
    c.width = c.height = S;
    const x = c.getContext("2d");
    const g = x.createLinearGradient(0, 0, S, S);
    g.addColorStop(0, "#0f5f4f"); g.addColorStop(1, "#17826b");
    x.fillStyle = g; x.fillRect(0, 0, S, S);
    x.strokeStyle = "rgba(201,162,77,.85)"; x.lineWidth = 4;
    x.strokeRect(46, 46, S - 92, S - 92);
    x.fillStyle = "#fff"; x.textAlign = "center"; x.direction = "rtl";

    // shrink until the text fits inside the frame
    let size = text.length < 80 ? 78 : text.length < 200 ? 62 : 52, lines = [];
    const wrap = (fs) => {
      x.font = `${fs}px "Noto Naskh Arabic", "Geeza Pro", serif`;
      const max = S - 200, out = [];
      let line = "";
      for (const w of text.split(/\s+/)) {
        const t = line ? line + " " + w : w;
        if (x.measureText(t).width > max && line) { out.push(line); line = w; } else line = t;
      }
      if (line) out.push(line);
      return out;
    };
    do { lines = wrap(size); size -= 3; } while (lines.length * (size * 1.9) > S - 320 && size > 20);

    const lh = size * 1.9, startY = S / 2 - ((lines.length - 1) * lh) / 2 - 20;
    lines.forEach((l, i) => x.fillText(l, S / 2, startY + i * lh));
    x.font = '30px "Noto Naskh Arabic", "Geeza Pro", serif';
    x.fillStyle = "rgba(255,255,255,.85)";
    x.fillText(caption, S / 2, S - 120);
    x.font = '24px system-ui, sans-serif';
    x.fillStyle = "rgba(255,255,255,.55)";
    x.fillText("azkar-hisn-almuslim.vercel.app", S / 2, S - 70);
    return c;
  }

  async function shareImage(text, caption) {
    try {
      const canvas = drawCard(text, caption);
      const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
      const file = new File([blob], "ayah.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: caption });
        return;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "azkar.png";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast(T.imageSaved);
    } catch { toast(T.imageFailed); }
  }

      <div class="list" id="qlist">${indexRows(mode)}</div>`;
    const box = $("#qs");
    if (box) box.oninput = () => {
      const v = plain(box.value.trim());
      $("#qlist").innerHTML = quran.surahs.filter((s) => !v || plain(s.t).includes(v) || String(s.n) === v || arNum(s.n) === v).map(surahRow).join("");

      const b = e.target.closest("[data-unmark]");
      if (!b) return;
      e.preventDefault();

  function indexRows(mode) {
    if (mode === "surah") return quran.surahs.map(surahRow).join("");
    if (mode === "marks") {
      if (!bookmarks.length) return `<p class="empty">${T.marksEmpty}</p>`;
      return bookmarks.map((g) => {
        const r = ayahRef(g);
        return `<a href="#/q/${r.s}/${r.a}"><span class="mini">${esc(quran.ayahs[g].slice(0, 60))}…</span>
          <span class="n">${esc(r.t)} ${arNum(r.a)}</span><button class="act" data-unmark="${g}" aria-label="حذف">✕</button></a>`;
      }).join("");
    }
    const list = mode === "juz" ? quran.juz : quran.hizb;
    return list.map((x) => {
      const r = ayahRef(x.s);
      return `<a href="#/q/${r.s}/${r.a}"><span class="sn">${arNum(x.n)}</span>${mode === "juz" ? T.juz : T.hizb} ${arNum(x.n)}<span class="n">${esc(r.t)} ${arNum(r.a)}</span></a>`;

  const surahRow = (s) => `<a href="#/q/${s.n}"><span class="sn">${arNum(s.n)}</span>${esc(s.t)}<span class="n">${s.p === "مكية" ? T.makki : T.madani}${T.dir === "rtl" ? "،" : ","} ${arNum(s.c)} ${s.c === 1 ? T.ayah1 : s.c === 2 ? T.ayah2 : T.ayahs}</span></a>`;

  // --- khatma: a daily page target, tracked by how far the reader has reached ---
  function khatmaCard() {
    const k = store.get("khatma", null);
    if (!k) return `<a class="list khatma-start" href="#/khatma"><div class="row">📖 ${T.khatmaStart}<span class="n">${T.khatmaHint}</span></div></a>`;
    const last = store.get("lastRead", null);
    const page = last ? pageOf(quran.surahs[last.s - 1].s + last.a - 1) : 1;
    const days = Math.max(1, Math.ceil((604 - page) / k.pages));
    const pct = Math.round((page / 604) * 100);
    return `<a class="list khatma-start" href="#/khatma"><div class="row"><div style="flex:1">
      <b>${T.khatmaPage(arNum(page))}</b>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <small>${T.khatmaDaily(arNum(k.pages), arNum(days))}</small>
    </div></div></a>`;
  }

  async function khatmaView() {
    currentTab = "quran"; setHeader(T.khatma, true);
    if (!(await loadQuran())) { view.innerHTML = `<p class="empty">${T.mushafFailed}</p>`; return; }
    const k = store.get("khatma", null);

  async function surah(n, goto) {
    n = Math.min(114, Math.max(1, +n || 1));
    currentTab = "quran";
    if (!(await loadQuran())) { view.innerHTML = `<p class="empty">${T.mushafFailed}</p>`; return; }
    const s = quran.surahs[n - 1];
    setHeader(s.t, true);
    const showAll = store.get("showTafsir", false); // tafsir under every ayah, or only on tap
    const tm = tafsirMeta();
    view.innerHTML = `
      <div class="surah-head"><h2>${esc(s.t)}</h2><small>${s.p === "مكية" ? T.makki : T.madani}${T.dir === "rtl" ? "،" : ","} ${arNum(s.c)} ${s.c === 1 ? T.ayah1 : s.c === 2 ? T.ayah2 : T.ayahs} · ${T.juz} ${arNum(juzOf(s.s))}</small>
        ${n !== 9 ? `<p class="basmala">${esc(quran.ayahs[0])}</p>` : ""}</div>
      <div class="tools">

      </div>

            <p class="aya">${esc(quran.ayahs[g])} <span class="mark">${arNum(i + 1)}</span></p>
            <div class="taf"><b>${esc(tafsirName())}</b>${esc(tafsirOf(g))}
              <div class="ayah-acts">
                <button class="act ${isMarked(g) ? "on" : ""}" data-mark="${g}" aria-label="حفظ">${isMarked(g) ? "★" : "☆"}</button>
                <button class="act" data-copyayah="${g}" aria-label="نسخ">⧉</button>

              </div></div></section>`;
        }).join("")}
      </div>
      <div class="navs">
        ${n > 1 ? `<a class="btn ghost" href="#/q/${n - 1}">← ${esc(quran.surahs[n - 2].t)}</a>` : "<span></span>"}

      </div>`;
    $("#tafBtn").onclick = () => {

      store.set("showTafsir", on);

    };
    $("#tafSwap").onclick = async () => {
      store.set("tafsirId", tafsirId() === 1 ? 2 : 1);
      toast(T.tafsirNow + tafsirName());
      await surah(n, goto);
    };
    view.onclick = (e) => {
      const markBtn = e.target.closest("[data-mark]");
      if (markBtn) { e.stopPropagation(); return toggleBookmark(+markBtn.dataset.mark, markBtn); }
      const copyBtn = e.target.closest("[data-copyayah]");
      if (copyBtn) { e.stopPropagation(); const g = +copyBtn.dataset.copyayah; const r = ayahRef(g); return copy(`${quran.ayahs[g]}\n[${r.t}: ${r.a}]`); }
      const imgBtn = e.target.closest("[data-img]");
      if (imgBtn) { e.stopPropagation(); const g = +imgBtn.dataset.img; const r = ayahRef(g); return shareImage(quran.ayahs[g], `${r.t} — الآية ${arNum(r.a)}`); }
      const sec = e.target.closest(".ayah");
      if (!sec) return;
      sec.classList.toggle("open");
      store.set("lastRead", { s: n, a: +sec.dataset.a });

    store.set("lastRead", { s: n, a: +goto || 1 });

  const juzOf = (g) => { let j = 1; quran.juz.forEach((x) => { if (x.s <= g) j = x.n; }); return j; };

  // ---------- prayer times (computed on the device, works offline) ----------
  const CITIES = [
    ["القاهرة", 30.0444, 31.2357], ["الإسكندرية", 31.2001, 29.9187], ["الجيزة", 30.0131, 31.2089],
    ["المنصورة", 31.0409, 31.3785], ["طنطا", 30.7865, 31.0004], ["أسيوط", 27.1783, 31.1859],

    ["الدوحة", 25.2854, 51.5310], ["الكويت", 29.3759, 47.9774], ["عمّان", 31.9454, 35.9284],

    ["برلين", 52.52, 13.405], ["نيويورك", 40.7128, -74.006], ["تورونتو", 43.6532, -79.3832],
  ];
  const METHODS = [
    ["Egyptian", "الهيئة المصرية العامة للمساحة"],
    ["UmmAlQura", "أم القرى (السعودية)"],
    ["MuslimWorldLeague", "رابطة العالم الإسلامي"],
    ["Dubai", "دبي"], ["Kuwait", "الكويت"], ["Qatar", "قطر"],
    ["NorthAmerica", "أمريكا الشمالية (ISNA)"], ["Karachi", "كراتشي"],
    ["Turkey", "تركيا"], ["Tehran", "طهران"],
  ];
  const PRAYER_KEYS = ["fajr", "sunrise", "dhuhr", "asr", "maghrib", "isha"];
  const prayerName = (k) => T.prayers[PRAYER_KEYS.indexOf(k)];

  const place = () => store.get("place", null); // {t, lat, lng}
  const method = () => { const m = store.get("prayerMethod", "Egyptian"); return window.adhan?.CalculationMethod?.[m] ? m : "Egyptian"; };
  const fmtTime = (d) => d.toLocaleTimeString(T.locale, { hour: "2-digit", minute: "2-digit", hour12: true });

  function prayerTimesFor(date) {
    const p = place();
    if (!p || !window.adhan) return null;
    const params = (window.adhan.CalculationMethod[method()] || window.adhan.CalculationMethod.Egyptian)();
    return new window.adhan.PrayerTimes(new window.adhan.Coordinates(p.lat, p.lng), date, params);
  }

  function nextPrayer() {
    const t = prayerTimesFor(new Date());
    if (!t) return null;
    const now = new Date();
    for (const k of PRAYER_KEYS) {
      if (k === "sunrise") continue;
      if (t[k] > now) return { k, name: prayerName(k), at: t[k] };
    }
    const tomorrow = prayerTimesFor(new Date(Date.now() + 864e5));
    return tomorrow ? { k: "fajr", name: prayerName("fajr"), at: tomorrow.fajr } : null;
  }

  let prayerTimer = null;
  function prayerView() {
    currentTab = "prayer"; setHeader(T.prayerTimes, true);
    clearInterval(prayerTimer);
    const p = place();
    if (!p) return prayerSetup();
    const t = prayerTimesFor(new Date());
    if (!t) { view.innerHTML = `<p class="empty">${T.calcFailed}</p>`; return; }
    const nx = nextPrayer();
    view.innerHTML = `
      <section class="hero"><small>${esc(placeName())}</small><h2 id="nextP">${nx ? nx.name + " " + T.after + " " + remain(nx.at) : ""}</h2>
        <small id="nextT">${nx ? fmtTime(nx.at) : ""}</small></section>
      <div class="list">${PRAYER_KEYS.map((k) => `<div class="row ${nx && nx.k === k ? "now" : ""}">
        <span>${prayerName(k)}</span><b>${fmtTime(t[k])}</b></div>`).join("")}</div>
      <div class="tools" style="margin-top:14px">
        <a class="btn ghost" href="#/prayer/setup">${T.changeCity}</a>
        <button class="btn ghost" id="notifP">${T.alertBefore}</button>
      </div>
      <p class="note">${esc(T.calcNote(methodName()))}</p>`;
    prayerTimer = setInterval(() => {
      const n = nextPrayer();
      const el = $("#nextP");
      if (n && el) el.textContent = n.name + " " + T.after + " " + remain(n.at);
    }, 30000);
    $("#notifP").onclick = () => (location.hash = "#/reminders");
  }
  const remain = (d) => {
    const m = Math.max(0, Math.round((d - Date.now()) / 60000));
    return m >= 60 ? `${arNum(Math.floor(m / 60))} ${T.hoursShort} ${arNum(m % 60)} ${T.minsShort}` : `${arNum(m)} ${T.minutes}`;
  };

  function prayerSetup() {
    currentTab = "prayer"; setHeader(T.prayerTimes, true);
    view.innerHTML = `
      <p class="note">${T.pickCity}</p>
      <div class="tools"><button class="btn" id="geo">${T.locateMe}</button></div>
      <h3 class="sec">${T.orPickCity}</h3>
      <div class="list">${CITIES.map(([t, lat, lng], i) => `<a href="#" data-city="${i}">${cityName(i)}${place()?.t === t ? '<span class="ok">✔</span>' : ""}</a>`).join("")}</div>
      <h3 class="sec">${T.calcMethod}</h3>
      <div class="list">${METHODS.map(([k, t], i) => `<a href="#" data-method="${k}">${T.methods[i]}${method() === k ? '<span class="ok">✔</span>' : ""}</a>`).join("")}</div>`;
    $("#geo").onclick = async () => {
      toast(T.locating);
      try {
        // the installed app asks through the Capacitor plugin; the browser uses its own API
        const Geo = window.Capacitor?.Plugins?.Geolocation;
        let pos;
        if (Geo) {
          const perm = await Geo.requestPermissions({ permissions: ["location"] });
          if (perm.location === "denied") { toast(T.locationDenied); return; }
          pos = await Geo.getCurrentPosition({ timeout: 15000, enableHighAccuracy: false });
        } else {
          pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 15000, enableHighAccuracy: false }));
        }
        store.set("place", { t: "@me", lat: pos.coords.latitude, lng: pos.coords.longitude });
        scheduleAll(); location.hash = "#/prayer";
      } catch { toast(T.locateFailed); }
    };
    view.onclick = (e) => {
      const c = e.target.closest("[data-city]"), m = e.target.closest("[data-method]");
      if (c) {
        e.preventDefault();
        const [, lat, lng] = CITIES[+c.dataset.city];
        store.set("place", { t: "@" + c.dataset.city, lat, lng });
        scheduleAll(); location.hash = "#/prayer";
      } else if (m) {
        e.preventDefault();
        store.set("prayerMethod", m.dataset.method);
        scheduleAll(); prayerSetup();
      }
    };
  }

  // ---------- reminders (local notifications on the installed app) ----------
  const LN = () => window.Capacitor?.Plugins?.LocalNotifications;
  const defaultReminders = () => ({
    morning: { on: false, h: 6, m: 30, key: "morningAzkar", link: "#/c/133" },
    evening: { on: false, h: 17, m: 30, key: "eveningAzkar", link: "#/c/134" },
    sleep: { on: false, h: 22, m: 30, key: "sleepAzkar", link: "#/c/2" },
    prayer: { on: false, before: 10 },
  });
  const reminders = () => Object.assign(defaultReminders(), store.get("reminders", {}));

  async function scheduleAll() {
    const ln = LN();
    if (!ln) return false;
    try {
      const r = reminders();
      const pending = await ln.getPending();
      if (pending.notifications?.length) await ln.cancel({ notifications: pending.notifications });
      const list = [];
      let id = 1;
      [["morning", "🌅"], ["evening", "🌇"], ["sleep", "🌙"]].forEach(([k, icon]) => {
        if (!r[k].on) return;
        list.push({
          id: id++, title: `${icon} ${T[r[k].key]}`, body: T.notifBody,
          schedule: { on: { hour: r[k].h, minute: r[k].m }, allowWhileIdle: true },
          extra: { link: r[k].link },
        });
      });
      if (r.prayer.on && place()) {
        // the next three days of prayers; rescheduled whenever the app opens
        for (let d = 0; d < 3; d++) {
          const t = prayerTimesFor(new Date(Date.now() + d * 864e5));
          if (!t) break;
          PRAYER_KEYS.forEach((k) => {
            if (k === "sunrise") return;
            const at = new Date(t[k].getTime() - r.prayer.before * 60000);
            if (at <= new Date()) return;
            list.push({ id: id++, title: `🕌 ${prayerName(k)}`, body: T.notifPrayerBody(prayerName(k), r.prayer.before), schedule: { at, allowWhileIdle: true } });
          });
        }
      }
      if (list.length) await ln.schedule({ notifications: list });
      return true;
    } catch { return false; }
  }

  async function remindersView() {
    currentTab = "settings"; setHeader(T.remindersTitle, true);
    const ln = LN();
    const r = reminders();
    const row = (k, label) => `<div class="row"><span>${label}<small class="sub">${arNum(String(r[k].h).padStart(2, "0"))}:${arNum(String(r[k].m).padStart(2, "0"))}</small></span>

    view.innerHTML = `
      ${ln ? "" : `<p class="note">${T.remindersWeb}</p>`}

        ${row("evening", T.eveningAzkar)}
        ${row("sleep", T.sleepAzkar)}

          <span style="display:flex;gap:8px;align-items:center">
            <div class="seg">${[5, 10, 15, 30].map((v) => `<button data-before="${v}" class="${r.prayer.before === v ? "on" : ""}">${arNum(v)}${T.minsShort}</button>`).join("")}</div>
            <button class="sw ${r.prayer.on ? "on" : ""}" data-toggle="prayer"></button></span></div>
        ${place() ? "" : `<div class="row"><a class="btn ghost" href="#/prayer/setup">${T.setCity}</a></div>`}
      </div>`;
    view.onclick = async (e) => {
      const tg = e.target.closest("[data-toggle]"), bf = e.target.closest("[data-before]");
      if (tg) {
        const k = tg.dataset.toggle, next = { ...r, [k]: { ...r[k], on: !r[k].on } };
        if (next[k].on && ln) {
          const perm = await ln.requestPermissions();
          if (perm.display !== "granted") { toast(T.notifDenied); return; }
        }
        store.set("reminders", next);
        buzz(); await scheduleAll(); remindersView();
      } else if (bf) {
        store.set("reminders", { ...r, prayer: { ...r.prayer, before: +bf.dataset.before } });
        await scheduleAll(); remindersView();
      }
    };
    view.querySelectorAll("[data-time]").forEach((inp) => (inp.onchange = async () => {
      const [h, m] = inp.value.split(":").map(Number);
      store.set("reminders", { ...r, [inp.dataset.time]: { ...r[inp.dataset.time], h, m } });
      await scheduleAll(); remindersView();
    }));
  }

  }

  function about() {
    currentTab = "settings"; setHeader(T.aboutDev, true);
    view.innerHTML = `
      <section class="dev">
        <div class="avatar">MH</div>
        <h2>${T.devName}</h2>
        <p>Mahmoud Hawary</p>
        <small>${T.devRole}</small>
      </section>
      <div class="nonprofit"><b>${T.nonProfitTitle}</b>
        هذا التطبيق مجاني بالكامل وغير ربحي، بلا إعلانات ولا اشتراكات ولا جمع لأي بيانات، وصدقة جارية لوجه الله تعالى.
        نسألكم الدعاء لنا ولوالدينا.</div>
      <h3 class="sec">${T.contactMe}</h3>
      <div class="list">${SOCIAL.map(([i, n, h, u]) => `<a href="${u}" target="_blank" rel="noopener"><span class="si">${i}</span><span>${T[n] || n}<small class="sub">${h}</small></span><span class="n">↖</span></a>`).join("")}</div>
      <p class="empty" style="padding:24px 0">${T.version(arNum(APP_VERSION.name).replace(".", T.digits === "arabic" ? "٫" : "."))}</p>`;
  }

  // ---------- language helpers ----------
  const cityName = (i) => T.cities[i] || CITIES[i][0];
  const methodName = () => { const i = METHODS.findIndex((m) => m[0] === method()); return i > -1 ? T.methods[i] : ""; };
  const placeName = () => {
    const p = place();
    if (!p) return "";
    if (p.t === "@me") return T.myLocation;
    if (String(p.t).startsWith("@")) return cityName(+p.t.slice(1));
    const i = CITIES.findIndex((c) => c[0] === p.t);
    return i > -1 ? cityName(i) : p.t;
  };
  const tafsirName = () => T.tafsirNames[tafsirId() - 1] || tafsirMeta().t;
  const langSeg = () => `<div class="seg">${Object.keys(LANGS).map((k) => `<button data-lang="${k}" class="${k === lang ? "on" : ""}">${LANGS[k].name}</button>`).join("")}</div>`;

  // ---------- router ----------
  function route() {
    const [, a, b, c] = location.hash.split("/");
    view.onclick = null;
    clearInterval(prayerTimer);
    if (a === "c") category(+b, c);
    else if (a === "g") group(b);
    else if (a === "all") allCats();
    else if (a === "fav") favorites();
    else if (a === "tasbih") tasbih();
    else if (a === "settings") settingsView();
    else if (a === "about") about();
    else if (a === "q") (b === "m" ? quranIndex(c) : b ? surah(b, c) : quranIndex());
    else if (a === "khatma") khatmaView();
    else if (a === "prayer") (b === "setup" ? prayerSetup() : prayerView());
    else if (a === "reminders") remindersView();
    else if (a === "h") (b ? hadithList(b) : hadithTopics());
    else if (a === "hd") hadith(b);
    else home();
  }
  applyLang();
  addEventListener("hashchange", route);
  route();

  // ---------- update check (installed app / offline file only; the website is always current) ----------
  const isInstalled = !!window.Capacitor?.isNativePlatform?.() || location.protocol === "file:";
  async function checkUpdate() {
    if (!isInstalled || !navigator.onLine) return;
    try {
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), 8000);
      const v = await (await fetch(UPDATE_URL + "?t=" + Date.now(), { cache: "no-store", signal: ctrl.signal })).json();
      if (!(v.code > APP_VERSION.code) || sessionStorage.getItem("skipUpdate") === String(v.code)) return;
      const bar = document.createElement("div");
      bar.className = "update";
      bar.innerHTML = `<div><b>${esc(T.updateTitle(arNum(v.name)))}</b>${v.notes ? `<small>${esc(v.notes)}</small>` : ""}</div>
        <a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener">${T.download}</a><button class="x" aria-label="${T.later}">✕</button>`;
      bar.querySelector(".x").onclick = () => { try { sessionStorage.setItem("skipUpdate", String(v.code)); } catch {} bar.remove(); };
      document.body.appendChild(bar);
    } catch {}
  }
  checkUpdate();

  // ---------- adhkar refresh: new/edited adhkar arrive on their own, no reinstall ----------
  async function refreshContent() {
    if (!navigator.onLine) return;
    try {
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), 10000);
      const c = await (await fetch(CONTENT_URL + "?t=" + Date.now(), { cache: "no-store", signal: ctrl.signal })).json();
      if (!usable(c) || !(c.v > DATA.v)) return; // ignore anything older or malformed
      localStorage.setItem("content", JSON.stringify(c));
      toast(T.contentUpdated);
    } catch {}
  }
  setTimeout(refreshContent, 1500);

  // Re-arm reminders on every launch (prayer alerts are only scheduled a few days ahead).
  const ln0 = LN();
  if (ln0) {
    scheduleAll();
    ln0.addListener("localNotificationActionPerformed", (e) => {
      const link = e?.notification?.extra?.link;
      if (link) location.hash = link;
    });
    document.addEventListener("resume", scheduleAll);
  }

  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
