"t267","t":"الآداب الشرعية","i":"🌸","ids":[3706,5326,5365,5733,5798,58120,58122,2985,2986,3014,3021,3033,3079,3285]},{"k":"t269","t":"الرقائق والمواعظ","i":"🌿","ids":[66515,66524,66526,66537,2941,3044,3331,3342,3417,3418,3475,3581,3702,4304]},{"k":"t277","t":"فضائل الأعمال الصالحة","i":"⭐","ids":[3591,5372,3162,3267,3360,3365,3446,3574,8876,10416,65838,2967]},{"k":"t457","t":"فضل الصلاة","i":"🕌","ids":[3366,3591,5435,65003,65004,3365,3512,3569,3732,4198,4968,6215]},{"k":"t513","t":"فضل الصيام","i":"🌙","ids":[4196,3546,5863,3738,65491,65524,10107]},{"k":"t311","t":"آداب الدعاء","i":"🤲","ids":[3232,65326,65488,5978]},{"k":"t321","t":"التوبة والاستغفار","i":"🤍","ids":[4318,4797,3656,3658,65114,65214,65316,4310,4820,66210]},{"k":"t273","t":"بر الوالدين وصلة الرحم","i":"👪","ids":[3260,3718,65221,65612,3436,3493,3775,10417,3792]},{"k":"t270","t":"فضل العلم","i":"📖","ids":[5518,3007,65021,65059,65566,4233,4801]}],"items":[{"id":66520,"t":"لا يؤمن أحدكم، حتى يحب لأخيه ما يحب لنفسه","h":"عَنْ أَبِي حَمْزَةَ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ -خَادِمِ رَسُولِ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ- عَنْ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: «لاَ يُؤْمِنُ أَحَدُكُمْ، حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ»","a":"متفق عليه","g":"صحيح","e":"بَيَّنَ النبيُّ صلى الله عليه وسلم أنّه لا يَتَحقّق الإيمانُ الكامل لأحدٍ من المسلمين حتى يُحبَّ لأخيه ما يحب لنفسه من الطاعات وأنواع الخيرات في الدين والدنيا، ويكره له ما يكره لنفسه، فإن رأى في أخيه المسلم نقصًا في دينه، اجتهد في إصلاحه، وإنْ رأى فيه خيرًا سدَّده وأعانه، ونصحَه في أمر دينِه أو دنياه.","f":["وجوب محبة المرء لأخيه ما يحبُّ لنفسه؛ لأن نفي الإيمان عمن لا يحب لأخيه ما يحب لنفسه يدل على وجوب ذلك.","الأُخوّة في الله فوق أخوّة النسب، فحقُّها أوجب.","تحريم كل ما ينافي هذه المحبة من الأقوال والأفعال كالغش والغيبة والحسد والعدوان على نفس المسلم أو ماله أو عرضه.","استخدام بعض الألفاظ المحفِّزة على الفعل؛ لقوله \"لأخيه\".","قال الكِرْماني رحمه الله: ومن الإيمان أيضًا أنْ يُبغِضَ لأخيه ما يبغض لنفسه من الشر، ولم يذكره؛ لأنَّ حب الشيء مستلزم لبغض نقيضه، فترك التنصيص عليه اكتفاء."],"r":["صحيح البخاري (1/ 12) (13).","صحيح مسلم (1/ 67) (45)."],"u":"https://hadeethenc.com/ar/browse/hadith/66520"},{"id":66521,"t":"إن الله كتب الإحسان على كل شيء","h":"عَنْ أَبِي يَعْلَى شَدَّادِ بْنِ أَوْسٍ رَضِيَ اللَّهُ عَنْهُ عَنْ رَسُولِ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: «إِنَّ اللهَ كَتَبَ الْإِحْسَانَ عَلَى كُلِّ شَيْءٍ، فَإِذَا قَتَلْتُمْ فَأَحْسِنُوا القِتْلَةَ، وَإِذَا ذَبَحْتُمْ فَأَحْسِنُوا الذِّبْحَةَ، وَلْيُحِدَّ أَحَدُكُمْ شَفْرَتَهُ، وَلْيُرِحْ ذَبِيحَتَهُ».","a":"رواه مسلم","g":"صحيح","e":"يُخبرُ النبيُّ صلى الله عليه وسلم أن الله تعالى أوجبَ علينا الإحسانَ في كل الأشياء، والإحسان: هو مراقبة الله على الدوام، في عبادته وفي بذل الخير وكف الأذى عن المخلوقين، ومن ذلك الإحسان في القتل والذبح. فالإحسان في القتل عند القصاص: بأن يختار أسهلَ الطُّرُق وأخَفَّها وأسرعَها زهوقًا للمقتول. والإحسان في الذبح عند الذكاة: بأن يرفق بالبهيمة بإحداد الآلة، وألّا تُحَدَّ أمام الذبيحة وهي تنظر إليها، وألَّا تُذبح وهناك من الماشية ما ينظر إليها.","f":["رحمة الله عزّ وجل ولطفه بالخلق.","إحسان القتل والذبح بأن يكون على الوجه المشروع.","كمال الشريعة واشتمالها على كل خير، ومن ذلك رحمة الحيوان والرفق به.","النهي عن المُثْلة بالإنسان بعد قتله.","تحريم كل ما فيه تعذيب للحيوان."],"r":["صحيح مسلم (3/ 1548) (1955).","التحفة الربانية في شرح الأربعين حديثا النووية (ص38)."],"u":"https://hadeethenc.com/ar/browse/hadith/66521"},{"id":66523,"t":"إن مما أدرك الناس من كلام النبوة الأولى: إذا لم تستحي فاصنع ما شئت","h":"عَنْ أَبِي مَسْعُودٍ عُقْبَةَ بْنِ عَمْرٍو الأَنْصَارِيِّ البَدْرِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ: «إِنَّ مِمَّا أَدْرَكَ النَّاسُ مِنْ كَلاَمِ النُّبُوَّةِ الأُولَى: إِذَا لَمْ تَسْتَحْيِ فَاصْنَعْ مَا شِئْتَ».","a":"رواه البخاري","g":"صحيح","e":"أَخْبَرَ النبيُّ صلى الله عليه وسلم أنَّ مما جاء فيه الوصية عن الأنبياء المتقدِّمين، وتَدَاوَلَه الناس بينهم وتوارثوه عنهم قرنًا بعد قرن، حتى وصل إلى أوّل هذه الأمة، انظر إلى ما تريد أنْ تَفعلَه، فإنْ كان ممّا لا يُستَحى منه فافعله، وإنْ كان ممّا يُستَحى منه فَدَعْه؛ فإنَّ المانع مِن فِعْل القبائح هو الحياء، فمَن لم يكن له حياءٌ، انْهَمَك في كلّ فَحْشاء ومُنكر.","f":["الحياء أصل الأخلاق الكريمة.","الحياء صفة من صفات الأنبياء عليهم السلام، وهو من المأثور عنهم.","الحياء هو الذي يجعل المرء المسلم يفعل ما يُجَمِّلُ ويَزِيْن، ويَترك ما يُدّنِّس ويَشَيْن.","قال النووي: الأمر فيه للإباحة، أي: إذا أردت فعل شيء فإن كان مما لا تستحي إذا فعلتَه من الله ولا من الناس فافعله، وإلا فلا، وعلى هذا مدار الإسلام، وتوجيه ذلك أنَّ المأمورَ به الواجب والمندوب يُستحيَى مِن تَرْكِه، والمنهي عنه الحرام والمكروه يُستحيى من فعله، وأما المباح فالحياء من فعله جائز، وكذا مِن تركه، فتضمن الحديث الأحكام الخمسة، وقيل: هو أمرُ تهديد، ومعناه: إذا نُزِع مِنك الحياء فافعل ما شئت؛ فإنّ الله مجازيك عليه، وقيل: هو أمرٌ بمعنى الخبر، أي: مَن لا يَستحيي يَصنع ما أراد."],"r":["صحيح البخاري (8/ 29) (6120).","نزهة المتقين شرح رياض الصالحين، لمجموعة من الباحثين (2/ 1252)."],"u":"https://hadeethenc.com/ar/browse/hadith/66523"},{"id":3716,"t":"رحم الله رجلا سمحا إذا باع، وإذا اشترى، وإذا اقتضى","h":"عن جابر رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: «رَحِمَ اللهُ رَجُلًا سَمْحًا إِذَا بَاعَ، وَإِذَا اشْتَرَى، وَإِذَا اقْتَضَى».","a":"رواه البخاري","g":"صحيح","e":"دعا النبي صلى الله عليه وسلم بالرحمة لكل من كان: سهلًا جَوَادًا سَخِيًّا في بيعِه، فلا يُشدِّد على المشتري في سعرها ويعامله بخُلُقٍ حَسَن. سهلًا جوادًا سَخِيًّا إذا اشترى، فلا يَبْخَس ويُقَلِّل من قيمة البِضَاعَة. سهلًا جوادًا سخيًا إذا طَالَبَ بقضاءِ الدُّيون التي له، فلا يُشدِّد على الفقير والمُحتاج، بل يُطالِبه برفق ولُطف، ويُنْظِر المُعسر.","f":["مِن مَقاصد الشريعة الحِفاظ على ما يُصلِحُ العلاقاتِ بين الناس.","الترغيب في استعمال معالي الأخلاق في المعاملات بين الناس من البيع والشراء ونحو ذلك."],"r":["صحيح البخاري (3/ 57) (2076).","نزهة المتقين (2/ 944)."],"u":"https://hadeethenc.com/ar/browse/hadith/3716"},{"id":3753,"t":"كان رجل يداين الناس، فكان يقول لفتاه: إذا أتيت معسرا فتجاوز عنه، لعل الله يتجاوز عنا","h":"عن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: «كان رجلٌ يُدَايِنُ الناسَ، فكان يقول لفتاه: إذا أتيتَ مُعسِرًا فتجاوز عنه، لعل اللهَ يَتجاوزُ عنا، فلقي اللهَ فتجاوز عنه».","a":"متفق عليه","g":"صحيح","e":"يُخبِرُ النبيُّ صلى الله عليه وسلم عن رجُلٍ كان يتعامل مع الناس بالقَرْض، أو يَبِيعُهم بالآجِل، وكان يقول لغلامه الذي يَتَقاضى الدُّيون التي عند الناس: إذا أتيتَ مَدِيْنًا ولم يكن عنده ما يقضي به الدَّين الذي عليه لعجزه \"فَتَجَاوَزْ عنه\"؛ إما بإمهالِه وعدم الإلحاح في المطالبة، أو بقبول ما عنده ولو مع ما فيه مِن نَقْص، وذلك رَغْبةٌ منه وطَمَعٌ في أنْ يتجاوزَ اللهُ عنه ويعفوَ عنه. فلما ماتَ عفا اللهُ عنه وتجاوزَ عن سيئاتِه.","f":["الإحسان في معاملة الناس والعفو عنهم والتجاوز عن معسرهم من أعظم أسباب نجاة العبد يوم القيامة.","الإحسان إلى الخلق والإخلاص لله والرجاء في رحمته من أسباب مغفرة الذنوب."],"r":["صحيح البخاري (4/ 176) (3480).","صحيح مسلم (3/ 1196) (1562)."],"u":"https://hadeethenc.com/ar/browse/hadith/3753"},{"id":4319,"t":"إن الله كتب الإحسان على كل شيء","h":"عن شداد بن أوس رضي الله عنه قال: ثِنْتَانِ حَفِظْتُهُمَا عَنْ رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: «إِنَّ اللهَ كَتَبَ الْإِحْسَانَ عَلَى كُلِّ شَيْءٍ، فَإِذَا قَتَلْتُمْ فَأَحْسِنُوا الْقِتْلَةَ، وَإِذَا ذَبَحْتُمْ فَأَحْسِنُوا الذَّبْحَ، وَلْيُحِدَّ أَحَدُكُمْ شَفْرَتَهُ، فَلْيُرِحْ ذَبِيحَتَهُ».","a":"رواه مسلم","g":"صحيح","e":"يُخبرُ النبيُّ صلى الله عليه وسلم أن الله تعالى أوجبَ علينا الإحسانَ في كل الأشياء، والإحسان: هو مراقبة الله على الدوام، في عبادته وفي بذل الخير وكف الأذى عن المخلوقين، ومن ذلك الإحسان في القتل والذبح. فالإحسان في القتل عند القصاص: بأن يختار أسهلَ الطُّرُق وأخَفَّها وأسرعَها زهوقًا للمقتول. والإحسان في الذبح عند الذكاة: بأن يرفق بالبهيمة بإحداد الآلة، وألّا تُحَدَّ أمام الذبيحة وهي تنظر إليها، وألَّا تُذبح وهناك من الماشية ما ينظر إليها.","f":["رحمة الله عزّ وجل ولطفه بالخلق.","إحسان القتل والذبح بأن يكون على الوجه المشروع.","كمال الشريعة واشتمالها على كل خير، ومن ذلك رحمة الحيوان والرفق به.","النهي عن المُثْلة بالإنسان بعد قتله.","تحريم كل ما فيه تعذيب للحيوان."],"r":["صحيح مسلم (3/ 1548) (1955).","التحفة الربانية في شرح الأربعين حديثا النووية (ص38)."],"u":"https://hadeethenc.com/ar/browse/hadith/4319"},{"id":4709,"t":"لا تغضب","h":"عن أبي هريرة رضي الله عنه: أَنَّ رَجُلًا قَالَ لِلنَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: أَوْصِنِي، قَالَ: «لَا تَغْضَبْ» فَرَدَّدَ مِرَارًا قَالَ: «لَا تَغْضَبْ».","a":"رواه البخاري","g":"صحيح","e":"طَلبَ أحدُ الصحابة رضوان الله عليهم من النبي صلى الله عليه وسلم أن يَدُلَّه على شيء ينفعه، فأمره ألّا يغضب، ومعنى ذلك أن يَجتنبَ الأسبابَ التي تحمله على الغضب، وأن يَضبطَ نفسَه إذا حَصَل له الغضب، فلا يَتَمادى مع غضبه بالقتل أوالضرب أوالسب ونحو ذلك. وردَّدَ الرجلُ طَلَبَ الوصيةِ مَرَّات، فلم يَزِدْه صلى الله عليه وسلم في الوصية على \"لا تغضب\".","f":["التحذير من الغضب وأسبابه، فإنه جِماعُ الشر، والتحرُّزُ منه جماعُ الخير.","الغضب لله كالغضب عند انتهاك محارم الله من الغضب المحمود.","تَكرار الكلام عند الحاجة حتى يَعِيَه السامعُ ويُدرك أهميتَه.","فضيلة طلب الوصية من العالِم."],"r":["صحيح البخاري (8/ 28) (6116).","التحفة الربانية في شرح الأربعين حديثًا النووية (ص36)."],"u":"https://hadeethenc.com/ar/browse/hadith/4709"},{"id":4935,"t":"إن المقسطين عند الله على منابر من نور، عن يمين الرحمن عز وجل، وكلتا يديه يمين","h":"عن عبد الله بن عمرو رضي الله عنهما قال: قال رسول الله صلى الله عليه وسلم: «إِنَّ الْمُقْسِطِينَ عِنْدَ اللهِ عَلَى مَنَابِرَ مِنْ نُورٍ، عَنْ يَمِينِ الرَّحْمَنِ عَزَّ وَجَلَّ، وَكِلْتَا يَدَيْهِ يَمِينٌ، الَّذِينَ يَعْدِلُونَ فِي حُكْمِهِمْ وَأَهْلِيهِمْ وَمَا وَلُوا».","a":"رواه مسلم","g":"صحيح","e":"يُخبِرُ النبيُّ صلى الله عليه وسلم أنّ الذين يَحكُمُون بالعدل والحق بين الناس الذين تحت إِمْرَتِهم وحكمِهم وأهلهم، أنهم يجلسون على مقاعدَ عاليةٍ رفيعةٍ قد خُلقتْ من نور، إكرامًا لهم يوم القيامة. وهذه المنابر عن يمين الرحمن تعالى، وكلتا يديه سبحانه يمينٌ.","f":["فضل العدل والحث عليه.","العدل عامٌّ يشمل جميع الولايات والحكم بين الناس حتى العدل بين الزوجات والأولاد وغير ذلك.","بيان منزلة العادلين يوم القيامة.","تفاوت منازل أهل الإيمان يوم القيامة كل حسب عمله.","أسلوب الترغيب من أساليب الدعوة التي ترغِّب المدعو في الطاعة."],"r":["صحيح مسلم (3/ 1458) (1827).","نزهة المتقين شرح رياض الصالحين، لمجموعة من الباحثين (1/ 547)."],"u":"https://hadeethenc.com/ar/browse/hadith/4935"},{"id":4939,"t":"من يحرم الرفق يحرم الخير","h":"عَنْ جَرِيرٍ رضي الله عنه عَنِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: «مَنْ يُحْرَمِ الرِّفْقَ يُحْرَمِ الْخَيْرَ».","a":"رواه مسلم","g":"صحيح","e":"يُخْبِرُ النبيُّ صلى الله عليه وسلم أنّ مَن يُحرَم الرفق فلم يوفق له في أمور الدين والدنيا وفيما يتصرَّف فيه لنفسه، وفيما يتصرَّف فيه مع غيره، فقد مُنِعَ الخيرَ كله.","f":["فضل الرِّفق والحث على التخلُّق به، وذم العنف.","الرفق به انتظام خير الدارين واتساع أمرهما، وفي العنف ضد ذلك.","الرفق ناتج عن حسن الخلق والسلامة، والعنف ناتج عن الغضب والفَظَاظة، ولذا أثنى صلى الله عليه وسلم على الرفق وبالغ فيه.","قال سفيان الثوري رحمه الله لأصحابه: أتدرون ما الرفق؟ هو أن تضع الأمور مواضعها، الشدة في موضعها، واللين في موضعه، والسيف في موضعه، والسوط في موضعه."],"r":["صحيح مسلم (4/ 2003) (2592).","نزهة المتقين شرح رياض الصالحين، لمجموعة من الباحثين (1/ 532)."],"u":"https://hadeethenc.com/ar/browse/hadith/4939"},{"id":5348,"t":"لا تحقرن من المعروف شيئا، ولو أن تلقى أخاك بوجه طلق","h":"عن أبي ذر رضي الله عنه قال: قال لي النبي صلى الله عليه وسلم: «لَا تَحْقِرَنَّ مِنَ الْمَعْرُوفِ شَيْئًا، وَلَوْ أَنْ تَلْقَى أَخَاكَ بِوَجْهٍ طَلْقٍ».","a":"رواه مسلم","g":"صحيح","e":"حَثَّ النبيُّ صلى الله عليه وسلم على فعل المعروف، وأن لا يحتقره ولو كان قليلًا، ومن ذلك طلاقة الوجه بالابتسامة عند اللقاء، فينبغي للمسلم أن يحرص عليه؛ لما فيه من إِيْنَاس الأخ المسلم وإدخال السرور عليه.","f":["فضل التَّحابِّ بين المؤمنين، والابتسامة والبِشْر عند اللقاء.","كمال هذه الشريعة وشمولها، وأنها جاءت بكل ما فيه صلاح المسلمين وتوحيد كلمتهم.","الحث على فعل المعروف وإن قَلَّ.","استحباب إدخال السرور على المسلمين؛ لما في ذلك من تحقيق الأُلْفَة بينهم."],"r":["صحيح مسلم (4/ 2026) (2626).","منحة العلام في شرح بلوغ المرام، لعبد الله الفوزان (10/ 119)."],"u":"https://hadeethenc.com/ar/browse/hadith/5348"},{"id":5351,"t":"ليس الشديد بالصرعة، إنما الشديد الذي يملك نفسه عند الغضب","h":"عن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: «لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ».","a":"متفق عليه","g":"صحيح","e":"يُبَيِّنُ النبيُّ صلى الله عليه وسلم أنَّ القوةَ الحقيقيةَ ليست قوةَ الجَسَد، أو الذي يَصْرَعُ غيرَه من الأقوياء، وإنما القويُّ الشديدُ هو الذي جاهَدَ نفسَه وقَهَرَها حينما يَشتدُّ به الغضبُ؛ لأنَّ هذا يدل على قوّة تَمَكُّنِهِ من نفسه وتَغَلُّبِه على الشيطان.","f":["فضيلة الحِلْم وضَبْط النفس عند الغضب، وأنه من الأعمال الصالحة التي حَثَّ عليها الإسلام.","مجاهدة النفس عند الغضب أشدُّ من مجاهدة العدو.","تغيير الإسلام لمفهوم القوة الجاهلي إلى أخلاق كريمة، فأشد الناس قوّة هو مَن مَلَكَ زِمَام نفسِه.","الابتعاد عن الغضب؛ لما يسبِّبُه من الأضرار على الأفراد والمجتمع."],"r":["صحيح البخاري (8/ 28) (6114).","صحيح مسلم (4/ 2014) (2609)."],"u":"https://hadeethenc.com/ar/browse/hadith/5351"},{"id":5354,"t":"من دل على خير فله مثل أجر فاعله","h":"عن أبي مسعود الأنصاري رضي الله عنه قال: جَاءَ رَجُلٌ إِلَى النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: إِنِّي أُبْدِعَ بِي فَاحْمِلْنِي، فَقَالَ: «مَا عِنْدِي»، فَقَالَ رَجُلٌ: يَا رَسُولَ اللهِ، أَنَا أَدُلُّهُ عَلَى مَنْ يَحْمِلُهُ، فَقَالَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: «مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ».","a":"رواه مسلم","g":"صحيح","e":"جاء رجلٌ إلى النبي صلى الله عليه وسلم فقال: إني هَلَكَتْ راحلتي، فاحملني على دابةٍ، وأعطني مركوبًا يوصلني، فاعتذر له النبي صلى الله عليه وسلم أنه ليس عنده شيء يحمله عليه، فقال رجلٌ وكان حاضرًا: يا رسول الله، أنا أَدُلُّه على مَن يَحمله، فأخبرَ رسولُ الله صلى الله عليه وسلم أنه شريكٌ للمتصدِّق في الأجر، لأنه دلَّ المحتاجَ عليه.","f":["الحث على الدلالة على الخير.","الحضُّ على فعل الخير من أسباب تَكَافُل المجتمع المسلم وتكامله.","سَعَة فضل الله تعالى.","الحديث قاعدة عامة فيدخل فيه كلُّ أعمال الخير.","الإنسان إذا لم يتمكَّن مِن تحقيق رغبة السائل، فإنه يَدُلُّه على غيره."],"r":["صحيح مسلم (3/ 1506) (1893).","شرح النووي على مسلم (11/ 166)."],"u":"https://hadeethenc.com/ar/browse/hadith/5354"},{"id":5437,"t":"من كان يؤمن بالله واليوم الآخر فليقل خيرا أو ليصمت","h":"عن أبي هريرة رضي الله عنه عن رسول الله صلى الله عليه وسلم قال: «مَنْ كَانَ يُؤْمِنُ بِاللهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ، وَمَنْ كَانَ يُؤْمِنُ بِاللهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ جَارَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ ضَيْفَهُ».","a":"متفق عليه","g":"صحيح","e":"بَيَّنَ النبيُّ صلى الله عليه وسلم أنَّ العبدَ المؤمن بالله واليوم الآخر الذي إليه معاده وفيه مجازاته بعمله، يَحُثُّه إيمانُه على فعل هذه الخصال: الأولى: القول الحسن: من التسبيح والتهليل، والأمر بالمعروف، والنهي عن المنكر، والإصلاح بين الناس، فإنْ لم يفعل فلْيلزم السكوت ويَكُف أذاه ويحفظ لسانه. الثاني: إكرام الجار: بالإحسان إليه وعدم إيذائه. الثالث: إكرام الضيف القادم لزيارتك: بطِيْبِ الكلام وإطعام الطعام ونحو ذلك.","f":["الإيمان بالله واليوم الآخر أَصْلٌ لكلِّ خير، ويَبعث على فعل الخير.","التحذير من آفات اللسان.","دين الإسلام دين الأُلفة والكرم.","هذه الخصال من شُعَب الإيمان ومن الآداب المحمودة.","كثرة الكلام قد تَجُرُّ إلى المكروه أو المحرَّم، والسلامة في عدم الكلام إلا في الخير."],"r":["صحيح البخاري (8/ 11) (6018).","صحيح مسلم (1/ 68) (47)."],"u":"https://hadeethenc.com/ar/browse/hadith/5437"},{"id":5439,"t":"من لا يرحم الناس لا يرحمه الله عز وجل","h":"عن جرير بن عبد الله رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «مَنْ لَا يَرْحَمِ النَّاسَ لَا يَرْحَمْهُ اللهُ عَزَّ وَجَلَّ».","a":"متفق عليه","g":"صحيح","e":"يُبَيِّنُ النبيُّ صلى الله عليه وسلم أنَّ الذي لا يرحمُ الناسَ لا يرحمُه اللهُ عز وجل، فرحمةُ العبد للخَلق من أكبر الأسباب التي تُنالُ بها رحمةُ الله تعالى.","f":["الرحمة مطلوبة لسائر المخلوقات، لكن خص الناس بالذكر اهتمامًا بهم.","الله هو الرحيم ويرحم عبادَه الرُّحَماء، فالجزاء من جنس العمل.","الرحمة بالناس تشمل إيصال الخير لهم ودفع الشر عنهم ومعاملتهم بالحسنى."],"r":["صحيح البخاري (8/ 10) (6013).","صحيح مسلم (4/ 1809) (2319)."],"u":"https://hadeethenc.com/ar/browse/hadith/5439"},{"id":3706,"t":"حق المسلم على المسلم خمس: رد السلام، وعيادة المريض، واتباع الجنائز، وإجابة الدعوة، وتشميت العاطس","h":"عن أبي هريرة رضي الله عنه قال: سمعت رسول الله صلى الله عليه وسلم يقول: «حَقُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ خَمْسٌ: رَدُّ السَّلَامِ، وَعِيَادَةُ الْمَرِيضِ، وَاتِّبَاعُ الْجَنَائِزِ، وَإِجَابَةُ الدَّعْوَةِ، وَتَشْمِيتُ الْعَاطِسِ».","a":"متفق عليه","g":"صحيح","e":"يُبيِّنُ النبيُّ صلى الله عليه وسلم بعضَ حقوق المسلم على أخيه المسلم: أول هذه الحقوق: ردُّ السلام لمن ألقى عليك السلام. الحق الثاني: عيادة المريض وزيارته. الحق الثالث: اتباع الجنازة من بيته إلى المصلَّى إلى المقبرة حتى تُدفن. الحق الرابع: إجابة الدعوة إذا دعاه إلى وليمة عرس وغير ذلك. الحق الخامس: تَشميت العاطس، وهو أن يقول له إذا حَمِدَ الله: يرحمُك الله، ثم يقول العاطسُ: يهديكم الله ويُصلح بالَكم.","f":["عظمة الإسلام في تأكيد الحقوق بين المسلمين وتوثيق الأُخوَّة والمحبة بينهم."],"r":["صحيح البخاري (2/ 71) (1240).","صحيح مسلم (4/ 1704) (2162)."],"u":"https://hadeethenc.com/ar/browse/hadith/3706"},{"id":5326,"t":"أتدرون ما الغيبة؟، قالوا: الله ورسوله أعلم، قال: ذكرك أخاك بما يكره","h":"عن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: «أَتَدْرُونَ مَا الْغِيبَةُ؟»، قَالُوا: اللهُ وَرَسُولُهُ أَعْلَمُ، قَالَ: «ذِكْرُكَ أَخَاكَ بِمَا يَكْرَهُ»، قِيلَ: أَفَرَأَيْتَ إِنْ كَانَ فِي أَخِي مَا أَقُولُ؟ قَالَ: «إِنْ كَانَ فِيهِ مَا تَقُولُ فَقَدِ اغْتَبْتَهُ، وَإِنْ لَمْ يَكُنْ فِيهِ فَقَدْ بَهَتَّهُ».","a":"رواه مسلم","g":"صحيح","e":"يُبَيِّنُ النبيُّ صلى الله عليه وسلم حقيقة الغيبة المُحرَّمة، وهي: ذِكْرُ المسلم الغائب بما يَكره، سواء كان من صفاته الخَلْقية أو الخُلُقية، مثل: الأعور الغشاش الكذاب، ونحو ذلك من صفات الذم، ولو كانت تلك الصفة موجودة فيه. وأما إذا لم تكنْ فيه الصفةُ فهذا أشدُّ من الغيبة، وهو البُهْتَان، أي: الافتراء على الإنسان بما ليس فيه.","f":["حُسْن تعليم النبي صلى الله عليه وسلم، حيث يُلقي المسائل على طريقة السؤال.","حُسْن أدب الصحابة مع النبي صلى الله عليه وسلم، حين قالوا: الله ورسوله أعلم.","قول المسؤول عن ما لا يعلمه: الله أعلم.","صيانة الشريعة للمجتمع بحفظ الحقوق والأخوة بينهم.","الغيبة محرمة إلا في بعض الأحوال للمصلحة؛ ومن ذلك: دفع الظلم، بحيث يَذكرُ المظلومُ مَن ظَلَمَه عند من يستطيع الأخذ بحقه، فيقول: ظلمني فلان، أو فعل بي كذا، ومنها: المشاورة في أمر الزواج أو المشاركة أو المجاورة، ونحو ذلك."],"r":["صحيح مسلم (4/ 2001) (2589).","فتح ذي الجلال والاكرام بشرح بلوغ المرام، لابن عثيمين (6/ 378)."],"u":"https://hadeethenc.com/ar/browse/hadith/5326"},{"id":5365,"t":"لا يحل لرجل أن يهجر أخاه فوق ثلاث ليال، يلتقيان، فيعرض هذا ويعرض هذا، وخيرهما الذي يبدأ بالسلام","h":"عن أبي أيوب الأنصاري رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: «لَا يَحِلُّ لِرَجُلٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلَاثِ لَيَالٍ، يَلْتَقِيَانِ، فَيُعْرِضُ هَذَا وَيُعْرِضُ هَذَا، وَخَيْرُهُمَا الَّذِي يَبْدَأُ بِالسَّلَامِ».","a":"متفق عليه","g":"صحيح","e":"نهى النبيُّ صلى الله عليه وسلم عن هَجْر المسلم أخاه المسلمَ أكثر من ثلاث ليال، يلتقي كلٌّ منهما بالآخر ولا يسلم عليه ولا يكلمه. وأفضل هذين المتخاصمين مَن يُحاوِل إزالةَ الهجر، ويبدأ بالسلام، والمراد بالهجر هنا الهجر لحظ النفس، أما الهجر لحق الله تعالى كهجر العصاة والمبتدعة وقرناء السوء، فهذا لا يُؤقَّت بوقت، وإنما هو معلق بالمصلحة في الهجر، ويزول بزوالها.","f":["إباحة الهجر في الثلاثة أيام فما دونها، مراعاة للطباع البشرية، فعُفي عن الهجر في الثلاث ليذهب ذلك العارض.","فضل السلام، وأنه يُزيل ما في النفوس، وأنه علامة على المحبة.","حرص الإسلام على الأخوة والألفة بين أهله."],"r":["صحيح البخاري (8/ 21) (6077).","صحيح مسلم (4/ 1984) (2560)."],"u":"https://hadeethenc.com/ar/browse/hadith/5365"},{"id":5733,"t":"أن النبي صلى الله عليه وسلم كان لا يرد الطيب","h":"عن أنس بن مالك رضي الله عنه: أَنَّ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ كَانَ لَا يَرُدُّ الطِّيبَ.","a":"رواه البخاري","g":"صحيح","e":"كان مِن هَديِ النبيِّ صلى الله عليه وسلم أنه لا يَرُدُّ الطِّيْبَ ويَقْبَلَه؛ لأنه خفيفُ المَحمل وطَيِّبُ الرَّائحة.","f":["استحباب قبول عَطِيَّةِ الطِّيْبِ؛ لأنه لا مُؤْنَة لحملِه ولا مِنَّةَ في قبوله.","كمال وحسن خلق النبي صلى الله عليه وسلم في عدم رد الطيب، وقبول هدية من يهدي إليه.","الترغيب في استعمال الطيب."],"r":["صحيح البخاري (3/ 157) (2582).","شرح رياض الصالحين، لابن عثيمين (6/ 560)."],"u":"https://hadeethenc.com/ar/browse/hadith/5733"},{"id":5798,"t":"إن الله ليرضى عن العبد أن يأكل الأكلة فيحمده عليها، أو يشرب الشربة فيحمده عليها","h":"عن أنس بن مالك رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «إِنَّ اللهَ لَيَرْضَى عَنِ الْعَبْدِ أَنْ يَأْكُلَ الْأَكْلَةَ فَيَحْمَدَهُ عَلَيْهَا، أَوْ يَشْرَبَ الشَّرْبَةَ فَيَحْمَدَهُ عَلَيْهَا».","a":"رواه مسلم","g":"صحيح","e":"يُبَيِّنُ النبيُّ صلى الله عليه وسلم أنَّ حَمْدَ العبدِ ربَّه على فَضْلِهِ ونِعَمِهِ مِن الأمور التي يَحْصُل بها رضا الله؛ فيَطْعَمُ الطعامَ ويقول: الحمد لله، ويَشرَبُ الشَّرَابَ ويقول: الحمد لله.","f":["كرم الله عز وجل، فقد تَفَضَّلَ بالرزق ورَضِيَ بالحَمْد.","رضا الله يُنالُ بأيسر سبب، كالحمد بعد الأكل والشرب.","من آداب الطعام والشراب: حمد الله تعالى عَقِب الأكل والشرب."],"r":["صحيح مسلم (4/ 2095) (2734).","نزهة المتقين شرح رياض الصالحين، لمصطفى الخن وغيره (1/ 164)."],"u":"https://hadeethenc.com/ar/browse/hadith/5798"},{"id":58120,"t":"يا غلام، سم الله، وكل بيمينك، وكل مما يليك","h":"عن عُمر بن أبي سلمة رضي الله عنه قال: كُنْتُ غُلَامًا فِي حَجْرِ رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَكَانَتْ يَدِي تَطِيشُ فِي الصَّحْفَةِ، فَقَالَ لِي رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: «يَا غُلَامُ، سَمِّ اللهَ، وَكُلْ بِيَمِينِكَ، وَكُلْ مِمَّا يَلِيكَ» فَمَا زَالَتْ تِلْكَ طِعْمَتِي بَعْدُ.","a":"متفق عليه","g":"صحيح","e":"يُخْبِرُ عُمَرُ بن أبي سلمة رضي الله عنهما، ابن زوجة النبي صلى الله عليه وسلم أم سلمة رضي الله عنها، -وكان تحت تربيتِه ورعايته-، أنه كان أثناء الأكل يَنْقُلُ يدَه في جوانب الإناء ليلتقط الطعام، فعلَّمه النبي صلى الله عليه وسلم ثلاثة آداب من آداب الأكل: أولها: قول \"بسم الله\" في بداية الأكل. وثانيها: الأكل باليمين. وثالثها: الأكل من الجانب الذي يَقْرُبُ منه من الطعام.","f":["من آداب الأكل والشرب التسميةُ في أوله.","تعليم الصبيان الآداب، لاسيَّما من كان تحت كفالة الإنسان.","رفق النبي صلى الله عليه وسلم، وسعة صدره في تعليم الصغار وتأديبهم.","من آداب الطعام الأكل مما يلي الإنسان، إلا إذا كان أصنافًا متعددة فله أن يأخذ منها.","التزام الصحابة بما أدَّبهم به النبي صلى الله عليه وسلم، وذلك مستفاد من قول عمر: فما زالت تلك طعمتي بعد."],"r":["صحيح البخاري (7/ 68) (5376)، (3/ 61) (2092).","صحيح مسلم (3/ 1599) (2022)."],"u":"https://hadeethenc.com/ar/browse/hadith/58120"},{"id":58122,"t":"إذا أكل أحدكم فليأكل بيمينه، وإذا شرب فليشرب بيمينه، فإن الشيطان يأكل بشماله، ويشرب بشماله","h":"عن ابن عمر رضي الله عنهما أن رسول الله صلى الله عليه وسلم قال: «إِذَا أَكَلَ أَحَدُكُمْ فَلْيَأْكُلْ بِيَمِينِهِ، وَإِذَا شَرِبَ فَلْيَشْرَبْ بِيَمِينِهِ، فَإِنَّ الشَّيْطَانَ يَأْكُلُ بِشِمَالِهِ، وَيَشْرَبُ بِشِمَالِهِ».","a":"رواه مسلم","g":"صحيح","e":"يَأمُرُ النبيُّ صلى الله عليه وسلم أنْ يأكلَ المسلمُ ويشربَ بيدِهِ اليمين، وينهى عن الأكل والشرب بالشمال؛ وذلك لأن الشيطان يأكل ويشرب بها.","f":["النهي عن التشبه بالشيطان بالأكل أو الشرب بالشمال."],"r":["صحيح مسلم (3/ 1598) (2020).","توضيح الأحكام مِن بلوغ المرام، للبسام (5/ 445)."],"u":"https://hadeethenc.com/ar/browse/hadith/58122"},{"id":2985,"t":"لا تلبسوا الحرير ولا الديباج، ولا تشربوا في آنية الذهب والفضة، ولا تأكلوا في صحافها، فإنها لهم في الدنيا ولنا في الآخرة","h":"عَن عَبْدِ الرَّحْمَنِ بْنِ أَبِي لَيْلَى أَنَّهُمْ كَانُوا عِنْدَ حُذَيْفَةَ، فَاسْتَسْقَى فَسَقَاهُ مَجُوسِيٌّ، فَلَمَّا وَضَعَ القَدَحَ فِي يَدِهِ رَمَاهُ بِهِ، وَقَالَ: لَوْلاَ أَنِّي نَهَيْتُهُ غَيْرَ مَرَّةٍ وَلاَ مَرَّتَيْنِ -كَأَنَّهُ يَقُولُ: لَمْ أَفْعَلْ هَذَا-، وَلَكِنِّي سَمِعْتُ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: «لاَ تَلْبَسُوا الحَرِيرَ وَلاَ الدِّيبَاجَ، وَلاَ تَشْرَبُوا فِي آنِيَةِ الذَّهَبِ وَالفِضَّةِ، وَلاَ تَأْكُلُوا فِي صِحَافِهَا، فَإِنَّهَا لَهُمْ فِي الدُّنْيَا وَلَنَا فِي الآخِرَةِ».","a":"متفق عليه","g":"صحيح","e":"نَهَى النبيُّ صلى الله عليه وسلم الرجالَ عن لُبس الحرير بأنواعه. ونهى الرجالَ والنساءَ عن الأكل والشرب في آنية وأوعية الذهب والفضة. وأخبر بأنها خالصة للمؤمنين يوم القيامة؛ لأنهم اجتنبوها في الدنيا طاعة لله، وأما الكفار فليست لهم في الآخرة؛ لأنهم تعجَّلوا طيباتِهم في حياتهم الدنيا باتخاذهم لها، ومعصيتهم أمر الله.","f":["تحريم لبس الحرير والديباج على الذكور، والوعيد الشديد على مَن لَبِسه.","يباح للنساء لبسُ الحرير والديباج.","تحريم الأكل والشرب في صحاف الذهب والفضة وآنيتهما على الذكور والإناث.","تغليظ حذيفة رضي الله عنه في الإنكار، وعلل ذلك بأنَّه نهاه أكثَرَ مِن مَرَّةٍ عن استعمالِ آنِيَةِ الذَّهَبِ والفِضَّةِ، لكنَّه لَمَّا لم يَنْتَهِ."],"r":["صحيح البخاري (7/ 77) (5426).","صحيح مسلم (3/ 1638) (2067)."],"u":"https://hadeethenc.com/ar/browse/hadith/2985"},{"id":2986,"t":"من لبس الحرير في الدنيا لم يلبسه في الآخرة","h":"عَنْ عُمَرَ رضي الله عنه قَالَ: قَالَ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: «مَنْ لَبِسَ الحَرِيرَ فِي الدُّنْيَا لَمْ يَلْبَسْهُ فِي الآخِرَةِ».","a":"متفق عليه","g":"صحيح","e":"بَيَّنَ النبيُّ صلى الله عليه وسلم أنه مَن لَبس الحريرَ من الرجال في الدنيا لم يَلبَسها في الآخرة إذا لم يتب عقابًا له.","f":["المَقصود بالحرير الحرير الخالِص الطبيعي، أما الحرير الصناعي فلا يشمله الحديث.","تحريم لبس الحرير على الرجال.","النهي عن لبس الحرير يعم لُبسه وافتراشه.","يسمح للرجال ببعض الحرير في الثياب بما لا يُجاوِز عرضُه إصبعين إلى أربعة أصابع تتخذ أعلامًا أو حاشية للثوب."],"r":["صحيح البخاري (7/ 150) (5834).","صحيح مسلم (3/ 1641) (2069)."],"u":"https://hadeethenc.com/ar/browse/hadith/2986"},{"id":3014,"t":"دعهما، فإني أدخلتهما طاهرتين","h":"عَنْ المُغِيرَةِ رضي الله عنه قَالَ: كُنْتُ مَعَ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ فِي سَفَرٍ، فَأَهْوَيْتُ لِأَنْزِعَ خُفَّيْهِ، فَقَالَ: «دَعْهُمَا، فَإِنِّي أَدْخَلْتُهُمَا طَاهِرَتَيْنِ» فَمَسَحَ عَلَيْهِمَا.","a":"متفق عليه","g":"صحيح","e":"كان النبي صلى الله عليه وسلم في أَحَدِ أسفارِه فتوضأ، فلما بلغ غسل الرجلين مَدَّ المغيرةُ بن شعبة رضي الله عنه يديه لِنَزْعِ ما كان على قَدَمِ النبيِّ صلى الله عليه وسلم مِن خُفٍّ لغسل رجليه! فقال النبي صلى الله عليه وسلم: اتركهما ولا تنزعهما، فإني أدخلت رِجْلَيَّ في الخُفين وأنا على طهارة، فمسح النبي صلى الله عليه وسلم على خفيه بَدل غسل رجليه.","f":["مشروعية المسح على الخفين يكون عند الوضوء من حَدَثٍ أصغر، وأما الاغتسال للحدث الأكبر فلابد من غسل القدمين.","المسح يكون مرة واحدة بإمرار اليد مبلولة على أعلى الخف دون أسفله.","يشترط للمسح على الخفين أن يكون لبسهما بعد وضوء تامٍّ غَسَلَ فيه قدميه بالماء، وأن يكون الخف طاهرًا، ساترًا لمحل الفرض من القدم، وأنْ يكون مسحهما في الحَدَث الأصغر لا في الجنابة أو ما يوجب الغُسل، وأنْ يكون المسح في الوقت المحدَّد شرعًا وهو يومٌ وليلةٌ للمُقيم وثلاثة أيام بلياليها للمسافر.","يقاس على الخفين كل ما يستر الرجلين من الجوارب وغيرها، فيجوز المسح عليها.","حسن خلق النبي صلى الله عليه وسلم وتعليمه، حيث منع المغيرة من خلعهما، وبيَّن له السبب: أنه أدخلهما طاهرتين؛ لتطمئن نفسه، ويعرف الحكم."],"r":["صحيح البخاري (1/ 52) (206).","صحيح مسلم (1/ 230) (274)."],"u":"https://hadeethenc.com/ar/browse/hadith/3014"},{"id":3021,"t":"يا رسول الله، أيرقد أحدنا وهو جنب؟ قال: نعم، إذا توضأ أحدكم فليرقد","h":"عن عبد الله بنِ عمر رضي الله عنهما أن عمرَ بْن الخطاب رضي الله عنه قال: ((يا رسول الله، أّيَرقُدُ أَحَدُنا وهو جُنُب؟ قال: نعم، إِذَا تَوَضَّأ أَحَدُكُم فَليَرقُد)).","a":"متفق عليه","g":"صحيح","e":"سأل عمر بن الخطاب رضي الله عنه النبي صلى الله عليه وسلم : إن أصابت أحدهم الجنابة من أول الليل، بأن جامع امرأته ولو لم ينزل أو احتلم، فهل يرقد أي ينام وهو جنب؟ فأذن لهم صلى الله عليه وسلم بذلك، على أن يخفف هذا الحدث الأكبر بالوضوء الشرعي؛ وحينئذ لا بأس من النوم مع الجنابة.","f":["حرص الصحابة -رضي الله عنهم- على السؤال عمَّا تدعو له الحاجة.","غسل الجنابة ليس على الفور، وإنما يتضيق عند القيام إلى الصلاة.","الكمال أن لا ينام الجنب حتى يغتسل؛ لأن الاكتفاء بالوضوء رخصة.","مشروعية الوضوء قبل النوم للجنب، إذا لم يغتسل.","جواز نوم الجنب قبل الغسل إذا توضأ.","كراهة نوم الجنب بلا غسل ولا وضوء."],"r":["تيسير العلام شرح عمدة الأحكام، عبد الله بن عبد الرحمن البسام، تحقيق: محمد صبحي حلاق، مكتبة الصحابة، الإمارات، مكتبة التابعين، القاهرة، الطبعة: العاشرة 1426هـ.","تنبيه الأفهام شرح عمدة الأحكام، محمد بن صالح العثيمين، مكتبة الصحابة، الإمارات، الطبعة: الأولى 1426هـ."],"u":"https://hadeethenc.com/ar/browse/hadith/3021"},{"id":3033,"t":"إذا توضأ أحدكم فليجعل في أنفه ثم لينثر، ومن استجمر فليوتر","h":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه أَنَّ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: «إِذَا تَوَضَّأَ أَحَدُكُمْ فَلْيَجْعَلْ فِي أَنْفِهِ ثُمَّ لِيَنْثُرْ، وَمَنِ اسْتَجْمَرَ فَلْيُوتِرْ، وَإِذَا اسْتَيْقَظَ أَحَدُكُمْ مِنْ نَوْمِهِ فَلْيَغْسِلْ يَدَهُ قَبْلَ أَنْ يُدْخِلَهَا فِي وَضُوئِهِ، فَإِنَّ أَحَدَكُمْ لاَ يَدْرِي أَيْنَ بَاتَتْ يَدُهُ». ولفظ مسلم: «إِذَا اسْتَيْقَظَ أَحَدُكُمْ مِنْ نَوْمِهِ فَلَا يَغْمِسْ يَدَهُ فِي الْإِنَاءِ حَتَّى يَغْسِلَهَا ثَلَاثًا، فَإِنَّهُ لَا يَدْرِي أَيْنَ بَاتَتْ يَدُهُ».","a":"متفق عليه","g":"صحيح","e":"بَيَّنَ النبيُّ صلى الله عليه وسلم بعضَ أحكام الطهارة، ومنها: لأول: أنَّ مَن توضأ فعليه أنْ يُدخِلَ الماءَ في أنفِهِ بالنَّفَسِ، ثم يُخرجه بالنَّفَسِ أيضًا. والثاني: أنَّ مَن أراد تنظيفَ الأذى الخارج منه وإزالتَه بغير الماء كالحجارة ونحوها فيكون تنظيفُه على عدد فَرْدِيٍّ أقله ثلاثًا وأعلاه ما ينقطع به الخارج وينظف المحل. والثالث: أن من استيقظ من نوم الليل لا يُدْخِلُ كفَّه في الإناء ليتوضأ حتى يغسلها ثلاث مرات خارج الإناء، فإنه لا يدري أين باتت يده، فلا يأمن النجاسة عليها، وقد يكون عبث بها الشيطان وحمل إليها أشياء مُضِرة للإنسان أو مُفسِدة للماء.","f":["يجب الاستنشاق في الوضوء، وهو: إدخال الماء في الأنف بواسطة النَّفَس، وكذلك يجب الاستنثار، وهو: إخراج الماء من الأنف بواسطة النَّفَس.","استحباب الاستجمار وترًا.","مشروعية غسل اليدين بعد نوم الليل ثلاثًا."],"r":["صحيح البخاري (1/ 43) (162).","صحيح مسلم (1/ 233) (278)."],"u":"https://hadeethenc.com/ar/browse/hadith/3033"},{"id":3079,"t":"لا يمسكن أحدكم ذكره بيمينه وهو يبول، ولا يتمسح من الخلاء بيمينه، ولا يتنفس في الإناء","h":"عَنْ أَبِي قَتَادَةَ رضي الله عنه قَالَ: قَالَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: «لَا يُمْسِكَنَّ أَحَدُكُمْ ذَكَرَهُ بِيَمِينِهِ وَهُوَ يَبُولُ، وَلَا يَتَمَسَّحْ مِنَ الْخَلَاءِ بِيَمِينِهِ، وَلَا يَتَنَفَّسْ فِي الْإِنَاءِ».","a":"متفق عليه","g":"صحيح","e":"بَيَّنَ النبيُّ صلى الله عليه وسلم بعض الآداب؛ حيث نهى أنْ يُمْسِكَ الرجل ذكره حال البول بيده اليمنى، وأن تُزال النجاسة من القُبُلِ أو الدُّبُرِ باليد اليمنى؛ لأن اليمين أعدت للمكارم، كما نهى أن يتنفس الإنسان في الإناء الذي يشرب فيه.","f":["بيان سَبْق الإسلام في الآداب والنظافة.","اجتناب الأشياء القذرة، فإذا اضطر إلى مباشرتها، فليكن باليسار.","بيان شرف اليمين وفضلها على اليسار.","كمال الشريعة الإسلامية وشمول تعاليمها."],"r":["صحيح البخاري (1/ 42) (154).","صحيح مسلم (1/ 225) (267)."],"u":"https://hadeethenc.com/ar/browse/hadith/3079"},{"id":3285,"t":"إذا رأى أحدكم الرؤيا يحبها فإنها من الله، فليحمد الله عليها وليحدث بها، وإذا رأى غير ذلك مما يكره، فإنما هي من الشيطان، فليستعذ من شرها، ولا يذكرها لأحد، فإنها لن تضره","h":"عَنْ أَبِي سَعِيدٍ الخُدْرِيِّ رضي الله عنه أَنَّهُ سَمِعَ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: «إِذَا رَأَى أَحَدُكُمُ الرُّؤْيَا يُحِبُّهَا فَإِنَّهَا مِنَ اللَّهِ، فَلْيَحْمَدِ اللَّهَ عَلَيْهَا وَلْيُحَدِّثْ بِهَا، وَإِذَا رَأَى غَيْرَ ذَلِكَ مِمَّا يَكْرَهُ، فَإِنَّمَا هِيَ مِنَ الشَّيْطَانِ، فَلْيَسْتَعِذْ مِنْ شَرِّهَا، وَلاَ يَذْكُرْهَا لِأَحَدٍ، فَإِنَّهَا لَنْ تَضُرَّهُ».","a":"رواه البخاري","g":"صحيح","e":"أَخْبَرَ النبيُّ صلى الله عليه وسلم أنَّ الرؤيا الصالحةَ المُفرِحة في المنام من الله، وأرشد بأنْ يَحمد الله عليها، ويخبر بها، وإذا رأى ما يَكره ويُحزن فإنما هي من الشيطان؛ فليستعذ بالله من شرها، ولا يذكرها لأحد؛ فإنها لا تضره حيث جعل الله ما ذُكر سببًا للسلامة من المكروه المترتِّب على الرؤيا.","f":["أقسام الرؤيا: 1- الرؤيا الصالحة، وهي رؤيا حق وبشرى من الله يراها أو تُرى له، 2- حديث النفس وهي ما يحدِّث بها الرجل نفسه في اليقظة، 3- تحزين وتخويف الشيطان وأهاويل منه ليحزن ابن آدم.","حاصل ما ذكر من أبواب الرؤيا الصالحة ثلاثة أشياء: أن يحمد الله عليها، وأن يستبشر بها، وأن يتحدث بها لكن لمن يحب دون من يكره.","حاصل ما ذكر من أدب الرؤيا المكروهة خمسة أشياء: أن يتعوَّذ بالله من شرها، ومن شر الشيطان، وأن يتفل حين يهب من نومه عن يساره ثلاثا، ولا يذكرها لأحد أصلًا، وإذا أراد أن يرجع لنومه يتحوّل عن جنبه الذي كان عليه؛ فإنها لا تضره.","قال ابن حجر: الحكمة فيه أنه إذا حدَّث بالرؤيا الحسنة من لا يحب قد يفسِّرها له بما لا يحب إما بُغضًا وإما حسدًا، فقد تقع على تلك الصفة أو يتعجّل لنفسه من ذلك حُزنًا ونكدًا، فأمر بترك تحديث مَن لا يُحِب بسبب ذلك.","الحمد عند حدوث النِّعَم، وتجدد المنن، فذلك سبب لدوامها."],"r":["صحيح البخاري (9/ 43) (7045).","كنوز رياض الصالحين، لمجموعة من الباحثين (11/ 181)."],"u":"https://hadeethenc.com/ar/browse/hadith/3285"},{"id":66515,"t":"إن الحلال بين، وإن الحرام بين","h":"عَنْ أَبِي عَبْدِ اللَّهِ النُّعْمَانِ بْنِ بَشِيرٍ رَضِيَ اللَّهُ عَنْهُ، قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم يَقُولُ: «إنَّ الحَلَالَ بَيِّنٌ، وَإِنَّ الحَرَامَ بَيِّنٌ، وَبَيْنَهُمَا مُشْتَبِهَاتٌ لَا يَعْلَمُهُنَّ كَثِيرٌ مِنَ النَّاسِ، فَمَنْ اتَّقَى الشُّبُهَاتِ اسْتَبْرَأَ لِدِينِهِ وَعِرْضِهِ، وَمَنْ وَقَعَ فِي الشُّبُهَاتِ وَقَعَ فِي الحَرَامِ، كَالرَّاعِي يَرْعَى حَوْلَ الحِمَى يُوشِكُ أَنْ يَرْتَعَ فِيهِ، أَلَا وَإِنَّ لِكُلِّ مَلِكٍ حِمًى، أَلَّا وَإِنَّ حِمَى اللَّهِ مَحَارِمُهُ، أَلَّا وَإِنَّ فِي الجَسَدِ مُضْغَةً إذَا صَلَحَتْ صَلَحَ الجَسَدُ كُلُّهُ، وَإذَا فَسَدَتْ فَسَدَ الجَسَدُ كُلُّهُ، أَلَا وَهِيَ القَلْبُ».","a":"رواه البخاري ومسلم","g":"صحيح","e":"يُبَيِّنُ النبيُّ صلى الله عليه وسلم قاعدةً عامةً في الأشياء، وأنها تنقسم في الشريعة إلى ثلاثة أقسام: حَلال بَيِّن، وحرام بَيِّن، وأمور مشتبهات غير واضحة الحكم من حيث الحِلِّ والحُرْمة، لا يعلم حُكمَها كثير من الناس. فمَن ترك تلك الأشياء المشتبهة عليه سَلِم دينُه بالبُعد عن الوقوع في الحرام، وسَلِم له عِرضُه من كلام الناس بما يَعيبون عليه بسبب ارتكابه هذا المشتبه. ومَن لم يجتنب المشتبهات فقد عَرَّض نفسَه إما بالوقوع في الحرام، أو نيل الناس من عرضه. وضرب الرسول صلى الله عليه وسلم مثلًا ليُبيِّن حال من يرتكب الشبهات وأنه كالراعي يرعى ماشيتَه قُرْبَ أرضٍ قد حماها صاحبها، فتوشك ماشيةُ الراعي أن ترعى في هذا الحمى لقربها منه، فكذلك من يفعل ما فيه شبهة، فإنه بذلك يقترب من الحرام فيوشك أن يقع فيه. وبعدها أخبر النبي صلى الله عليه وسلم أن في الجسد مضغة (وهي القلب) يصلح الجسد بصلاحها، ويفسد بفسادها.","f":["الحديث قاعدة في اتقاء الشبهات.","الترغيب في ترك المشتبِه، الذي لم يَتبيّن حكمُه."],"r":["صحيح البخاري (1/ 20) (52).","صحيح مسلم (3/ 1219) (1599)."],"u":"https://hadeethenc.com/ar/browse/hadith/66515"},{"id":66524,"t":"قل لي في الإسلام قولا لا أسأل عنه أحدا غيرك، قال: قل: آمنت بالله، ثم استقم","h":"عَنْ أَبِي عَمْرٍو- وَقِيلَ: أَبِي عَمْرَةَ-، سُفْيَانَ بْنِ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُ قَالَ: قُلْتُ: يَا رَسُولَ اللهِ، قُلْ لِي فِي الْإِسْلَامِ قَوْلًا لَا أَسْأَلُ عَنْهُ أَحَدًا غَيْرَكَ، قَالَ: «قُلْ: آمَنْتُ بِاللهِ، ثُمَّ اسْتَقِمْ».","a":"رواه مسلم","g":"صحيح","e":"سَأَلَ الصحابيُّ سفيانُ بنِ عبدِ الله رضي الله عنه النبيَّ صلى الله عليه وسلم أنْ يُعَلِّمَه قولًا جامِعًا لمعاني الإسلام يَتَمَسَّكُ به ولا يَسأل عنه غيرَه؟ فقال له صلى الله عليه وسلم: قل: وَحَّدْتُ اللهَ، وآمنتُ أنه ربي وإلهي وخالقي ومعبودي الحق لا شريك له، ثم ينقاد لطاعة الله بأداء فرائض الله وترك محارم الله ويستمر عليها.","f":["أصلُ الدين هو الإيمان بالله بروبيته وألوهيته وأسمائه وصفاته.","أهمية الاستقامة بعد الإيمان، والاستمرار في العبادة، والثبات على ذلك.","الإيمان شرط لقبول الأعمال .","الإيمان بالله، يشمل ما يجب اعتقادُه من عقائد الإيمان وأصوله، وما يتبع ذلك من أعمال القلوب، والانقياد والاستسلام لله باطنًا وظاهرًا.","الاستقامةُ مُلازَمَةُ الطريق، بفعل الواجبات وترك المنهيات."],"r":["صحيح مسلم (1/ 65) (38).","مسند أحمد (24/ 141) (15416)."],"u":"https://hadeethenc.com/ar/browse/hadith/66524"},{"id":66526,"t":"الطهور شطر الإيمان، والحمد لله تملأ الميزان، وسبحان الله والحمد لله تملآن أو تملأ ما بين السماء والأرض","h":"عَنْ أَبِي مَالِكٍ الحَارِثِ بْنِ عَاصِمٍ الأَشْعَرِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: «الطُّهُورُ شَطْرُ الْإِيمَانِ، وَالْحَمْدُ لِلهِ تَمْلَأُ الْمِيزَانَ، وَسُبْحَانَ اللهِ وَالْحَمْدُ لِلهِ تَمْلَآنِ -أَوْ تَمْلَأُ- مَا بَيْنَ السَّمَاءِ وَالأَرْضِ، وَالصَّلَاةُ نُورٌ، وَالصَّدَقَةُ بُرْهَانٌ، وَالصَّبْرُ ضِيَاءٌ، وَالْقُرْآنُ حُجَّةٌ لَكَ أَوْ عَلَيْكَ، كُلُّ النَّاسِ يَغْدُو، فَبَايِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا»","a":"رواه مسلم","g":"صحيح","e":"يخبر النبي صلى الله عليه وسلم: أن طهارة الظاهر تكون بالوضوء والغسل وهي شرط في الصلاة. وأن قول: \" الحمد لله تملا الميزان\" وهو الثناء عليه سبحانه، ووصفه بصفات الكمال توزن يوم القيامة فتملأ ميزان الأعمال. وأن قول: \"سبحان الله والحمد لله\" وهو تنزيهه عن كل نَقْصٍ ووصفه بالكمال التام الذي يليق بجلاله مع محبته وتعظيمه تملأ ما بين السموات والأرض. وأن \"الصلاة نور\" للعبد في قلبه، وفي وجهه، وفي قبره، وفي حشره. وأن \"الصدقة برهان\" ودليل على صدق إيمان المؤمن، واختلافه عن المنافق الذي يمتنع منها لكونه لا يصدق بموعودها. وأن \"الصبر ضياء\" -وهو حبس النفس عن الجَزَع والتَّسَخُّط - نور يحصل معه حرارة وإحراق، كضياء الشمس؛ لأنه شاق ويحتاج إلى مجاهدة النفس وحبسها عما تهواه؛ فلا يزال صاحبه مستضيئًا مهتديًا مستمرًّا على الصواب. وهو صبر على طاعة الله، وعن معصيته، وصبر على المصائب وأنواع المكاره في الدنيا. وأن \"القرآن حجة لك\" بتلاوته والعمل به، أو \"حجة عليك\" بتركه دون عمل أو تلاوة. ثم أخبر صلى الله عليه وسلم أن كل الناس يسعون وينتشرون ويقومون من نومهم ويخرجون من بيوتهم لأعمالهم المختلفة، فمنهم من يستقيم على طاعة الله فيُعْتِق نفسَه من النار، ومنهم من ينحرف عن ذلك ويقع في المعاصي فيهلكها بدخولها النار.","f":["الطهارة طهارتان: طهارة الظاهر تكون بالوضوء والغسل، وطهارة الباطن تكون بالتوحيد والإيمان والعمل الصالح.","أهمية المحافظة على الصلاة فهي نور للعبد في الدنيا ويوم القيامة.","الصدقة دليل على صدق الإيمان.","أهمية العمل بالقرآن وتصديقه ليكون حجة لك لا عليك.","النفس إن لم تشغلها بالطاعة شغلتك بالمعصية.","كل إنسان لا بد أن يعمل؛ فإما أن يعتق نفسه بالطاعة، أو يوبقها بالمعصية.","الصبر يحتاج إلى تَحَمُّلٍ واحتسابٍ وفيه مشقة."],"r":["صحيح مسلم (1/ 203) (223).","شرح الأربعين لابن دقيق العيد (ص 84)."],"u":"https://hadeethenc.com/ar/browse/hadith/66526"},{"id":66537,"t":"أربع من كن فيه كان منافقا، وإن كانت خصلة منهن فيه كانت فيه خصلة من النفاق حتى يدعها: من إذا حدث كذب، وإذا وعد أخلف، وإذا خاصم فجر، وإذا عاهد غدر","h":"عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو رضي الله عنهما قال: قال رَسولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: «أَرْبَعٌ مَنْ كُنَّ فِيهِ كَانَ مُنَافِقًا، وَإِنْ كَانَتْ خَصْلَةٌ مِنْهُنَّ فِيهِ كَانَتْ فِيهِ خَصْلَةٌ مِنَ النِّفَاقِ حَتَّى يَدَعَهَا: مَنْ إِذَا حَدَّثَ كَذَبَ، وإِذَا وَعَدَ أَخْلَفَ، وإذَا خَاصَمَ فَجَرَ، وَإِذَا عَاهَدَ غَدَرَ».","a":"رواه البخاري ومسلم","g":"صحيح","e":"حَذَّرَ النبيُّ صلى الله عليه وسلم مِن أربعِ خِصال إذا اجتمعت في مسلم كان شديدَ الشَّبَهِ بالمنافقين بسبب هذه الخصال، وهذا فيمن كانت هذه الخصال غالبةً عليه، وأما من يَنْدُرُ فليس داخلًا فيه، وهي: الأولى: إذا حَدَّث تعمَّد الكذب وعدم الصدق في كلامه. الثانية: إذا عاهد عهدًا لم يُوْفِ به، وغَدَرَ بصاحبِه. الثالثة: إذا وَعَدَ وَعْدًا لم يَفِ به وأَخلَفَه. الرابعة: إذا تَخَاصَم وتَشَاجَرَ مع أحد كان خصامُه شديدًا، ومالَ عن الحق، واحتال في رده وإبطاله، وقال الباطلَ والكذبَ. فإنّ النفاق هو إظهار ما يُبطِنُ خلافَه، وهذا المعنى موجود في صاحب هذه الخصال، ويكون نفاقُه في حق مَن حَدَّثه، ووعدَه، وائتمنَه، وخاصمَه، وعاهدَه من الناس، لا أنه منافق في الإسلام فيظهره وهو يبطن الكفر، ومن كانت فيه خصلة من هذه الخصال؛ كان فيه صفة من النفاق حتى يَتْركَها.","f":["بيان بعض علامات المنافق للتخويف والتحذير من الوقوع فيها.","المقصود من الحديث: أن هذه الخصالَ خصالُ نفاق، وصاحبُها شبيهٌ بالمنافقين في هذه الخصال، ومتخلِّق بأخلاقهم، لا أنه منافق يظهر الإسلام وهو يبطن الكفر، وقيل هذا محمول على من غَلَبت عليه هذه الخصال وتهاونَ بها، واستخفَّ بأمرها؛ فإن من كان كذلك كان فاسد الاعتقاد غالبًا.","قال الغزالي: أصل الديانة منحصر في ثلاث: القول، والفعل، والنية، فنبَّه على فساد القول بالكذب، وعلى فساد الفعل بالخيانة، وعلى فساد النية بالخُلْف؛ لأن خُلْفَ الوعد لا يقدح إلا إذا كان العزم عليه مقارنًا للوعد، أما لو كان عازمًا ثم عرض له مانع أو بدا له رأيٌ فهذا لم توجد منه صورة النفاق.","النفاق نوعان: نفاق اعتقاديٌّ يُخرِجُ صاحبَه عن الإيمان، وهو إظهار الإسلام وإخفاء الكفر، ونفاق عَمَلِيٌّ، وهو التشبُّه بالمنافقين في أخلاقهم، وهذا لا يُخرِجُ صاحبَه عن الإيمان، إلا أنه كبيرة من الكبائر.","قال ابن حجر: وقد أجمع العلماء على أن من كان مُصدِّقًا بقلبه ولسانه وفعل هذه الخصال لا يُحكَم عليه بكفر، ولا هو مُنافق يخلد في النار.","قال النووي: وقال جماعة من العلماء: المراد به المنافقون الذين كانوا في زمن النبي صلى الله عليه وسلم فحدَّثوا بإيمانهم، وكذَّبوا، واؤتمنوا على دينهم فخانوا، ووعدوا في أمر الدين ونصره فأخلفوا، وفَجَروا في خصوماتهم."],"r":["صحيح البخاري (1/ 16) (34).","صحيح مسلم (1/ 78) (58)."],"u":"https://hadeethenc.com/ar/browse/hadith/66537"},{"id":2941,"t":"ألا أنبئكم بأكبر الكبائر؟","h":"عن أبي بكرة رضي الله عنه قال: قال النبي صلى الله عليه وسلم: «‌أَلَا ‌أُنَبِّئُكُمْ بِأَكْبَرِ الْكَبَائِرِ؟» ثَلَاثًا، قَالُوا: بَلَى يَا رَسُولَ اللهِ، قَالَ: «الْإِشْرَاكُ بِاللهِ، وَعُقُوقُ الْوَالِدَيْنِ» وَجَلَسَ وَكَانَ مُتَّكِئًا، فَقَالَ: «أَلَا وَقَوْلُ الزُّورِ»، قَالَ: فَمَا زَالَ يُكَرِّرُهَا حَتَّى قُلْنَا: لَيْتَهُ سَكَتَ.","a":"متفق عليه","g":"صحيح","e":"يُخبِرُ النبيُّ صلى الله عليه وسلم أصحابَه عن أعظم الكبائر، فذَكرَ هذه الثلاث: 1. الإشراك بالله: وهو صَرْفُ أيِّ نوعٍ من أنواع العبادة لغير الله، وتسويةُ غيرِ الله بالله في ألوهيته وربوبيته وأسمائه وصفاته. 2. عقوق الوالدين: وهو كلُّ أذى للأبوين، قولًا كان أو فعلًا، وترك الإحسان إليهما. 3. قول الزور ومنه شهادة الزور: وهو كل قول مُزوَّر ومكذوب يراد به انتقاص مَن وقع عليه بأخذ ماله أو الاعتداء على عرضه أو نحو ذلك. وقد كَرَّر النبيُّ صلى الله عليه وسلم التحذيرَ من قول الزور تنبيهًا على استقباحِه وآثارِه السيئة على المجتمع، حتى قال الصحابة: ليته سكت؛ شَفقةً عليه، وكراهية لِما يُزعجه.","f":["أعظم الذنوب الشركُ بالله؛ لأنه جعلَه صَدْرَ الكبائر وأكبرَها، ويؤكد هذا قوله تعالى {إن الله لا يَغْفِرُ أن يشرَكَ به وَيَغْفِرُ مَا دونَ ذلِكَ لِمَنْ يشَاء}.","عظم حقوق الوالدين، إذ قَرَنَ حقَّهما بحق الله تعالى.","الذنوب تنقسم إلى كبائر وصغائر، والكبيرة هي: كلُّ ذنب فيه عقوبة دنيوية، كالحدود واللعن، أو وعيد أُخروي، كالوعيد بدخول النار، وأن الكبائر دركات بعضها أغلظ من بعض في التحريم، وصغائر الذنوب هي ما سوى الكبائر."],"r":["صحيح البخاري (3/ 172) (2654)، (8/ 4) (5976)، (8/ 62) (6273-6274).","صحيح مسلم (1/ 91) (87)."],"u":"https://hadeethenc.com/ar/browse/hadith/2941"},{"id":3044,"t":"الكبائر: الإشراك بالله، وعقوق الوالدين، وقتل النفس، واليمين الغموس","h":"عن عبد الله بن عمرو بن العاص رضي الله عنهما عن النبي صلى الله عليه وسلم قال: «الْكَبَائِرُ: الْإِشْرَاكُ بِاللهِ، وَعُقُوقُ الْوَالِدَيْنِ، وَقَتْلُ النَّفْسِ، وَالْيَمِينُ الْغَمُوسُ».","a":"رواه البخاري","g":"صحيح","e":"يُبَيِّنُ النبيُّ صلى الله عليه وسلم كبائر الذنوب، وهي التي تُوُعِّدَ فاعلُها بوعيد شديد في الدنيا أو الآخرة. فأوَّلُها \"الإِشرَاكُ بِالله\": وهو صَرْفُ أيِّ نوع من أنواع العبادة لغير الله، وتسوية غير الله بالله فيما هو من خصائص الله في ألوهيته وربوبيته وأسمائه وصفاته. وثانيها \"عُقُوقُ الوَالِدَينِ\": وهو كلُّ ما يوجب الأذى للأبوين قولًا كان أو فعلًا، وترك الإحسان إليهما. وثالثها \"قَتْل النَّفْس\": بغير حق، كالقتل ظلمًا وعدوانًا. ورابعها \"اليَمِين الغَمُوسُ\": وهي الحلف كاذبًا على علم منه بكذبه، سميت بذلك؛ لأنَّها تَغْمِسُ صاحبَها في الإِثم أو في النار.","f":["اليمين الغموس لا كفارة لها؛ لشدة خطرها وجرمها، وإنما فيها التوبة.","الاقتصار على ذكر هذه الكبائر الأربع في الحديث لعظيم إثمها، وليس لحصرها.","الذنوب تنقسم إلى كبائر وصغائر، والكبيرة هي: كلُّ ذنب فيه عقوبة دنيوية، كالحدود واللعن، أو وعيد أُخروي، كالوعيد بدخول النار، وأن الكبائر دركات بعضها أغلظ من بعض في التحريم، وصغائر الذنوب هي ما سوى الكبائر."],"r":["صحيح البخاري (8/ 137) (6675).","بهجة الناظرين شرح رياض الصالحين، لسليم الهلالي (1/ 408)."],"u":"https://hadeethenc.com/ar/browse/hadith/3044"},{"id":3331,"t":"اجتنبوا السبع الموبقات","h":"عن أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال: «اجْتَنِبُوا السَّبْعَ الْمُوبِقَاتِ»، قَالُوا: يَا رَسُولَ اللهِ وَمَا هُنَّ؟ قَالَ: «الشِّرْكُ بِاللهِ، وَالسِّحْرُ، وَقَتْلُ النَّفْسِ الَّتِي حَرَّمَ اللهُ إِلَّا بِالْحَقِّ، وَأَكْلُ الرِّبَا، وَأَكْلُ مَالِ الْيَتِيمِ، وَالتَّوَلِّي يَوْمَ الزَّحْفِ، وَقَذْفُ الْمُحْصَنَاتِ الْمُؤْمِنَاتِ الْغَافِلَاتِ».","a":"متفق عليه","g":"صحيح","e":"يأمرُ رسولُ الله صلى الله عليه وسلم أمَّتَه بالابتعاد عن سبع جرائم ومَعاصٍ مهلكاتٍ، ولما سُئل عنها: ما هي؟ بيّنها بأنها: أولًا: الشرك بالله، باتخاذ النظير والمثيل له سبحانه من أي شكل كان، وصَرْف أي عبادة من العبادات لغير الله تعالى، وبدأ بالشرك؛ لأنه أعظم الذنوب. ثانيًا: السحر -وهو عبارة عن عُقََد ورُقَى وأدوية وتدخينات-، يؤثِّر في بَدَن المسحور بالقتل أو بالمرض، أو يفرِّق بين الزوجين، وهو عمل شيطاني، وكثير منه لا يُتَوَصَّل إليه إلا بالشرك والتقرّب إلى الأرواح الخبيثة بشيء مما تحب. ثالثًا: قتل النفس التي منع الله من قتلها إلا بمسوِّغٍ شرعي يُنفِّذُه الحاكم. رابعًا: تناول الربا بأكلٍ أو بغيره من وجوه الانتفاع. خامسًا: التعدِّي على مال الصغير الذي مات أبوه وهو دون البلوغ. سادسًا: الفرار من المعركة مع الكفار. سابعًا: اتهام الحرائر العفيفات بالزنا، وكذلك اتهام الرجال.","f":["الكبائر ليست محصورة في سبع، وتخصيص هذه السبع لِعِظَمِها وخطرِها.","جواز قتل النفس إذا كان بحقٍّ، كالقصاص والردة والزنا بعد إحصان، وينفِّذه الحاكم الشرعي."],"r":["صحيح البخاري (4/ 10) (2766).","صحيح مسلم (1/ 92) (89)."],"u":"https://hadeethenc.com/ar/browse/hadith/3331"},{"id":3342,"t":"أنا أغنى الشركاء عن الشرك، من عمل عملا أشرك فيه معي غيري تركته وشركه","h":"عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «قَالَ اللهُ تَبَارَكَ وَتَعَالَى: أَنَا أَغْنَى الشُّرَكَاءِ عَنِ الشِّرْكِ، مَنْ عَمِلَ عَمَلًا أَشْرَكَ فِيهِ مَعِي غَيْرِي تَرَكْتُهُ وَشِرْكَهُ».","a":"رواه مسلم","g":"صحيح","e":"يُخبِرُ النبيُّ صلى الله عليه وسلم أنَّ الله تبارك وتعالى قال بأنه أغنى الشركاء عن الشرك، فهو الغني عن كل شيء، وأنَّ الإنسانَ إذا عَمِل عملًا من الطاعات وجَعَلَه لله ولغير الله؛ تَركَه اللهُ ولم يقبلْه منه، وردَّه على صاحبِه؛ فيجبُ إخلاصُ العمل لله تعالى؛ لأنه سبحانه لا يَقبل إلا ما كان خالصًا لوجهِه الكريم.","f":["التحذير من الشرك بجميع أشكاله، وأنه مانعٌ من قبول العمل.","استشعار غنى الله وعظمته مما يعين على الإخلاص في العمل."],"r":["صحيح مسلم (4/ 2289) (2985).","شرح النووي على مسلم (18/ 115)."],"u":"https://hadeethenc.com/ar/browse/hadith/3342"},{"id":3417,"t":"أدخله الله الجنة على ما كان من العمل","h":"عَنْ عُبَادَةَ رَضِيَ اللَّهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: «مَنْ شَهِدَ أَنْ لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، وَأَنَّ عِيسَى عَبْدُ اللهِ وَرَسُولُهُ وَكَلِمَتُهُ أَلْقَاهَا إِلَى مَرْيَمَ وَرُوحٌ مِنْهُ، وَالْجَنَّةُ حَقٌّ، وَالنَّارُ حَقٌّ، أَدْخَلَهُ اللهُ الْجَنَّةَ عَلَى مَا كَانَ مِنَ الْعَمَلِ».","a":"متفق عليه","g":"صحيح","e":"يُخْبِرُنا رسولُ الله صلى الله عليه وسلم أنَّ مَن نَطَقَ بكلمةِ التوحيد عارفًا لمعناها عاملًا بمقتضاها، وشهد بعبودية محمد صلى الله عليه وسلم ورسالته، واعترف بعبودية عيسى ورسالته، وأنَّ الله خلقه بقوله \"كن\" فكان، وأنه روح من الأرواح التي خلقها الله، وَبَرَّأَ أُمَّهُ مِمّا نَسَبَه إليها اليهود، وآمن بأن الجنة حق، وأن النار حق، معتقدًا وجودهما، وأنهما نعيم الله وعذابه، ومات على ذلك؛ فمصيره إلى الجنة وإن كان مقصِّرًا في الطاعات، وله ذنوب.","f":["الله تعالى خَلَقَ عيسى ابن مريم بكلمة (كُنْ) من غير أب.","الجمع بين كون عيسى ومحمد صلى الله عليهما وسلم عبدي الله ورسوليه، فهما رسولان لا يكذبان، وعبدان لا يُعْبَدان.","فضل التوحيد وتكفيره للذنوب، وأنَّ مصيرَ الموحِّد الجنةُ وإنْ وقع منه بعض الذنوب."],"r":["صحيح البخاري (4/ 165) (3435).","صحيح مسلم (1/ 57) (28)."],"u":"https://hadeethenc.com/ar/browse/hadith/3417"},{"id":3418,"t":"من لقي الله لا يشرك به شيئا دخل الجنة، ومن لقيه يشرك به دخل النار","h":"عن جابر بن عبد الله رضي الله عنهما قال: سمعت رسول الله صلى الله عليه وسلم يقول: «مَنْ لَقِيَ اللهَ لَا يُشْرِكُ بِهِ شَيْئًا دَخَلَ الْجَنَّةَ، وَمَنْ لَقِيَهُ يُشْرِكُ بِهِ دَخَلَ النَّارَ».","a":"رواه مسلم","g":"صحيح","e":"يُخبرُ النبيُّ صلى الله عليه وسلم أنَّ مَن مات لا يشرك بالله شيئًا فمصيرُه إلى الجنة وإنْ عُذِّبَ على بعضِ ذنوبِه، وأنَّ مَن مات وهو يشرك بالله شيئًا خُلِّد في النار.","f":["فضل التوحيد، وأنه سبب للنجاة من الخلود في النار.","قُرْب الجنة والنار من العبد، وأنه ليس بينه وبينهما إلا الموت.","التحذير من الشرك قليله وكثيرة؛ لأن النجاة من النار بتَجَنُّبِه.","العِبرة في الأعمال بخواتِيمِها."],"r":["صحيح مسلم (1/ 94) (93).","الملخص في شرح كتاب التوحيد، لصالح الفوزان (ص49)."],"u":"https://hadeethenc.com/ar/browse/hadith/3418"},{"id":3475,"t":"من يضمن لي ما بين لحييه وما بين رجليه أضمن له الجنة","h":"عن سهل بن سعد رضي الله عنه عن رسول الله صلى الله عليه وسلم قال: «مَنْ يَضْمَنْ لِي مَا بَيْنَ لَحْيَيْهِ وَمَا بَيْنَ رِجْلَيْهِ أَضْمَنْ لَهُ الْجَنَّةَ».","a":"رواه البخاري","g":"صحيح","e":"يُخبِرُ النبيُّ صلى الله عليه وسلم عن أمرين إذا التزَمَ المسلمُ بهما فإنه يدخل الجنة: الأول: حفظ اللسان من التكلم بما يغضب الله تعالى. والثاني: حفظ الفرج من الوقوع في الفاحشة. لأن هذين العضوين يكثر وقوع المعاصي بهما.","f":["حفظ اللسان والفرج سبيلٌ لدخول الجنة.","خُصَّ اللسان والفرج؛ لأنهما أعظم مَصدَر للبلاء على الإنسان في الدنيا والآخرة."],"r":["صحيح البخاري (8/ 100) (6474).","بهجة الناظرين شرح رياض الصالحين، تأليف سليم الهلالي (3/ 9)."],"u":"https://hadeethenc.com/ar/browse/hadith/3475"},{"id":3581,"t":"الجنة أقرب إلى أحدكم من شراك نعله، والنار مثل ذلك","h":"عن ابن مسعود رضي الله عنه قال: قال النبي صلى الله عليه وسلم: «الْجَنَّةُ أَقْرَبُ إِلَى أَحَدِكُمْ مِنْ شِرَاكِ نَعْلِهِ، وَالنَّارُ مِثْلُ ذَلِكَ».","a":"رواه البخاري","g":"صحيح","e":"أَخبَرَ النبيُّ صلى الله عليه وسلم أنَّ الجنة والنار قريبتان من الإنسان كقُربِ سَيْرِ الحِذاء الذي يكون على ظَهر القَدَم؛ لأنه قد يفعل طاعةً من رضوان الله عز وجل يدخل بها الجنة، أو معصيةً تكون سببًا لدخول النار.","f":["الترغيب في الخير وإن قلَّ، والترهيب عن الشر وإن قلَّ.","لا بد للمسلم في حياته من الجمع بين الرجاء والخوف، وسؤال الله سبحانه دومًا الثبات على الحق حتى يَسْلَمَ ولا يَغْتَرَّ بحالِه."],"r":["صحيح البخاري (8/ 102) (6488).","شرح رياض الصالحين، لابن عثيمين (2/ 99)."],"u":"https://hadeethenc.com/ar/browse/hadith/3581"},{"id":3702,"t":"حجبت النار بالشهوات، وحجبت الجنة بالمكاره","h":"عن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: «حُجِبَتِ النَّارُ بِالشَّهَوَاتِ، وَحُجِبَتِ الْجَنَّةُ بِالْمَكَارِهِ».","a":"رواه البخاري","g":"صحيح","e":"يُبيِّنُ النبيُّ صلى الله عليه وسلم أنَّ النارَ مَحفوفةٌ مُحاطةٌ بالأمور التي تَشتَهيها النفس مِن فِعْل المحرّمات أو التقصير في الواجبات، فمن أَتْبعَ نفسَه هواها في ذلك استحقَّ النار. وأنَّ الجنةَ محفوفةٌ محاطةٌ بالأمور التي تَكرهها النفس؛ كالمُواظَبةِ على المأمورات وترك المحرمات والصبر على ذلك، فإذا صبر وجاهد نفسه على فعل الطاعة وترك المعصية؛ دخل الجنة.","f":["من أسباب الوقوع في الشهوات تزيينُ الشيطانِ المنكرَ والقبيحَ، حتى تراه النفس حسنًا فتَميلُ إليه.","الأمر بالابتعاد عن الشهوات المحرمة؛ لأنها الطريق إلى النار، والصبر على المكاره؛ لأنها الطريق إلى الجنة.","فضل مجاهدة النفس والاجتهاد في العبادة والصبر على المكاره والمشاق التي تحيط بالطاعات."],"r":["صحيح البخاري (8/ 102) (6487).","صحيح مسلم (4/ 2174) (2822)."],"u":"https://hadeethenc.com/ar/browse/hadith/3702"},{"id":4304,"t":"إذا التقى المسلمان بسيفيهما فالقاتل والمقتول في النار","h":"عن أبي بَكرة رضي الله عنه قال: سمعت رسول الله صلى الله عليه وسلم يقول: «إِذَا الْتَقَى الْمُسْلِمَانِ بِسَيْفَيْهِمَا فَالْقَاتِلُ وَالْمَقْتُولُ فِي النَّارِ»، فَقُلْتُ: يَا رَسُولَ اللهِ هَذَا الْقَاتِلُ، فَمَا بَالُ الْمَقْتُولِ؟ قَالَ: «إِنَّهُ كَانَ حَرِيصًا عَلَى قَتْلِ صَاحِبِهِ».","a":"متفق عليه","g":"صحيح","e":"يُخبر النبي صلى الله عليه وسلم أنه إذا التقى المسلمان بسيفيهما، قاصدًا كلٌّ منهما إتلافَ صاحبِه؛ فالقاتل في النار بسبب مباشرته قتلَ صاحبه، واستشكل الصحابةُ المقتولَ: كيف يكون في النار؟ فأخبر النبيُّ صلى الله عليه وسلم أنه أيضًا في النار لحرصِه على قتلِ صاحبه، ولم يَمنعه من القتلِ إلا مبادرةُ القاتل وسبقِه له.","f":["استحقاق العقاب على مَن عَزَمَ على المعصية بقلبه وباشَرَ أسبابَها.","التحذير الشديد من اقتتال المسلمين والوعيد عليه بالنار.","القتال بين المسلمين بحق لا يَدخل في الوعيد، مثل قتال البُغَاة والمُفسدين.","مُرتكب الكبيرة لا يَكْفُرُ بمجرَّد فعلها؛ لأن النبي صلى الله عليه وسلم سمَّى المُتقاتلَينِ مُسلِمَينِ.","إذا التقى المسلمان بأيِّ وسيلة يكون بها القتل، فقَتَلَ أحدُهما الآخرَ فالقاتل والمقتول في النار، وذِكْرُ السيفِ في الحديث على سبيل التمثيل."],"r":["صحيح البخاري (1/ 15) (31).","صحيح مسلم (4/ 2213) (2888)."],"u":"https://hadeethenc.com/ar/browse/hadith/4304"},{"id":3591,"t":"الصلوات الخمس، والجمعة إلى الجمعة، ورمضان إلى رمضان، مكفرات ما بينهن إذا اجتنب الكبائر","h":"عن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم كان يقول: «الصَّلَوَاتُ الْخَمْسُ، وَالْجُمُعَةُ إِلَى الْجُمُعَةِ، وَرَمَضَانُ إِلَى رَمَضَانَ، مُكَفِّرَاتٌ مَا بَيْنَهُنَّ إِذَا اجْتَنَبَ الْكَبَائِرَ».","a":"رواه مسلم","g":"صحيح","e":"يخبر النبي صلى الله عليه وسلم أن الصلوات الخمس المفروضة في اليوم والليلة، وصلاة الجمعة كل أسبوع، وصوم شهر رمضان كل عام، مكفرات لما بينها من صغائر الذنوب بشرط اجتناب الكبائر، أما الكبائر كالزنا وشرب الخمر فلا تُكفر إلا بالتوبة.","f":["الذنوب منها صغائر ومنها كبائر.","تكفير الصغائر مشروط باجتناب الكبائر.","الكبائر هي الذنوب التي ورد فِيهِا حد فِي الدُّنْيَا، أَو جَاءَ فِيهِا وَعِيد فِي الْآخِرَة؛ بالعَذَاب، أَو الغضب، أَو كان فيها تهديدٌ، أَو لعنٌ لفَاعلِها، كالزنى وشرب الخمر."],"r":["صحيح مسلم (1/ 209) (233).","شرح رياض الصالحين، لابن عثيمين (2/ 183)."],"u":"https://hadeethenc.com/ar/browse/hadith/3591"},{"id":5372,"t":"من أحب أن يبسط له في رزقه، وينسأ له في أثره، فليصل رحمه","h":"عن أنس بن مالك رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: «مَنْ أَحَبَّ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ، وَيُنْسَأَ لَهُ فِي أَثَرِهِ، فَلْيَصِلْ رَحِمَهُ».","a":"متفق عليه","g":"صحيح","e":"يَحُثُّ النبيُّ صلى الله عليه وسلم على صِلة الأقاربِ بالزيارة والإكرام البدني والمالي وغير ذلك، وأنها سببٌ في سَعة الرزق وطول العمر.","f":["الرَّحِم هم الأقارب من جهة الأب والأم، وكلما كان أقرب كان أولى بالصلة.","الجزاء من جنس العمل، فمَن وَصَل رَحِمَه بالبر والإحسان، وَصَله الله في عُمْره ورزقه.","صلة الرحم سببٌ لِبَسْطِ الرِّزق وتوسيعه، وسببٌ لطول العمر، وإن كان الأجلُ والرزقُ محددًا إلا أنه قد يكون بركة في الرزق والعمر، فيفعل في عمره أكثر وأنفع مما يفعله غيرُه، وقيل زيادة الرزق والعمر زيادة حقيقية. والله أعلم."],"r":["صحيح البخاري (8/ 5) (5986).","صحيح مسلم (4/ 1982) (2557)."],"u":"https://hadeethenc.com/ar/browse/hadith/5372"},{"id":3162,"t":"يقول الله تعالى : ما لعبدي المؤمن عندي جزاء إذا قبضت صفيه من أهل الدنيا ثم احتسبه إلا الجنة","h":"عن أبي هريرة رضي الله عنه مرفوعًا: «يقول الله تعالى : ما لِعَبدِي المُؤمن عِندِي جَزَاء إِذَا قَبَضتُ صَفِيَّه مِنْ أَهلِ الدُّنيَا ثُمَّ احْتَسَبَه إِلاَّ الجنَّة».","a":"رواه البخاري","g":"صحيح","e":"يخبر النبي -عليه السلام- في هذا الحديث القدسي، أنَّ من ابتلي بفقد حبيبه من قريب ونحو ذلك إذا صبر الإنسان على قبض من يصطفيه الإنسان ويختاره ويرى أنه ذو صلة منه قوية، من ولد، أو أخ، أو عم، أو أب، أو أم، أو صديق، إذا أخذه الله عز وجل ثم احتسبه الإنسان فليس له جزاء إلا الجنة.","f":["أن من صبر على المصيبة واحتسب ثوابها عند الله -تعالى-، فإن جزاءه الجنة.","أن من أعظم المصائب التي تنزل بالإنسان فقد الأحبة.","أن الكافر مهما عمل من عمل صالح، فليس له به عند الله شيء، لعدم الإيمان.","يوفى الصابرون أجرهم بغير حساب وخاتمة ذلك دخول الجنة.","فضيلة الصبر على قبض الحبيب من الدنيا، وأن الله -عز وجل- يجازي الإنسان إذا صبر على ذلك رجاء ما عند الله الجنة.","في الحديث دليل على سعة فضل الله -سبحانه وتعالى- وكرمه على عباده، فإن الملك ملكه، والأمر أمره، ومع ذلك فإذا قبض الله صفي الإنسان واحتسب، فإن له هذا الجزاء العظيم.","الإشارة إلى أفعال الله، من قوله: \"إذا قبضت صفيه\"."],"r":["بهجة الناظرين شرح رياض الصالحين، لسليم الهلالي، ط1، دار ابن الجوزي، الدمام، 1415هـ.","رياض الصالحين للنووي، ط1، تحقيق: ماهر ياسين الفحل، دار ابن كثير، دمشق، بيروت، 1428هـ."],"u":"https://hadeethenc.com/ar/browse/hadith/3162"},{"id":3267,"t":"أفضل دينار ينفقه الرجل، دينار ينفقه على عياله، ودينار ينفقه الرجل على دابته في سبيل الله، ودينار ينفقه على أصحابه في سبيل الله","h":"عَنْ ثَوْبَانَ رضي الله عنه قَالَ: قَالَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: «أَفْضَلُ دِينَارٍ يُنْفِقُهُ الرَّجُلُ، دِينَارٌ يُنْفِقُهُ عَلَى عِيَالِهِ، وَدِينَارٌ يُنْفِقُهُ الرَّجُلُ عَلَى دَابَّتِهِ فِي سَبِيلِ اللهِ، وَدِينَارٌ يُنْفِقُهُ عَلَى أَصْحَابِهِ فِي سَبِيلِ اللهِ» قَالَ أَبُو قِلَابَةَ: وَبَدَأَ بِالْعِيَالِ، ثُمَّ قَالَ أَبُو قِلَابَةَ: وَأَيُّ رَجُلٍ أَعْظَمُ أَجْرًا مِنْ رَجُلٍ يُنْفِقُ عَلَى عِيَالٍ صِغَارٍ، يُعِفُّهُمْ أَوْ يَنْفَعُهُمُ اللهُ بِهِ وَيُغْنِيهِمْ.","a":"رواه مسلم","g":"صحيح","e":"بَيَّنَ صلى الله عليه وسلم صورًا في الإنفاق، ورتّبها إذا تزاحمت أوجه الإنفاق حسب الأوجب عليك، فبدأ بالأهم فالأهم؛ فأخبر أن أكثر المال ثوابًا هو الذي ينفقه المسلم على من تَلزمه نفقته؛ من نحو زوجة وولد، ثم الإنفاق على المركوب المُعَدّ للحرب في سبيل الله، ثم الإنفاق على أصحابه ورفقته حال كونهم مجاهدين في سبيل الله.","f":["ترتيب النفقة في الفضل على الوجه الذي ذُكِر، فيُراعى ذلك عند التزاحم.","بيان أولوية النفقة على العيال في الفضل على غيرها.","النفقة على الجهاد في سبيل الله من أعظم النفقات، مثل إعداد الأدوات والرجال للجهاد.","قيل: المراد بسبيل الله كل طاعة كالحج مثلًا."],"r":["صحيح مسلم (2/ 691) (994).","كنوز رياض الصالحين، لمجموعة من الباحثين (5/ 315)."],"u":"https://hadeethenc.com/ar/browse/hadith/3267"},{"id":3360,"t":"من عال جاريتين حتى تبلغا جاء يوم القيامة أنا وهو وضم أصابعه","h":"عَنْ أَنَسِ بْنِ مَالِكٍ رضي الله عنه قَالَ: قَالَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: «مَنْ عَالَ جَارِيَتَيْنِ حَتَّى تَبْلُغَا جَاءَ يَوْمَ الْقِيَامَةِ أَنَا وَهُوَ» وَضَمَّ أَصَابِعَهُ.","a":"رواه مسلم","g":"صحيح","e":"أَخْبَرَ النبيُّ صلى الله عليه وسلم أنَّ مَن رُزِقَ باثنتين من البنات أو الأخوات، فقام عليهما بالمُؤنة والتربية والتوجيه للخير والتحذير من الشر ونحو ذلك حتى يَكْبُرَا ويَبْلُغا؛ جاء يوم القيامة هو والنبيُّ صلى الله عليه وسلم كهاتَين وضَمّ أصابِعَه السبابة والوسطى.","f":["الثواب العظيم لمن قام على البنات بالمؤونة والتربية حتى يتزوجْن أو يبلغْن، وكذلك الأخوات.","أجر القيام على البنات أعظم من أجر القيام على البنين؛ إذ لم يُذْكَر مثل ذلك في حقِّهم؛ وذلك لأجل أنَّ مؤنة البنات والاهتمام بأمورهن أعظم من أمور البنين؛ لأنهن عورات لا يباشِرْن أمورَهن، ولا يتصرفن تصرف البنين، وكذلك لأنهن لا يتعلق بهن طمع الأب بالاستقواء بهن على الأعداء، وإحياء اسمه واتصال نسبه، وغير ذلك، كما يتعلق بالذكر؛ فاحتيج في ذلك إلى الصبر والإخلاص من المنفق عليهن مع حسن النية؛ فعظم الأجر، فكان رفيق النبي صلى الله عليه وسلم يوم القيامة.","علامات البلوغ للمرأة: إكمال خمس عشرة سنة، أو تحيض ولو قبل خمس عشرة سنة، أو نَبَتتْ لها العانة وهو الشعر الخشن حول القُبُل، أو بالاحتلام وهو إنزال المني في المنام.","قال القرطبي: ويعني ببلوغهما وصولَهما إلى حال يستقلّان بأنفسهما؛ وذلك إنما يكون في النساء إلى أن يدخل بهن أزواجهن، فلا يعني به بلوغهما إلى أن تحيض وتُكلَّف؛ إذ قد تتزوج قبل ذلك فتستغني بالزوج عن قيام الكافل، وقد تحيض وهي غير مستقلة بشيء من مصالحها ولو تركت لضاعت وفسدت أحوالها، بل هي في هذه الحالة أحق بالصيانة والحفظ والقائم عليها لتكمل صيانتها فيرغب في تزويجها، ولهذا المعنى قال علماؤنا لا تسقط النفقة عن والد الصبية ببلوغها بل بدخول الزوج بها."],"r":["صحيح مسلم (4/ 2027) (2631).","بهجة الناظرين شرح رياض الصالحين، لسليم الهلالي (1/ 352)."],"u":"https://hadeethenc.com/ar/browse/hadith/3360"},{"id":3365,"t":"أي العمل أحب إلى الله؟ قال: الصلاة على وقتها، قال: ثم أي؟ قال: ثم بر الوالدين قال: ثم أي؟ قال: الجهاد في سبيل الله","h":"عَنْ عَبْدِ اللَّهِ بِن مَسْعُودٍ رضي الله عنه قَالَ: سَأَلْتُ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: أَيُّ العَمَلِ أَحَبُّ إِلَى اللَّهِ؟ قَالَ: «الصَّلاَةُ عَلَى وَقْتِهَا»، قَالَ: ثُمَّ أَيٌّ؟ قَالَ: «ثُمَّ بِرُّ الوَالِدَيْنِ» قَالَ: ثُمَّ أَيٌّ؟ قَالَ: «الجِهَادُ فِي سَبِيلِ اللَّهِ» قَالَ: حَدَّثَنِي بِهِنَّ، وَلَوِ اسْتَزَدْتُهُ لَزَادَنِي.","a":"متفق عليه","g":"صحيح","e":"سُئلَ النبيُّ صلى الله عليه وسلم: أيُّ العمل أحب إلى الله؟ فقال: الصلاة المفروضة في وقتِها الذي حَدَّده الشارع، ثم بر الوالدين، بالإحسان إليهما، والقيام بحقهما، وترك عقوقهما، ثم الجهاد في سبيل الله، لإعلاء كلمة الله عز وجل، والدفاع عن دين الإسلام وأهله، وإظهار شعائره، وذلك بالنفس والمال. قال ابن مسعود رضي الله عنه: أخبرني بهذه الأعمال؛ ولو قلت له: ثم أي؟ لزادني.","f":["تَفَاضُل الأعمال فيما بينها بحسب محبة الله لها.","حثُّ المسلم على الحرص على الأعمال الأفضل فالأفضل.","تَتَفاوَتُ إجاباتُ النبيِّ صلى الله عليه وسلم عن أفضل الأعمال بحسب اختلاف الأشخاص وأحوالهم، وما هو أكثر نفعًا لكل واحد منهم."],"r":["صحيح البخاري (1/ 112) (527).","صحيح مسلم (1/ 90) (85)."],"u":"https://hadeethenc.com/ar/browse/hadith/3365"},{"id":3446,"t":"أما علمت أن الإسلام يهدم ما كان قبله، وأن الهجرة تهدم ما كان قبلها، وأن الحج يهدم ما كان قبله؟","h":"عن ابن شماسة المهري قال: حَضَرنَا عَمرو بن العاص رضي الله عنه وهُو فِي سِيَاقَةِ الْمَوتِ، فَبَكَى طَوِيلاً، وَحَوَّلَ وَجهَهُ إِلَى الجِدَارِ، فَجَعَلَ ابنَهُ، يقول: يَا أَبَتَاهُ، أَمَا بَشَّرَكَ رسُول الله -صلَّى الله عليه وسلَّم- بكَذَا؟ أمَا بشَّركَ رسول الله -صلَّى الله عليه وسلَّم- بِكَذَا؟ فَأَقبَلَ بِوَجهِهِ، فقَالَ: إِنَّ أَفضَلَ مَا نُعِدُّ شَهَادَةُ أَنْ لاَ إِلَهَ إِلاَّ الله، وَأَنَّ مُحَمَّدًا رسولُ الله، إِنِّي قَدْ كُنتُ عَلَى أَطْبَاقٍ ثَلاَثٍ: لَقَدْ رَأَيتُنِي وَمَا أَحَدٌ أَشَدَّ بُغْضًا لِرَسُولِ الله -صلَّى الله عليه وسلَّم- مِنِّي، وَلاَ أَحَبَّ إِلَيَّ مِنْ أَنْ أَكُونَ قَدْ اسْتَمْكَنْتُ مِنْهُ فَقَتَلْتُهُ، فَلَوْ مُتُّ عَلَى تِلْكَ الحَالِ لَكُنْتُ مِنْ أَهْلِ النَّارِ، فَلَمَّا جَعَلَ اللهُ الإِسْلاَمَ فِي قَلْبِي أَتَيتُ النَبيَّ -صلَّى الله عليه وسلَّم-، فَقُلتُ: ابْسُطْ يَمِينَكَ فَلِأُبَايِعُكَ، فَبَسَطَ يَمِينَهُ فَقَبَضْتُ يَدِي، فقال: «مَا لَكَ يَا عَمرُو؟» قُلتُ: أَرَدْتُ أَنْ أَشْتَرِطَ، قال: «تَشْتَرِطُ مَاذَا؟» قُلتُ: أَنْ يُغْفَرَ لِي، قال: «أَمَا عَلِمتَ أَنَّ الإِسْلاَمَ يَهْدِمُ مَا كَانَ قَبْلَهُ، وَأَنَّ الهِجْرَةَ تَهْدِمُ مَا كَانَ قَبْلَهَا، وَأَنَّ الحَجَّ يَهْدِمُ مَا كَانَ قَبْلَهُ؟» وَمَا كَان أَحَدٌ أَحبَّ إِلَيَّ مِنْ رسُول الله -صلَّى الله عليه وسلَّم- وَلاَ أَجَلَّ فِي عَينِي مِنْهُ، وَمَا كُنْتُ أُطِيقُ أَنْ أَمْلَأَ عَينِي مِنْهُ؛ إِجْلاَلاً لَهُ، وَلَوْ سُئِلْتُ أَنْ أَصِفَهُ مَا أَطَقْتُ؛ لِأَنِّي لَمْ أَكُنْ أَمْلَأُ عَينِي مِنْهُ، وَلَوْ مِتُّ عَلَى تِلْكَ الحَالِ لَرَجَوْتُ أَنْ أَكُونَ مِنْ أَهْلِ الجَنَّةِ، ثُمَّ وَلِينَا أَشْيَاءَ مَا أَدْرِي مَا حَالِي فِيهَا؟ فَإِذَا أَنَا مِتُّ فَلاَ تَصْحَبْنِي نَائِحَةٌ وَلاَ نَارٌ، فَإِذَا دَفَنْتُمُونِي، فَشُنُّوا عَلَيَّ التُرَابَ شَنًّا، ثُمَّ أَقِيمُوا حَولَ قَبرِي قَدْرَ مَا تُنْحَرُ جَزُور، وَيُقْسَمُ لَحْمُهَا، حتَّى أَسْتَأْنِسَ بِكُم، وَأَنْظُر مَا أُرَاجِعُ بِهِ رُسُلَ رَبِّي.","a":"رواه مسلم","g":"صحيح","e":"تضمن حديث عمرو بن العاص رضي الله عنه المتضمن لموضوع التبشير والتهنئة بالخير قصة، وخُلاصة هذه القصة العظيمة: أنَّه حضَره بعض أصحابه وهو في سياق الموت، فبكى بكاء شديدا، وحوَّل وجهه نحو الجدار رضي الله عنه ، وهو في سياق الموت سيفارق الدنيا فقال له ابنه: علام تبكى وقد بشَّرك النبي صلى الله عليه وسلم بالجنة؟ فقال: يا بني إني كنت على أحوال ثلاثة، ثمَّ ذكر هذه الأحوال الثلاث: أنه كان يبغض النبي صلى الله عليه وسلم- بغضا شديدا، وأنه لم يكن على وجه الأرض أحد يبغضه كما كان يبغضه هو، وأنه يَوَدُّ أنَّه لو تمكَّن منه فقتَلَه، وهذا أشد ما يكون من الكفر، حتَّى ألقى الله الإسلام في قلبه فجاء إلى النبي صلى الله عليه وسلم ، فقال يا رسول الله: ابسط يدك فَلِأُبَايِعُكَ علَى الإسلام، وكان النبي صلى الله عليه وسلم أحسن الناس خُلُقًا فمدَّ يده، ولكن عمرو بن العاص كف يده؛ ليس استكبارًا، ولكن استثباتا لما سيذكره، فقال له: \"مالك؟\" قال: يا رسول الله، إني أشترط -يعني على الإسلام-، قال: \"ماذا تشترط؟\" قال: أشترط أن يغفر الله لي ما سبق من الكفر والذنوب. هذا أكبر همِّه رضي الله عنه ، يشترط أنَّ الله يغفر له، ظن أن الله لن يغفر له لما كان له من سابقة، فقال له النبي صلى الله عليه وسلم : \"أما علمت أن الإسلام يهدم ما كان قبله، وأن الهجرة تهدم ما كان قبلها، وأن الحج يهدم ما كان قبله\" ثلاثة أشياء. أما الإسلام: فإنه يهدم ما كان قبله بنص الكتاب العزيز، قال الله عز وجل : {قل للذين كفروا إن ينتهوا يغفر لهم ما قد سلف وإن يعودوا فقد مضت سنت الأولين}. والهجرة: إذا هاجر الإنسان من بلده التي يعيش فيها، وهي بلد كفر هدمت ما قبلها. والحج: يهدم ما قبله؛ لقول النبي صلى الله عليه وسلم : \"الحج المبرور ليس له جزاء إلا الجنة\". فبايع رضي الله عنه وأحب النبي صلى الله عليه وسلم حبًّا شديدًا حتى كان أحب الناس إليه، وحتى إنه لا يستطيع أن يحد النظر فيه؛ إجلالا له -عليه الصلاة والسلام-. سبحان مقلب القلوب! بالأمس كان يبغضه بغضا شديدا، حتى يتمنى أنه يقدر عليه فيقتله، والآن ما يستطيع أن يرفع طرفه إليه؛ إجلالا له، ولا يستطيع أن يصفه؛ لأنه لا يحيط به، حيث إنه لم يدركه إدراكا جيدا؛ مهابة له صلى الله عليه وسلم . يقول رضي الله عنه: إنَّه لو مات على الحال الأول؛ لكان من أهل النار، يقول: ولو مت على تلك الحال يعني الحال الثاني؛ لرجوت أن أكون من أهل الجنة. انظر الاحتياط فقد جزم أنه لو مات على الحال الأولى؛ لكان من أهل النار، أما الحال الثانية فإنه لشدة خوفه قال: لو مت على هذا الحال لرجوت أن أكون من أهل الجنة، ولم يقل: لكنت من أهل الجنة؛ لأن الشهادة بالجنة أمرها صعب. ثم إنه بعد ذلك تولى أمورا رضي الله عنه ، تولى إمارات وقيادات، وحصل ما حصل في قصة حرب معاوية وغيره، وكان عمرو بن العاص معروفا أنه من أدهى العرب وأذكى العرب، فيقول: أخشى من هذا الذي حدث بي بعد الحال الأوسط أن يكون أحاط بعملي. ثم أوصى رضي الله عنه أنه إذا مات لا تتبعه نائحة، والنائحة: هي المرأة التي تنوح على الميت، وتبكي عليه بكاء يشبه نوح الحمام، وأمر رضي الله عنه إذا دفنوه أن يبقوا عند قبره قدر ما ينحر واحد من الإبل، ويقسم لحمه، حتى يراجع رسل ربه وهم الملائكة الذين يأتون إلى الميت إذا دفن، فإن الميت إذا دفن يأتيه ملكان ويجلسانه في قبره، ويسألانه ثلاثة أسئلة: يقولان من ربك؟ وما دينك؟ ومن نبيك؟. فأمر عمرو بن العاص رضي الله عنه أهله أن يقيموا عليه قدر ما تنحر الجزور ويقسم لحمها؛ ليستأنس بهم، وهذا يدل على أن الميت يحس بأهله، وقد ثبت عن النبي -عليه الصلاة والسلام- أن الميت يسمع قرع نعالهم إذا انصرفوا من دفنه، قرع النعال الخفي يسمعه الميت إذا انصرفوا من دفنه. وقد ثبت عن النبي صلى الله عليه وسلم في حديث حسن أنه كان إذا دفن الميت وقف عليه، وقال: \"استغفروا لأخيكم، واسألوا له التثبيت؛ فإنه الآن يسأل\"، فيستحب إذا دفن الميت أن يقف الإنسان على قبره ويقول: اللهم ثبته، اللهم ثبته، اللهم ثبته، اللهم اغفر له، اللهم اغفر له، اللهم اغفر له؛ لأن النبي صلى الله عليه وسلم كان إذا سلم سلم ثلاثا، وإذا دعا دعا ثلاثًا. الحاصل أن ابن عمرو بن العاص قال له: بشرك النبي صلى الله عليه وسلم بالجنة، وهذا من باب البشارة بالخير والتهنئة به.","f":["جواز البكاء عند الاحتضار، رجاء عفو الله، واتعاظ الأحياء الحاضرين.","في هذا الحديث: أن المؤمن لا تفارقه خشية الله ولو عمل من الصالحات ما عمل، كما قال -تعالى-: (والذين يؤتون ما آتوا وقلوبهم وجلة أنهم إلى ربهم راجعون).","استحباب ذكر أحسن أعمال المحتضر عنده؛ ليحسن ظنه بالله -تعالى- ويموت عليه.","تطييب نفس المحتضر وتبشيره برحمة الله وعفوه.","استحباب تنبيه المحتضر على إحسان ظنه بالله -سبحانه وتعالى-، وذكر آيات الرجاء، وأحاديث العفو عنده، وتبشيره بما أعده الله -تعالى- للمسلمين.","أن الكافر إذا أسلم لا يسأل عما مضى من الذنوب.","عِظَم موقع الإسلام والهجرة والحج، وأن كل واحد منها يهدم ما قبله من المعاصي.","أن الهجرة والحج والصلاة تكفر الصغائر من الذنوب، وأن الكبائر تكفرها التوبة بشروطها.","إجلال الصحابة -رضي الله عنهم- لرسول الله -صلى الله عليه وسلم- وحبهم له.","حرمة النياحة على الميت، واتباع جنازته بنار.","امتثال نهي رسول الله -صلى الله عليه وسلم- من عدم اتباعه بنائحة ولا نار.","استحباب الوصية قبل الموت.","استئناس الميت بدعاء إخوانه وأهله له عند قبره.","إثبات فتنة القبر، وسؤال الملكين.","استحباب المكث عند القبر مدة قصيرة؛ للدعاء والاستغفار للميت."],"r":["بهجة الناظرين شرح رياض الصالحين، سليم بن عيد الهلالي، دار ابن الجوزي، الدمام، الطبعة: الأولى 1415هـ.","تطريز رياض الصالحين، فيصل بن عبد العزيز المبارك، تحقيق: عبد العزيز بن عبد الله آل حمد، دار العاصمة للنشر والتوزيع، الرياض، الطبعة: الأولى 1423هـ، 2002م."],"u":"https://hadeethenc.com/ar/browse/hadith/3446"},{"id":3574,"t":"ألا أدلكم على ما يمحو الله به الخطايا، ويرفع به الدرجات؟","h":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه أَنَّ رَسُولَ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: «أَلَا أَدُلُّكُمْ عَلَى مَا يَمْحُو اللهُ بِهِ الْخَطَايَا، وَيَرْفَعُ بِهِ الدَّرَجَاتِ؟» قَالُوا بَلَى يَا رَسُولَ اللهِ قَالَ: «إِسْبَاغُ الْوُضُوءِ عَلَى الْمَكَارِهِ، وَكَثْرَةُ الْخُطَا إِلَى الْمَسَاجِدِ، وَانْتِظَارُ الصَّلَاةِ بَعْدَ الصَّلَاةِ، فَذَلِكُمُ الرِّبَاطُ».","a":"رواه مسلم","g":"صحيح","e":"سَألَ النبيُّ صلى الله عليه وسلم أصحابَه هل يُريدون أنْ يدلَّهم على أعمال تكون سببًا في مغفرة الذنوب، ومحوها من كُتب الحفظة، وعلو المنازل في الجنة؟ قال الصحابة: نعم نريد ذلك. قال: الأول: استيعاب وإتمام الوضوء على مشقة؛ كَبردٍ، وقلة ماء، وألم جسم، وماء حار. الثاني: كثرة الخُطا -وهي ما بين القدمين- إلى المساجد ببعد الدار، وكثرة التكرار. الثالث: انتظار وقت الصلاة، وتعلُّق القلب بها، والتأهب لها، والجلوس لها في المسجد لانتظار الجماعة، فإذا صلاها انتظر في مصلاه صلاةً أخرى. ثم بيَّنَ صلى الله عليه وسلم أنَّ هذه الأمور هي المرابطة الحقيقية؛ لأنها تسد طرق الشيطان على النفس، وتقهر الهوى، وتمنعها من قبول الوساوس، فيغلب بها حزبُ الله جنودَ الشيطان؛ وذلك هو الجهاد الأكبر، فكانت بمنزلة الرباط على ثغر العدو.","f":["أهمية المحافظة على صلاة الجماعة في المسجد، والاهتمام بالصلوات وعدم التشاغل عنها.","حسن عرض النبي صلى الله عليه وسلم وتشويقه لأصحابه حيث بدأهم بثواب عظيم على طريقة السؤال، وهذه طريقة من طرق التعليم.","فائدة عرض المسألة بالسؤال والجواب: أن يكون الكلام أوقع في النفس بحكم الإبهام والتبيين.","قال النووي رحمه الله: فذلكم الرباط أي: الرباط المرغَّب فيه، وأصل الرباط الحبس على الشيء، كأنه حبس نفسه على هذه الطاعة، وقيل: إنه أفضل الرباط كما قيل: الجهاد جهاد النفس، ويحتمل أنه الرباط المتيسر الممكن، أي: إنه من أنواع الرباط.","كررت كلمة \"الرباط\" وعرفت ب(ال) التعريف؛ ذلك تعظيمٌ لشأن هذه الأعمال."],"r":["صحيح مسلم (1/ 219) (251).","كنوز رياض الصالحين، لمجموعة من الباحثين."],"u":"https://hadeethenc.com/ar/browse/hadith/3574"},{"id":8876,"t":"هذا أثْنَيْتُمْ عليه خيرا، فَوَجَبتْ له الجنَّة، وهذا أثْنَيْتُمْ عليه شَرَّا، فَوَجَبَتْ له النَّار، أنتم شُهداء الله في الأرض","h":"عن أنس رضي الله عنه قال: مَرُّوا بجَنَازَةٍ، فأَثْنَوْا عليها خيراً، فقال النبي صلى الله عليه وسلم : «وَجَبَتْ» ثم مَرُّوا بأخرى، فأَثْنَوْا عليها شراً، فقال النبي صلى الله عليه وسلم : «وَجَبَتْ»، فقال عمر بن الخطاب رضي الله عنه : ما وَجَبَتْ؟ فقال: «هذا أَثْنَيْتُمْ عليه خيراً، فوَجَبَتْ له الجنة، وهذا أَثْنَيْتُم عليه شراً، فوَجَبَتْ له النار، أنتم شُهَدَاءُ الله في الأرض».","a":"متفق عليه","g":"صحيح","e":"إن بعض الصحابة مَرُّوا على جنازة فشهدوا لها بالخير والاستقامة على شريعة الله، فلما سمع النبي صلى الله عليه وسلم ثناءهم عليها قال صلى الله عليه وسلم : \"وجَبَت\"، ثم مروا بجنازة أخرى، فشهدوا عليها بالسوء، فقال النبي صلى الله عليه وسلم : وجَبَتْ. فقال عمر بن الخطاب رضي الله عنه : ما معنى: \"وجَبت\" في الموضعين؟ فقال صلى الله عليه وسلم : إن من شَهِدْتم له بالخير والصلاح والاستقامة، فهذا وَجَبتْ له الجنَّة، ومن شَهِدْتم عليه بالسوء، فهذا وَجَبتْ له النار، ولعله كان مشهوراً بنفاق ونحوه. ثم أخبر صلى الله عليه وسلم أن من شهد له أهل الصدق والفضل والصلاح من استحقاقه الجنة أو النار يكون كذلك.","f":["جواز الثناء على الميت؛ لأن فيه شهادة له عند الله -تعالى-، بخلاف الحي، فإنه قد يكون سبباً في الرياء أو الكبر، وغير ذلك من أمراض النفوس.","المُعتبر في مثل هذه الشهادة أهل الفضل والصدق دون غيرهم من الفسقة والمنافقين، فإن شهادتهم مرودة عليهم.","بيان فضيلة هذه الأمة، فهم شهداء الله في الأرض.","جواز ذكر المَرء بما فيه من خَيرٍ أو شَرٍّ ولا يكون ذلك من الغِيبة.","جواز الشهادة قبل الاستشهاد، وقبولها قبل الاستفصال.","جواز السؤال حال وجود الإشكال في كلام المتكلم.","فضيلة عمر -رضي الله عنه-، فإنه بادر بسؤال النبي -صلى الله عليه وسلم- عَمَّا أشْكل عليه."],"r":["نزهة المتقين، تأليف: مصطفى الخن وآخرون، الناشر: مؤسسة الرسالة، الطبعة الأولى: 1397هـ الطبعة الرابعة عشر 1407هـ","بهجة الناظرين، تأليف: سليم بن عيد الهلالي، الناشر: دار ابن الجوزي ، سنة النشر: 1418هـ- 1997م."],"u":"https://hadeethenc.com/ar/browse/hadith/8876"},{"id":10416,"t":"لله تسعة وتسعون اسما، مائة إلا واحدا، لا يحفظها أحد إلا دخل الجنة، وهو وتر يحب الوتر","h":"عن أبي هريرة رضي الله عنه روايةً قال: «للهِ تسعةٌ وتسعون اسمًا، مائةً إلَّا واحدًا، لا يحفظُها أحدٌ إلَّا دخل الجنةَ، وهو وِترٌ يحبُّ الوِتر».","a":"متفق عليه","g":"صحيح","e":"إن اللهَ تعالى له تسعة وتسعون اسمًا، لا يحفظها أحد إلَّا دخل الجنةَ، والمراد بالحفظ القراءة بظهر القلب، وقيل: معناه الإيمان بها، والعمل بها، والطاعة بمعنى كل اسم منها، ودعاء الله تعالى بها، وفي هذا الحديث إثبات هذه الأسماء، وليس فيه نفي ما عداها من الزيادة عليها، وإنما وقع التخصيص لهذه الأسماء لأنها أشهر الأسماء وأبينها معاني، وهذا بمنزلة قولك: إن لزيد مائة درهم أعدها للصدقة، فلا يدل ذلك على أنه ليس عنده من الدراهم أكثر من ذلك، وإنما يدل على أن الذي أعده للصدقة هذا، ويدل على هذا التفسير حديث ابن مسعود: «أسألك بكل اسم هو لك، سميت به نفسك، أو أنزلته في كتابك، أو علمته أحدا من خلقك، أو استأثرت به في علم الغيب عندك» فهذا يدل على أن لله أسماء لم ينزلها في كتابه حجبها عن خلقه. «وهو وتر» أي: الله واحد لا شريك له «يحب الوتر» يعني: يفضله في الأعمال وكثير من الطاعات ولهذا جعل الله الصلوات خمسًا، والطواف سبعًا، وندب التثليث في أكثر الأعمال، وخلق السموات سبعًا والأرضين سبعا وغير ذلك.","f":["أشهر أسمائه تعالى هو الله؛ لإضافة الأسماء إليه، وقيل: هو الاسم الأعظم.","إثبات هذه الأسماء، وليس فيه نفي ما عداها من الزيادة عليها، وإنما وقع التخصيص لهذه الأسماء لأنها أشهر الأسماء وأبينها معاني.","الوتر وهو العدد المفرد، مفضَّل في الأعمال وكثير من الطاعات."],"r":["صحيح البخاري، نشر: دار طوق النجاة (مصورة عن السلطانية بإضافة ترقيم محمد فؤاد عبد الباقي)، الطبعة: الأولى، 1422هـ.","صحيح مسلم، تحقيق: محمد فؤاد عبد الباقي، نشر: دار إحياء التراث العربي – بيروت."],"u":"https://hadeethenc.com/ar/browse/hadith/10416"},{"id":65838,"t":"مَن أصبح منكم اليوم صائمًا؟","h":"عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «مَن أصبح منكم اليوم صائمًا؟» قال أبو بكر رضي الله عنه: أنا، قال: «فمن تَبِعَ منكم اليوم جنازةً؟» قال أبو بكر رضي الله عنه: أنا، قال: «فمن أطعم منكم اليوم مسكينًا؟» قال أبو بكر رضي الله عنه: أنا، قال: «فمن عاد منكم اليوم مريضًا؟» قال أبو بكر رضي الله عنه: أنا، فقال رسول الله صلى الله عليه وسلم: «ما اجتمعن في امرئٍ إلا دخل الجنة».","a":"رواه مسلم","g":"صحيح","e":"سأل النبي صلى الله عليه وسلم عمن أصبح من الصحابة صائمًا ذلك اليوم، فأخبر أبو بكر بأنه أصبح صائمًا، ثم سأل عمن تبع منهم جنازةً، فأجاب أبو بكر أيضًا بأنه تبع جنازةً، ثم سأل عمن أطعم اليوم مسكينًا، فرد أبو بكر أنه أطعم مسكينًا، وفي بعض الروايات أنه وجده في المسجد، ثم سأل عمن زار مريضًا، فكان أبو بكر كذلك هو من زار مريضًا، فقال النبي صلى الله عليه وسلم: ما اجتمعت هذه الأربعة أعمال في أحدٍ في يومٍ واحدٍ إلا دخل الجنة. وظاهره أن مَن اجتمع له فعل هذه الأعمال في يوم واحد دخل الجنة، فإنه قال فيها كلها: اليوم، اليوم، ولما أخبره أبو بكر رضي الله عنه أنه فعل تلك الأمور كلها في ذلك اليوم بشره بأنه من أهل الجنة.","f":["فضل المبادرة إلى فعل خصال الخير.","فضل أبي بكر رضي الله عنه حيث خصه الله تعالى بتوفيقه لتلك الخصال الحميدة، فنال بذلك فضل الجنة، وحيث حَرِصَ على فعل الطاعات المتنوعة، وتتبعه أبوابها، في الوقت الوجيز.","الدلالة على ما كان النبي صلى الله عليه وسلم عليه من التفقد لأحوال أصحابه، وإرشادهم إلى فعل الخير على اختلاف أنواعه، ومسألتهم عما يتسابقون فيه من خصال الخير، حتى يبين للناس السابقون، فيقتدوا بهم.","أعمال البر قل أن تجتمع جميعها لشخص واحد على السواء.","عظيم فضل الله تعالى على عباده، حيث ييسر لبعضهم أنواعًا من أبواب الخير حتى ينالوا بذلك الدرجات العلى، ولذا يثنون عليه في الآخرة بذلك حيث يقولون: {الحمد لله الذي هدانا لهذا وما كنا لنهتدي لولا أن هدانا الله}.","فضل اجتماع الأعمال الأربعة في يومٍ واحدٍ."],"r":["صحيح مسلم (2/ 713) (1028)، المفهم لما أشكل من تلخيص كتاب مسلم (6/ 245)، البحر المحيط الثجاج في شرح صحيح الإمام مسلم بن الحجاج (19/ 532)."],"u":"https://hadeethenc.com/ar/browse/hadith/65838"},{"id":2967,"t":"رباط يوم في سبيل الله خير من الدنيا وما عليها","h":"عَنْ سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: «رِبَاطُ يَوْمٍ فِي سَبِيلِ اللَّهِ خَيْرٌ مِنَ الدُّنْيَا وَمَا عَلَيْهَا، وَمَوْضِعُ سَوْطِ أَحَدِكُمْ مِنَ الجَنَّةِ خَيْرٌ مِنَ الدُّنْيَا وَمَا عَلَيْهَا، وَالرَّوْحَةُ يَرُوحُهَا العَبْدُ فِي سَبِيلِ اللَّهِ أَوِ الغَدْوَةُ خَيْرٌ مِنَ الدُّنْيَا وَمَا عَلَيْهَا».","a":"متفق عليه","g":"صحيح","e":"يخبر النبي صلى الله عليه وسلم أن ملازمة المكان الذي بين المسلمين والكفار لحراسة المسلمين منهم ليوم واحد مُخلصًا لله خير من الدنيا وما فيها، وأن موضع السوط الذي يجاهد به في سبيل الله في الجنة خير من الدنيا وما فيها، وأن أجر وثواب السير في الوقت الذي من أول النهار إلى بداية وقت الظهر، أو الروحة: من وقت الظهر إلى الليل في سبيل الله مرة واحدة، خير من الدنيا وما فيها.","f":["فضل الرباط في سبيل الله، لما فيه من المخاطرة بالنفس، ولما يترتب عليه من إعلاء كلمة الله ونصر دينه؛ لذا فإن ثواب يوم واحد، خير من الدنيا وما فيها.","حقارة الدنيا بالنسبة للآخرة؛ لأن موضع السوط من الجنة، خير من الدنيا وما فيها.","فضل الجهاد في سبيل الله، وعظم ثوابه؛ لأن ثواب الروحة الواحدة أو الغدوة، خير من الدنيا وما فيها.","قوله: \"في سبيل الله\" فيه الدلالة على أهمية الإخلاص، وأن الأجر مترتب عليه."],"r":["صحيح البخاري (4/ 35) (2892).","صحيح مسلم (3/ 1500) (1881)."],"u":"https://hadeethenc.com/ar/browse/hadith/2967"},{"id":3366,"t":"إن أثقل صلاة على المنافقين صلاة العشاء وصلاة الفجر، ولو يعلمون ما فيهما لأتوهما ولو حبوا","h":"عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «‌إِنَّ ‌أَثْقَلَ صَلَاةٍ عَلَى الْمُنَافِقِينَ صَلَاةُ الْعِشَاءِ وَصَلَاةُ الْفَجْرِ، وَلَوْ يَعْلَمُونَ مَا فِيهِمَا لَأَتَوْهُمَا وَلَوْ حَبْوًا، وَلَقَدْ هَمَمْتُ أَنْ آمُرَ بِالصَّلَاةِ فَتُقَامَ، ثُمَّ آمُرَ رَجُلًا فَيُصَلِّيَ بِالنَّاسِ، ثُمَّ أَنْطَلِقَ مَعِي بِرِجَالٍ مَعَهُمْ حُزَمٌ مِنْ حَطَبٍ إِلَى قَوْمٍ لَا يَشْهَدُونَ الصَّلَاةَ، فَأُحَرِّقَ عَلَيْهِمْ بُيُوتَهُمْ بِالنَّارِ».","a":"متفق عليه","g":"صحيح","e":"يُخْبِرُ النبيُّ صلى الله عليه وسلم عن المنافقين وتَكَاسُلِهم عن حضور الصلاة، خاصة صلاتي العشاء والفجر، وأنهم لو يعلمون قَدْرَ الأجر والثواب في حضورهما مع جماعة المسلمين لأتوهما ولو حَبْوًا كَحَبْوِ الطفل بالأيدي والركب. ولقد عَزَمَ النبيُّ صلى الله عليه وسلم بأن يأمر بالصلاة فتقام، ويَجعل رجلًا يؤم الناسَ مكانه، ثم ينطلق ومعه من يحمل حُزَمًا من حطبٍ إلى رجال لا يشهدون صلاة الجماعة فيُحرِّق عليهم بيوتهم بالنار؛ لشدة ما ارتكبوه من الإثم في ذلك، -ولكنه لم يفعل- لما في البيوت من النساء والصبيان الأبرياء وغيرهم من المعذورين، الذين لا ذنب لهم.","f":["خطورة التَّخَلُّف عن صلاة الجماعة في المسجد.","المنافقون لم يقصدوا بعبادتهم إلا الرياء والسمعة، فلا يأتون إلى الصلاة إلا حين يشاهدهم الناس.","عِظَم الثواب في صلاتي العشاء والفجر مع الجماعة، وأنهما جديرتان بالإتيان إليهما ولو حبوًا.","الحفاظ على صلاة العِشاء والفجر سلامة من النفاق، والتخلف عنهما من صفات المنافقين."],"r":["صحيح مسلم (1/ 451) (651).","صحيح البخاري (1/ 132) (657)."],"u":"https://hadeethenc.com/ar/browse/hadith/3366"},{"id":3591,"t":"الصلوات الخمس، والجمعة إلى الجمعة، ورمضان إلى رمضان، مكفرات ما بينهن إذا اجتنب الكبائر","h":"عن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم كان يقول: «الصَّلَوَاتُ الْخَمْسُ، وَالْجُمُعَةُ إِلَى الْجُمُعَةِ، وَرَمَضَانُ إِلَى رَمَضَانَ، مُكَفِّرَاتٌ مَا بَيْنَهُنَّ إِذَا اجْتَنَبَ الْكَبَائِرَ».","a":"رواه مسلم","g":"صحيح","e":"يخبر النبي صلى الله عليه وسلم أن الصلوات الخمس المفروضة في اليوم والليلة، وصلاة الجمعة كل أسبوع، وصوم شهر رمضان كل عام، مكفرات لما بينها من صغائر الذنوب بشرط اجتناب الكبائر، أما الكبائر كالزنا وشرب الخمر فلا تُكفر إلا بالتوبة.","f":["الذنوب منها صغائر ومنها كبائر.","تكفير الصغائر مشروط باجتناب الكبائر.","الكبائر هي الذنوب التي ورد فِيهِا حد فِي الدُّنْيَا، أَو جَاءَ فِيهِا وَعِيد فِي الْآخِرَة؛ بالعَذَاب، أَو الغضب، أَو كان فيها تهديدٌ، أَو لعنٌ لفَاعلِها، كالزنى وشرب الخمر."],"r":["صحيح مسلم (1/ 209) (233).","شرح رياض الصالحين، لابن عثيمين (2/ 183)."],"u":"https://hadeethenc.com/ar/browse/hadith/3591"},{"id":5435,"t":"من صلى صلاة الصبح فهو في ذمة الله","h":"عن جُندب بن عبد الله القَسْرِِي رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «مَنْ صَلَّى صَلَاةَ الصُّبْحِ فَهُوَ فِي ذِمَّةِ اللهِ، فَلَا يَطْلُبَنَّكُمُ اللهُ مِنْ ذِمَّتِهِ بِشَيْءٍ، فَإِنَّهُ مَنْ يَطْلُبْهُ مِنْ ذِمَّتِهِ بِشَيْءٍ يُدْرِكْهُ، ثُمَّ يَكُبَّهُ عَلَى وَجْهِهِ فِي نَارِ جَهَنَّمَ».","a":"رواه مسلم","g":"صحيح","e":"يُخْبِرُ النبيُّ صلى الله عليه وسلم أنَّ مَن صلى الفجر فهو في حِفْظ الله وحراستِه وحمايته، يدافع عنه، وينتصر له. ثم حَذَّرَ عليه الصلاة والسلام مِن نَقْضِ هذا العهدِ وإبطاله، إما بترك صلاة الفجر، أو بالتعرُّض لمصليها والاعتداء عليه، فإنَّ مَن فَعَلَ ذلك فقد خَرَِقَ هذا الجِوار، واستحق الوعيد الشديد بأن يَطلُبَه الله بما فَرَّطَ في حقه، ومَن يطلبه الله يُدركه، ثم يلقيه على وجهه في النار.","f":["بيان أهمية صلاة الفجر وفضيلتها.","التحذير الشديد من التعرض بسوء لمن صلى الفجر.","انتقام الله تعالى ممن يتعرض لعباده الصالحين."],"r":["صحيح مسلم (1/ 454) (657).","المعجم الأوسط (4/ 5) (3464)."],"u":"https://hadeethenc.com/ar/browse/hadith/5435"},{"id":65003,"t":"أرأيت إذا صليت الصلوات المكتوبات، وصمت رمضان، وأحللت الحلال، وحرمت الحرام","h":"عن جابر رضي الله عنه: أَنَّ رَجُلًا سَأَلَ رَسُولَ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، فَقَالَ: أَرَأَيْتَ إِذَا صَلَّيْتُ الصَّلَوَاتِ الْمَكْتُوبَاتِ، وَصُمْتُ رَمَضَانَ، وَأَحْلَلْتُ الْحَلَالَ، وَحَرَّمْتُ الْحَرَامَ، وَلَمْ أَزِدْ عَلَى ذَلِكَ شَيْئًا، أَأَدْخُلُ الْجَنَّةَ؟ قَالَ: «نَعَمْ»، قَالَ: وَاللهِ لَا أَزِيدُ عَلَى ذَلِكَ شَيْئًا.","a":"رواه مسلم","g":"صحيح","e":"يُبَيِّنُ النبي صلى الله عليه وسلم أن من صلى الصلوات الخمس المفروضات ولم يزد عليها شيئًا من النوافل، وصام رمضان ولم يتطوع، واعتقد حِلَّ الحلال وفَعَله، واعتقد حُرمة الحرام واجتنبه، أنه يدخل الجنة.","f":["حرص المسلم على فعل الفرائض وترك المحرمات، وأن تكون غايته دخول الجنة.","أهمية فعل الحلال واعتقاد حِلَّه، وتحريم الحرام واعتقاد حرمته.","فعل الواجبات وترك المحرمات سبب لدخول الجنة."],"r":["صحيح مسلم (1/ 44) (15).","جامع العلوم والحكم (1/513). شرح الأربعين النووية للعثيمين (ص: 215)."],"u":"https://hadeethenc.com/ar/browse/hadith/65003"},{"id":65004,"t":"الطهور شطر الإيمان، والحمد لله تملأ الميزان، وسبحان الله والحمد لله تملآن أو تملأ ما بين السماوات والأرض","h":"عن أبي مالكٍ الأشعريِّ رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «الطُّهُورُ شَطْرُ الْإِيمَانِ، وَالْحَمْدُ لِلهِ تَمْلَأُ الْمِيزَانَ، وَسُبْحَانَ اللهِ وَالْحَمْدُ
